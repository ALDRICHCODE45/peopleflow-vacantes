<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil · alineación · PeopleFlow</title>
<style>
/* base — tokens from design/system.md (frontend/src/app/globals.css); shell from candidate-saved-modern/02.
   Card, button, input, segmented and badge recipes follow the implemented code (system.md «Radius», «Component rules»). */
:root{
  --background:#F7F5FB;--foreground:#1A1626;--card:#FFFFFF;--card-foreground:#1A1626;--popover:#FFFFFF;
  --primary:oklch(0.491 0.27 292.581);--primary-foreground:oklch(0.969 0.016 293.756);
  --secondary:#F1EEF7;--muted:#F1EEF7;--accent:#F1EEF7;--muted-foreground:#6B6480;
  --border:#E4DFF0;--input:#E4DFF0;--destructive:oklch(0.577 0.245 27.325);--ring:oklch(0.708 0 0);
  --brand-decorative-strong:oklch(0.54 0.15 292.581);
  --status-info:oklch(0.45 0.16 250);--status-review:oklch(0.47 0.12 70);
  --status-success:oklch(0.46 0.13 152);--status-danger:oklch(0.45 0.2 25);
  --sidebar:oklch(0.985 0 0);--sidebar-foreground:oklch(0.145 0 0);--sidebar-accent:oklch(0.97 0 0);
  --sidebar-accent-foreground:oklch(0.205 0 0);--sidebar-border:oklch(0.922 0 0);
  --radius:0.625rem;
  --primary-text:var(--primary);
  --font-sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-card:min(calc(var(--radius)*2.6),24px);--r-btn:calc(var(--radius)*1.8);--r-xl:calc(var(--radius)*1.4);--r-lg:var(--radius);--r-md:calc(var(--radius)*.8);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1);
  --card-ring:color-mix(in srgb,var(--foreground) 5%,transparent);
  color-scheme:light;
}
.dark{
  --background:#0C0912;--foreground:#F6F2FF;--card:#15121F;--card-foreground:#F6F2FF;--popover:#1A1626;
  --primary:oklch(0.432 0.232 292.759);--secondary:#171226;--muted:#171226;--accent:#171226;
  --muted-foreground:#A79FBF;--border:#262233;--input:#262233;--destructive:oklch(0.704 0.191 22.216);--ring:oklch(0.556 0 0);
  --brand-decorative-strong:oklch(0.70 0.14 292.759);
  --status-info:oklch(0.78 0.12 245);--status-review:oklch(0.82 0.12 78);
  --status-success:oklch(0.78 0.14 155);--status-danger:oklch(0.75 0.15 22);
  --sidebar:oklch(0.205 0 0);--sidebar-foreground:oklch(0.985 0 0);--sidebar-accent:oklch(0.269 0 0);
  --sidebar-accent-foreground:oklch(0.985 0 0);--sidebar-border:oklch(1 0 0 / 10%);
  --primary-text:var(--brand-decorative-strong);
  --card-ring:color-mix(in srgb,var(--foreground) 10%,transparent);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--foreground);background:var(--sidebar);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--brand-decorative-strong);outline-offset:2px}
.skip{position:absolute;left:16px;top:-48px;z-index:60;background:var(--card);padding:10px 14px;border-radius:8px}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted-foreground)}

/* artboard-only design controls */
.design-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px dashed color-mix(in srgb,var(--brand-decorative-strong) 50%,transparent);background:var(--background)}
.design-bar>small{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin-right:4px}
.design-ctl{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1.5px dashed var(--brand-decorative-strong);border-radius:var(--radius);
  background:var(--card);color:var(--brand-decorative-strong);font-size:12px;font-weight:600}
.design-ctl[aria-pressed="true"]{border-style:solid;background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.design-ctl[aria-pressed="true"]::before{content:"✓"}

/* stage: one frame, or «Ver actual» (today | aligned) side by side */
.stage{display:flex;flex-direction:column;min-width:0}
.stage.cmp{flex-direction:row;flex-wrap:wrap;gap:16px;padding:16px;background:color-mix(in srgb,var(--muted-foreground) 10%,var(--background));align-items:flex-start}
.pane{min-width:0;flex:1 1 0}
.stage.cmp .pane{display:flex;flex-direction:column;gap:8px;align-items:center}
.pane-label{align-self:stretch;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}
.pane-label i{font-style:normal;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-md);background:var(--card);box-shadow:inset 0 0 0 1px var(--border);color:var(--foreground);letter-spacing:0;text-transform:none;font-weight:500}
.pane[data-pane="new"] .pane-label i{background:color-mix(in srgb,var(--primary) 12%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 40%,transparent)}
.stage.cmp .frame{width:1440px;flex:none;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--border),0 8px 24px color-mix(in srgb,var(--foreground) 10%,transparent)}
.stage.cmp.stack{flex-direction:column;padding:0;gap:0}
.stage.cmp.stack .pane{width:100%}
.stage.cmp.stack .pane-label{padding:12px 16px 4px}
.stage.cmp.stack .frame{width:100%;border-radius:0;box-shadow:none}

/* candidate shell */
.frame{container:frame / inline-size;position:relative;background:var(--sidebar);min-width:0}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - 57px)}
.stage.cmp .app{min-height:900px}
.app.collapsed{grid-template-columns:64px minmax(0,1fr)}
.side{position:sticky;top:0;align-self:start;height:calc(100vh - 57px);min-height:640px;display:flex;flex-direction:column;gap:8px;padding:8px;color:var(--sidebar-foreground);background:var(--sidebar)}
.stage.cmp .side{position:static;height:auto;min-height:876px}
.brand-row{display:flex;align-items:center;gap:10px;height:48px;padding:6px;border-radius:12px}
.brand-mark{width:32px;height:32px;border-radius:999px;background:var(--primary);display:grid;place-items:center;flex:none}
.wordmark{font-size:18px;font-weight:700;letter-spacing:-.02em}
.wordmark span{color:var(--primary-text)}
.side-group{display:flex;flex-direction:column;gap:2px;padding:8px}
.side-label{height:32px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--sidebar-foreground) 70%,transparent)}
.side a.nav{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:12px;font-size:14px;white-space:nowrap;overflow:hidden}
.side a.nav:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.side a.nav[aria-current="page"]{background:var(--sidebar-accent);font-weight:500}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;min-height:48px;border:0;background:transparent;text-align:left;width:100%}
.side-user:hover{background:var(--sidebar-accent)}
.avatar{width:32px;height:32px;border-radius:10px;background:var(--secondary);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--foreground);flex:none}
.side-user b{display:block;font-weight:500;font-size:14px;line-height:18px}
.side-user div span{display:block;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.app.collapsed .side .lbl,.app.collapsed .side-label,.app.collapsed .wordmark,.app.collapsed .side-user>div{display:none}
.app.collapsed .side a.nav{justify-content:center;padding:0;width:40px;margin:0 auto}
.app.collapsed .side-group{padding:4px 0}
.inset{min-width:0;margin:12px 12px 12px 0;background:var(--background);border-radius:calc(var(--radius)*2.2);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 15%,transparent),0 4px 6px -1px color-mix(in srgb,var(--foreground) 8%,transparent),0 2px 4px -2px color-mix(in srgb,var(--foreground) 6%,transparent);
  display:flex;flex-direction:column;overflow-x:clip;position:relative}
.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-bottom:1px solid var(--border);flex:none}
.top h1{font-size:16px;line-height:24px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{width:1px;height:16px;background:var(--border);margin:0 8px}
.ghost-ic{width:40px;height:40px;margin:-4px;border:0;border-radius:var(--radius);background:transparent;display:grid;place-items:center;color:var(--foreground)}
.ghost-ic:hover{background:var(--muted)}
.top .end{margin-left:auto;display:flex;align-items:center;gap:8px}
main{padding:24px;min-width:0}
main:focus{outline:none}
.page{max-width:1536px;margin:0 auto;display:flex;flex-direction:column;gap:24px;min-width:0}
.scrim{display:none}

/* shared parts (code recipes) */
.card{position:relative;background:var(--card);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0;
  box-shadow:var(--shadow-sm),0 0 0 1px var(--card-ring)}
.cap{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-btn);font-size:14px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 80%,transparent)}
.btn-outline{background:var(--background);border-color:var(--border)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{color:var(--muted-foreground);padding:0 12px}
.btn-ghost:hover{background:var(--muted);color:var(--foreground)}
.btn-danger{color:var(--destructive);padding:0 12px}
.btn-danger:hover{background:color-mix(in srgb,var(--destructive) 10%,transparent)}
.btn-ic{width:40px;padding:0}
.link{color:var(--primary-text);font-weight:500;border-radius:4px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.help{width:40px;height:40px;border:0;background:transparent;border-radius:var(--radius);display:inline-grid;place-items:center;color:var(--muted-foreground);flex:none}
.help:hover,.help[aria-expanded="true"]{background:var(--muted);color:var(--foreground)}
/* badge (components/ui/badge.tsx) */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:var(--r-md);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;border:1px solid transparent;flex:none}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
.b-info,.b-review,.b-success{--t:var(--status-info);color:var(--t);border-color:color-mix(in oklch,var(--t) 40%,transparent);background:color-mix(in oklch,var(--t) 10%,transparent)}
.b-review{--t:var(--status-review)}
.b-success{--t:var(--status-success)}
.b-neutral{color:var(--muted-foreground);background:var(--muted);border-color:var(--border)}
.b-accent{color:var(--foreground);border-color:color-mix(in oklch,var(--primary) 40%,transparent);background:color-mix(in oklch,var(--primary) 12%,transparent)}
.b-secondary{background:var(--secondary);color:var(--foreground)}
/* company logo tile (PublicCompanyAvatar fallback: initials on --background, 1 px border, primary text) */
.logo{width:48px;height:48px;border-radius:var(--r-xl);display:grid;place-items:center;flex:none;font-size:15px;font-weight:600;color:var(--primary);background:var(--background);box-shadow:inset 0 0 0 1px var(--border)}
.dark .logo{color:var(--primary-text)}
.logo.lg{width:64px;height:64px;border-radius:calc(var(--radius)*1.8);font-size:19px}
/* inputs (input.tsx / input-group.tsx) */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.field>.lbl{font-size:14px;line-height:20px;font-weight:500}
.ctl{display:flex;align-items:center;gap:8px;min-height:40px;width:100%;min-width:0;padding:0 10px;border-radius:var(--r-btn);border:1px solid transparent;background:color-mix(in srgb,var(--input) 50%,transparent)}
.ctl input,.ctl textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:8px 0;outline:none}
.ctl textarea{resize:none;min-height:96px;line-height:20px}
.ctl:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}
.ctl .unit{font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.ctl.sel{justify-content:space-between;padding:0 12px}
.ctl.sel span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl.sel svg{color:var(--muted-foreground)}
.ctl.area{align-items:flex-start;max-width:65ch}
.fdesc{font-size:14px;line-height:20px;color:var(--muted-foreground)}
/* segmented (toggle-group.tsx variant="segmented") */
.seg{display:inline-flex;align-items:stretch;gap:2px;height:36px;padding:4px;border-radius:var(--r-xl);background:var(--muted);max-width:100%;min-width:0}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:0;border-radius:var(--r-lg);background:transparent;font-weight:500;color:color-mix(in srgb,var(--foreground) 70%,transparent);white-space:nowrap;min-width:0}
.dark .seg button{color:var(--muted-foreground)}
.seg button:hover{color:var(--foreground)}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground);box-shadow:var(--shadow-sm)}
.dark .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--foreground) 10%,transparent);box-shadow:none}
.seg .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-md);font-size:12px;font-weight:500;background:var(--secondary);color:var(--foreground);font-variant-numeric:tabular-nums}
/* popover / menu */
.pop{position:absolute;z-index:40;width:300px;max-width:calc(100% - 16px);background:var(--popover);border-radius:var(--r-card);padding:20px;
  box-shadow:0 12px 32px color-mix(in srgb,var(--foreground) 14%,transparent),0 0 0 1px var(--border)}
.pop h3{font-size:15px;line-height:22px;font-weight:600}
.pop p{margin-top:8px;color:var(--muted-foreground)}
.pop p.foot{font-size:12px;line-height:16px}
.menu{position:absolute;z-index:40;right:0;top:calc(100% + 4px);min-width:176px;padding:4px;border-radius:var(--r-xl);background:var(--popover);display:flex;flex-direction:column;
  box-shadow:0 12px 32px color-mix(in srgb,var(--foreground) 14%,transparent),0 0 0 1px var(--border)}
.menu button{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border:0;border-radius:var(--r-lg);background:transparent;text-align:left}
.menu button:hover{background:var(--muted)}
.menu .danger{color:var(--destructive)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px -4px}
/* skeleton (components/ui/skeleton.tsx: rounded-2xl bg-muted animate-pulse) */
.sk{display:block;border-radius:calc(var(--radius)*1.8);background:var(--muted)}
.dark .sk{background:var(--border)}
@media (prefers-reduced-motion:no-preference){
  .sk{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
  @keyframes pulse{50%{opacity:.5}}
  .btn,.side a.nav,.ghost-ic,.help,.link,.design-ctl,.seg button,.menu button{transition:background-color .15s ease,color .15s ease}
  /* entrance: once on load, ease-out 320 ms, transform + opacity only, 40 ms stagger over ≤ 4 cards */
  .enter .rv{animation:rv .32s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d,0) * 40ms)}
  .enter .arc{animation:arc .4s cubic-bezier(.22,1,.36,1) .08s both}
  .enter .grow-x{animation:grow .36s cubic-bezier(.22,1,.36,1) .08s both;transform-origin:left center}
  @keyframes rv{from{opacity:0;transform:translateY(6px)}}
  @keyframes arc{from{stroke-dashoffset:var(--c)}}
  @keyframes grow{from{transform:scaleX(0)}}
}

/* 390 px preview */
.m390 .stage:not(.cmp){background:color-mix(in srgb,var(--muted-foreground) 14%,var(--background))}
.m390 .frame{width:390px!important;flex:none}
.m390 .stage:not(.cmp) .frame{margin:32px auto 40px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px var(--border),0 12px 32px color-mix(in srgb,var(--foreground) 14%,transparent)}
.m390 .stage.cmp .frame{border-radius:28px}
.m390 .app,.m390 .stage.cmp .app{min-height:auto}
@container frame (max-width:1100px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{display:none;position:absolute;z-index:45;top:0;left:0;bottom:0;height:auto;width:288px;max-width:85%;box-shadow:0 12px 32px color-mix(in srgb,#000 24%,transparent)}
  .stage.cmp .side{position:absolute;min-height:0}
  .app.open .side{display:flex}
  .app.open .scrim{display:block;position:absolute;inset:0;z-index:44;background:color-mix(in srgb,#0C0912 40%,transparent)}
  .inset{margin:0;border-radius:0;box-shadow:none}
}
@container frame (max-width:560px){
  .top{padding:0 16px}
  main{padding:16px 16px 32px}
  .card{padding:16px}
}
@media (max-width:600px){
  .design-bar{padding:8px 12px}
  .design-ctl{min-height:32px;padding:0 10px}
}

/* aligned language: page header, section card, list row, chips, ring, first-use empty */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.head h2{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.025em}
.head h2:focus{outline:none}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px;font-size:14px;line-height:20px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;min-height:20px}
.sum b{color:var(--foreground);font-weight:600}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.tools .seg{height:44px}
.search{width:240px;min-height:44px}
.search svg{color:var(--muted-foreground)}
.sec{padding:20px 12px 8px;gap:4px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:4px 12px;padding:0 12px 8px}
.sec-head h3{display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:600}
.sec-head .cap{margin-top:2px}
.sec-head .btn-ghost{margin:-6px -4px 0 0}
.panel{padding:24px;gap:16px}
.panel>h3,.panel-h{font-size:18px;line-height:28px;font-weight:600}
.rows{display:flex;flex-direction:column;gap:4px}
.lrow{position:relative;width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto 16px;align-items:center;gap:14px;min-height:64px;padding:12px;border:0;border-radius:var(--r-xl);background:transparent;text-align:left}
.lrow.chips{min-height:76px}
button.lrow:hover{background:color-mix(in srgb,var(--muted) 70%,transparent)}
button.lrow:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 40%,transparent)}
.lrow[aria-current="true"]{background:color-mix(in srgb,var(--primary) 7%,transparent)}
.lrow[aria-current="true"]::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:99px;background:var(--primary)}
.lmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.lt{font-size:15px;line-height:22px;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ls{font-size:12px;line-height:16px;color:var(--muted-foreground);overflow-wrap:anywhere}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip svg.i{width:12px;height:12px}
.chip.lead{background:color-mix(in srgb,var(--primary) 9%,transparent);color:var(--primary-text)}
.chip.n{background:var(--muted);color:var(--muted-foreground)}
.lval{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.chev{color:var(--muted-foreground)}
.lrow[aria-current="true"] .chev{color:var(--primary-text)}
.pchip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;line-height:16px;font-weight:500;white-space:nowrap;background:color-mix(in oklab,var(--primary) 8%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 15%,transparent)}
.pchip svg.i{width:12px;height:12px;color:var(--primary-text);stroke-width:3}
.pchip.miss{background:transparent;box-shadow:none;border:1px dashed var(--border);color:var(--muted-foreground)}
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring>svg{transform:rotate(-90deg);display:block}
.ring .tr{fill:none;stroke:var(--muted)}
.dark .ring .tr{stroke:var(--border)}
.ring .ar{fill:none;stroke:var(--primary-text);stroke-linecap:round}
.ring>span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ring>span svg.i{width:20px;height:20px;stroke-width:2.5;color:var(--primary-text)}
.tile{gap:12px}
.tile .tl{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted-foreground)}
.tile .tl svg{color:var(--primary-text)}
.val{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.val small{font-size:14px;line-height:20px;font-weight:500;letter-spacing:0;color:var(--muted-foreground)}
.ctx{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.bar{height:6px;border-radius:99px;background:var(--muted);overflow:hidden}
.dark .bar{background:var(--border)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary-text)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--primary-text)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--primary)}
.sempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 16px}
.sempty .ic{width:40px;height:40px;border-radius:var(--r-xl);display:grid;place-items:center;background:var(--muted);margin-bottom:8px}
.sempty .ic.info{background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary-text)}
.sempty .ic svg.i{width:20px;height:20px}
.sempty h4{font-size:16px;line-height:24px;font-weight:600}
.sempty p{color:var(--muted-foreground);max-width:448px;text-wrap:pretty}
.sempty .btn{margin-top:8px}
/* first-use empty state (saved/queue.tsx EmptySaved) */
.first{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);align-items:center;gap:32px;padding:40px 48px;overflow:hidden;isolation:isolate;
  background:color-mix(in oklab,var(--primary) 5%,var(--card));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 14%,var(--border)),0 10px 24px -18px color-mix(in srgb,var(--primary) 55%,transparent)}
.dark .first{background:color-mix(in oklab,var(--primary) 11%,var(--card))}
.first::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 120% at 100% 0%,color-mix(in oklab,var(--primary-text) 16%,transparent),transparent 72%),radial-gradient(30% 100% at 0% 100%,color-mix(in oklab,var(--primary-text) 6%,transparent),transparent 70%)}
.first-copy{display:flex;flex-direction:column;gap:12px;max-width:520px}
.first-copy h3{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.first-copy p.d{color:var(--muted-foreground);font-size:15px;line-height:24px}
.first-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.first-act .btn{min-height:44px}
.first-art{position:relative;height:220px;min-width:0}
.mini{position:absolute;left:50%;top:50%;width:220px;padding:14px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:10px;
  box-shadow:0 10px 24px -10px color-mix(in srgb,var(--foreground) 22%,transparent),0 0 0 1px var(--border)}
.mini .r{display:flex;align-items:center;gap:10px}
.mini .l{width:32px;height:32px;border-radius:9px;background:color-mix(in oklab,var(--primary) 12%,var(--card));flex:none}
.mini .ln{display:block;height:8px;border-radius:99px;background:var(--muted)}
.mini .pill{display:block;height:18px;width:88px;border-radius:99px;background:color-mix(in oklab,var(--primary) 12%,var(--card))}
.mini .pill.info{background:color-mix(in oklch,var(--status-info) 14%,var(--card))}
.mini .pill.review{background:color-mix(in oklch,var(--status-review) 14%,var(--card))}
.mini.m1{transform:translate(-90%,-62%) rotate(-8deg);opacity:.75}
.mini.m2{transform:translate(-12%,-38%) rotate(7deg);opacity:.85}
.mini.m3{transform:translate(-50%,-50%);z-index:2}
@container frame (max-width:1100px){
  .first{grid-template-columns:minmax(0,1fr);padding:32px}
  .first-art{order:-1;height:180px}
}
@container frame (max-width:560px){
  .head h2{font-size:24px;line-height:32px}
  .head .tools{width:100%}
  .search{width:100%}
  .panel{padding:16px}
  .sec{padding:16px 6px 6px}
  .sec-head{padding:0 10px 6px}
  .lrow{gap:10px;padding:12px 10px}
  .first{padding:24px 20px;gap:20px}
  .first-copy h3{font-size:20px;line-height:28px}
  .first-copy p.d{font-size:14px;line-height:22px}
  .first-act .btn{flex:1 1 100%}
  .first-art{height:150px}
  .mini{width:170px;padding:12px}
}

</div><div class="pop" data-pop role="dialog" aria-modal="false" tabindex="-1" hidden></div>`}
const stage=$('#stage');

function logicalW(kind){const f=frameEl(kind);return f.dataset.zoom?1440:f.clientWidth}
function pageW(kind){const w=logicalW(kind);return w-(w>1100?300:0)-(w>560?48:32)}

  closePop(false);
  stage.className='stage'+(S.cmp?' cmp':'');
  stage.innerHTML=frames().map(k=>`<div class="pane" data-pane="${k}">${S.cmp?`<p class="pane-label">${k==='cur'?`<i>Hoy</i>${SCREEN.route}`:`<i>Propuesta</i>Alineada con el dashboard y Vacantes guardadas`}</p>`:''}<div class="frame${k==='cur'?' cur':''}" data-f="${k}">${shell(k)}</div></div>`).join('');
  fit();
  frames().forEach(paint);
  if(animate)enter();
}
function repaint(kind,focusSel){paint(kind);if(focusSel){const el=$(focusSel,frameEl(kind));if(el)el.focus()}}
function enter(){stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');clearTimeout(enter.t);enter.t=setTimeout(()=>stage.classList.remove('enter'),900)}

/* popover: one open at a time; Escape / outside click close; focus returns to the trigger */
let popTrig=null;
function closePop(ret=true){if(!popTrig)return;const p=popTrig.closest('.frame')?.querySelector('[data-pop]');if(p)p.hidden=true;popTrig.setAttribute('aria-expanded','false');if(ret)popTrig.focus();popTrig=null}
function openPop(b,title,html){
  if(popTrig===b){closePop();return}closePop(false);
  const fr=b.closest('.frame'),p=$('[data-pop]',fr);
  p.innerHTML=`<h3>${title}</h3>${html}`;p.setAttribute('aria-label',title);p.hidden=false;p.style.transform='';
  const z=parseFloat(fr.dataset.zoom||1),rb=b.getBoundingClientRect(),rf=fr.getBoundingClientRect();
  let x=(rb.left-rf.left)/z,y=(rb.bottom-rf.top)/z+8;const w=p.offsetWidth,fw=fr.clientWidth;
  x=Math.max(8,Math.min(x,fw-w-8));if(y+p.offsetHeight>fr.clientHeight-8)y=Math.max(8,(rb.top-rf.top)/z-8-p.offsetHeight);p.style.left=x+'px';p.style.top=y+'px';
  b.setAttribute('aria-expanded','true');popTrig=b;p.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();if(SCREEN.escape)SCREEN.escape()}});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href="#"]');if(a)e.preventDefault();
  if(popTrig&&!e.target.closest('[data-pop]')&&!e.target.closest('[data-popper]'))closePop(false);
  if(SCREEN.closeMenus&&!e.target.closest('.menu,[aria-haspopup="menu"]'))SCREEN.closeMenus();
  const act=e.target.closest('[data-act]');if(!act)return;
  const fr=act.closest('.frame'),kind=fr?fr.dataset.f:null,name=act.dataset.act,app=fr&&$('[data-app]',fr);
  if(name==='theme'){const dark=document.documentElement.classList.toggle('dark');$$('[data-act="theme"]').forEach(t=>{t.setAttribute('aria-label',dark?'Cambiar a tema claro':'Cambiar a tema oscuro');t.querySelector('use').setAttribute('href',dark?'#i-sun':'#i-moon')});return}
  if(name==='nav'){if(logicalW(kind)<=1100){const o=app.classList.toggle('open');act.setAttribute('aria-expanded',String(o))}else{const c=app.classList.toggle('collapsed');act.setAttribute('aria-label',c?'Expandir barra lateral':'Contraer barra lateral')}return}
  if(name==='scrim'){app.classList.remove('open');return}
  if(SCREEN.act[name])SCREEN.act[name](kind,act,e);
});
document.addEventListener('input',e=>{const t=e.target.closest('[data-input]');if(!t)return;const kind=t.closest('.frame').dataset.f;SCREEN.input(kind,t)});

/* design toggles */
const bar=$('#design-bar');
bar.insertAdjacentHTML('beforeend',[['cmp','Ver actual'],['m390','Ver a 390 px'],['loading','Ver estado de carga'],...SCREEN.toggles.map(t=>[t.k,t.label])]
  .map(([k,l])=>`<button class="design-ctl" type="button" data-t="${k}" aria-pressed="false">${l}</button>`).join(''));
$$('.design-ctl').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.t;S[k]=!S[k];b.setAttribute('aria-pressed',String(S[k]));
  if(k==='m390')document.body.classList.toggle('m390',S.m390);
  const t=SCREEN.toggles.find(x=>x.k===k);
  if(t&&S[k])SCREEN.toggles.filter(x=>x.k!==k&&x.group&&x.group===t.group).forEach(x=>{S[x.k]=false;$(`.design-ctl[data-t="${x.k}"]`).setAttribute('aria-pressed','false')});
  if(t||k==='loading'){resetFrames()}
  render(k==='loading'?!S.loading:!!t);
}));
let lastW=0;new ResizeObserver(()=>{const w=stage.clientWidth;if(Math.abs(w-lastW)<1)return;lastW=w;const before=frames().map(k=>isNarrow(k));fit();if(frames().some((k,i)=>isNarrow(k)!==before[i]))frames().forEach(paint)}).observe(stage);
render(true);

</script>
