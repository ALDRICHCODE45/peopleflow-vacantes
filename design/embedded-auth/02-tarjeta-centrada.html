/* ---------- 01 · Panel dividido ---------- */
.L1{display:grid;grid-template-columns:1fr 1fr;height:100%}

.L3{display:grid;grid-template-columns:minmax(0,1fr) 560px;height:100%;background:var(--card)}

.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--foreground) 30%,var(--card));background:var(--card);color:var(--muted-foreground)}
.step.cur .dot{background:var(--acc-cta);color:var(--acc-on);box-shadow:none}
.step.done .dot{background:color-mix(in oklab,var(--acc-link) 14%,var(--card));color:var(--acc-link);box-shadow:none}
.step .s-t{font-size:15px;line-height:22px;font-weight:600;padding-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step:not(.cur):not(.done):not(.pv) .s-t{font-weight:500}
.step .s-d{color:var(--muted-foreground);margin-top:2px}
.st{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:500;background:var(--muted);color:var(--muted-foreground);box-shadow:inset 0 0 0 1px var(--border)}
.step.cur .st{background:color-mix(in oklab,var(--acc-link) 12%,var(--card));color:var(--foreground);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--acc-link) 40%,transparent)}
.r-note{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--border);color:var(--foreground)}
.r-note .i{color:var(--acc-link);margin-top:2px}
.rail .btn.o{width:auto;align-self:flex-start;padding:0 20px;background:var(--card)}
.prog3{margin:0 0 20px;padding:12px 14px;border-radius:14px;background:color-mix(in oklab,var(--acc-link) 6%,var(--background));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--acc-link) 16%,var(--border))}
.prog3 summary{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;margin:-8px 0;list-style:none;cursor:pointer;font-size:13px;border-radius:8px}
.prog3 summary::-webkit-details-marker{display:none}
.prog3 summary b{font-weight:600}
.prog3 summary .more{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;color:var(--acc-link);font-weight:600}
.prog3[open] summary .i{transform:rotate(180deg)}
.prog3 .steps{margin-top:16px}
.prog3 .step{padding-bottom:16px;grid-template-columns:28px 1fr;gap:12px}
.prog3 .dot{width:28px;height:28px;font-size:12px}
.prog3 .step:not(:last-child)::before{left:13px;top:32px}
.prog3 .step .s-t{font-size:14px;padding-top:4px}

const REQS=[['8 caracteres o más',v=>v.length>=8],['Una mayúscula',v=>/[A-ZÁÉÍÓÚÑ]/.test(v)],['Una minúscula',v=>/[a-záéíóúñ]/.test(v)],['Un número',v=>/\d/.test(v)],['Un símbolo (#, $, !…)',v=>/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]/.test(v)]];

function stepsList(flow,cur,preview){

}
function head(c,sc){

  let pre='';
  if(F&&DIR.id==='d2')pre=`<div class="pbar"><p class="pbar-t"><span><b>Paso ${sc.step+1} de ${n}</b> · ${F.steps[sc.step][0]}</span>${sc.step<n-1?`<span>Sigue: ${F.steps[sc.step+1][0]}</span>`:''}</p><div class="segs" aria-hidden="true">${F.steps.map((_,i)=>`<i class="${i<=sc.step?'on':''}"></i>`).join('')}</div></div>`;

      for(let i=0;i<7;i++){
        let d='';
        for(let x=0;x<=W;x+=24){const y=y0+i*9+Math.sin(x/150+ph+i*.18)*amp*(0.6+i*.06)+Math.cos(x/63+i)*6;d+=(x?'L':'M')+x+' '+y.toFixed(1)+' ';}
        g+=`<path d="${d}" fill="none" stroke="url(#${gid})" stroke-width="${(1.6-i*.12).toFixed(2)}" stroke-opacity="${(0.95-i*.09).toFixed(2)}"/>`;
      }
    });
    return `<defs>${defs}</defs><g class="${cls}">${g}</g>`;
  };
  return `<svg class="lines" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${grp(PAL[c.a].d,'ld')}${grp(PAL[c.a].l,'ll')}</svg>`;
}

/* ---------- layouts ---------- */
const LAYOUT={
  d1(c,sc){
    const inner=`${head(c,sc)}${sc.body}${sc.foot?`<div class="foot">${sc.foot}</div>`:''}`;
    if(c.p)return `<div class="P Lm m" data-aud="${c.a}"><div class="mtop">${wm()}${ttBtn(c)}</div><div class="mbody">${inner}</div></div>`;
    return `<div class="P L1" data-aud="${c.a}"><div class="vis" aria-hidden="true">${lines(c)}<div class="vis-logo"><span class="wm">people<i>flow</i></span></div></div><div class="col">${ttBtn(c)}<div class="colin">${inner}</div></div></div>`;
  },
  d2(c,sc){
    return `<div class="P L2${c.p?' m-l m':''}" data-aud="${c.a}"><div class="top2">${wm()}${ttBtn(c)}</div><div class="stage"><div class="card2">${head(c,sc)}${sc.body}</div>${sc.foot?`<div class="foot">${sc.foot}</div>`:''}</div></div>`;
  },
  d3(c,sc){
    const inner=`${head(c,sc)}${sc.body}${sc.foot?`<div class="foot">${sc.foot}</div>`:''}`;
    if(c.p)return `<div class="P Lm m" data-aud="${c.a}"><div class="mtop">${wm()}${ttBtn(c)}</div><div class="mbody">${inner}</div></div>`;
    return `<div class="P L3" data-aud="${c.a}"><div class="main3"><div class="top3">${wm()}${ttBtn(c)}</div><div class="form3">${inner}</div></div><aside class="rail" aria-label="Tu recorrido">${rail(c,sc)}</aside></div>`;
  }
};
function rail(c,sc){
  const A=COPY[c.a];
  if(sc.rail==='preview'){
    const f=c.a==='E'?'upE':'upC', F=FLOWS[f];
    return `<div><p class="eb">¿Primera vez en PeopleFlow?</p><h2>${F.title}</h2><p class="r-sub">${c.a==='E'?'Publica vacantes y sigue tu pipeline con tu equipo.':'Postúlate con tu perfil y sigue el estado de cada proceso.'}</p></div>${stepsList(f,0,true)}<a href="#up" class="btn o" data-go="up">${A.reg2}</a>${F.after?`<p class="r-note">${I('shield')}<span>${F.after}</span></p>`:''}`;
  }
  const F=FLOWS[sc.flow];
  return `<div><p class="eb">Tu recorrido</p><h2>${F.title}</h2></div>${stepsList(sc.flow,sc.step)}${F.after?`<p class="r-note">${I('shield')}<span>${F.after}</span></p>`:''}`;
}

/* ---------- artboard ---------- */
const S={s:'in',a:'E',theme:'light',ann:false};
(function readHash(){const h=new URLSearchParams(location.hash.slice(1));if(BY[h.get('s')])S.s=h.get('s');if(h.get('aud')==='C')S.a='C';if(h.get('theme')==='dark')S.theme='dark';if(h.get('ann')==='1')S.ann=true;})();
function chrome(){
  const groups=GROUPS.map(g=>`<div class="sg"><p class="sg-t" id="g-${g.replace(/\W/g,'')}">${g}</p><ul aria-labelledby="g-${g.replace(/\W/g,'')}">${STATES.filter(s=>s.g===g).map(s=>`<li><button type="button" data-state="${s.id}" aria-pressed="false">${s.t}</button></li>`).join('')}</ul></div>`).join('');
  return `<main class="ab">
  <header class="ab-top"><div><p class="eyebrow">Embedded auth · A2 · S1 S3 S4</p><h1>${DIR.title}</h1><p class="lead">${DIR.lead}</p></div>
    <div class="ab-ctl">
      <div class="seg" role="group" aria-label="Audiencia"><button type="button" data-aud="E">${I('building')}Empresa</button><button type="button" data-aud="C">${I('user')}Candidato</button></div>
      <div class="seg" role="group" aria-label="Tema"><button type="button" data-theme-btn="light">${I('sun')}Claro</button><button type="button" data-theme-btn="dark">${I('moon')}Oscuro</button></div>
      <button type="button" class="annbtn" data-ann aria-pressed="false">${I('flag')}Marcar flags</button>
    </div></header>
  <section class="trade" aria-label="Compromiso"><h2>Compromiso</h2><p>${DIR.trade}</p></section>
  <nav class="states" aria-label="Estados">${groups}</nav>
  <div class="cap" aria-live="polite"><h2 id="cap-t"></h2><p id="cap-d"></p></div>
  <figure class="fr"><figcaption>Escritorio · 1440 × 900 (escalado para caber)</figcaption><div class="scaler" id="sc"><div class="vp" id="fd" role="region" aria-label="Marco de escritorio"></div></div></figure>
  <div class="row2"><figure class="fr"><figcaption>Teléfono · 390 × 844</figcaption><div class="vp m" id="fm" role="region" aria-label="Marco de teléfono"></div></figure>
    <section class="notes" aria-label="Notas del estado"><div><h3>Comportamiento, teclado y lector</h3><ul id="notes"></ul></div><div><h3>En esta dirección</h3><ul>${DIR.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div></section></div>
</main>`;
}
let focusAfter=null;
function render(){
  const st=BY[S.s];
  if(st.only&&S.a!==st.only)S.a=st.only;
  document.documentElement.dataset.theme=S.theme;
  document.body.classList.toggle('ann',S.ann);
  for(const p of [false,true]){
    const c={a:S.a,s:S.s,p,k:p?'m-':'d-',theme:S.theme};
    const sc=SCREENS[st.scr](c,st.o||{});
    document.getElementById(p?'fm':'fd').innerHTML=LAYOUT[DIR.id](c,sc);
  }
  document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===S.s)));
  document.querySelectorAll('[data-aud]').forEach(b=>{if(b.tagName!=='BUTTON')return;b.setAttribute('aria-pressed',String(b.dataset.aud===S.a));const lock=st.only&&b.dataset.aud!==st.only;b.toggleAttribute('aria-disabled',false);if(lock)b.setAttribute('aria-disabled','true');});
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeBtn===S.theme)));
  document.querySelector('[data-ann]').setAttribute('aria-pressed',String(S.ann));
  document.getElementById('cap-t').textContent=st.t+(st.only?' · solo empresa':'');
  document.getElementById('cap-d').textContent=st.d;
  document.getElementById('notes').innerHTML=st.n.map(n=>`<li>${n}</li>`).join('');
  history.replaceState(null,'',`#s=${S.s}&aud=${S.a}&theme=${S.theme}${S.ann?'&ann=1':''}`);
  fit();
  if(focusAfter){const f=focusAfter;focusAfter=null;const el=f();if(el)el.focus();}
}
function fit(){const sc=document.getElementById('sc'),vp=document.getElementById('fd');const s=Math.min(1,sc.parentElement.clientWidth/1440);vp.style.transform=`scale(${s})`;sc.style.width=1440*s+'px';sc.style.height=900*s+'px';}
function go(state,frame){
  if(!BY[state])return;S.s=state;
  const sc=BY[state];const k=frame&&frame.id==='fm'?'m-':'d-';
  focusAfter=frame?()=>{const fr=frame;const sel=(SCREENS[sc.scr]({a:S.a,s:S.s,p:k==='m-',k,theme:S.theme},sc.o||{}).focus);
    if(sel==='al')return fr.querySelector('.al');if(sel==='pw')return fr.querySelector(`#${k}pw`);if(sel==='otp')return fr.querySelector('.otp-i');if(sel==='newmail')return fr.querySelector(`#${k}newmail`);if(sel==='name')return fr.querySelector(`#${k}name`);if(sel==='brand')return fr.querySelector(`#${k}brand`);return fr.querySelector('h1');}:null;
  render();
}
document.body.innerHTML=chrome();
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  const frame=t.closest('.vp');
  if(t.dataset.state){go(t.dataset.state);return;}
  if(t.tagName==='BUTTON'&&t.dataset.aud&&!frame){if(t.getAttribute('aria-disabled')==='true')return;S.a=t.dataset.aud;render();return;}
  if(t.dataset.themeBtn){S.theme=t.dataset.themeBtn;render();return;}
  if(t.hasAttribute('data-ann')){S.ann=!S.ann;render();return;}
  if(!frame)return;
  if(t.dataset.eye){const inp=frame.querySelector('#'+t.dataset.eye);const show=inp.type==='password';inp.type=show?'text':'password';t.setAttribute('aria-pressed',String(show));t.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');t.innerHTML=I(show?'eyeoff':'eye','s18');return;}
  if(t.dataset.cool!==undefined){e.preventDefault();if(t.getAttribute('aria-disabled')==='true')return;t.dataset.cool='60';tick(t);const rs=t.parentElement.parentElement.querySelector('[data-rs]');if(rs)rs.textContent='Te enviamos un código nuevo.';return;}
  if(t.dataset.act==='theme'){S.theme=S.theme==='dark'?'light':'dark';const id=frame.id;render();document.querySelector(`#${id} .tt`).focus();return;}
  if(t.dataset.act==='aud'){e.preventDefault();if(BY[S.s].only)return;S.a=S.a==='E'?'C':'E';const id=frame.id;render();const el=document.querySelector(`#${id} h1`);if(el)el.focus();return;}
  if(t.dataset.act==='noop'){e.preventDefault();return;}
  if(t.dataset.go!==undefined){e.preventDefault();if(!t.dataset.go)return;const back=S.s==='code-change'&&t.dataset.go==='code';const id=frame.id;go(t.dataset.go,frame);if(back){const b=document.querySelector(`#${id} [data-go="code-change"]`);if(b)b.focus();}return;}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;const b=f.querySelector('[type=submit]');if(b&&b.getAttribute('aria-disabled')==='true')return;
  if(f.dataset.next)go(f.dataset.next,f.closest('.vp'));
});
document.addEventListener('keydown',e=>{
  const fr=e.target.closest&&e.target.closest('.vp');
  if(e.key==='Escape'&&S.s==='code-change'&&fr){const id=fr.id;go('code');const b=document.querySelector(`#${id} [data-go="code-change"]`);if(b)b.focus();}
});
/* live password requirements */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-newpw]')){const f=t.closest('[data-pwf]');const ul=f.querySelector('[data-reqs]');ul.innerHTML=reqItems(t.value,false);const all=REQS.every(([,fn])=>fn(t.value));const live=f.querySelector('[data-pwlive]');const msg=all?'Tu contraseña cumple todos los requisitos.':'';if(live.textContent!==msg)live.textContent=msg;}
  if(t.matches('[data-otp-i]')){const v=t.value.replace(/\D/g,'');if(v.length>1){spread(t,v);return;}t.value=v;if(v)next(t);}
});
function cells(t){return [...t.closest('[data-otp]').querySelectorAll('[data-otp-i]')];}
function next(t){const cs=cells(t),i=cs.indexOf(t);if(i<5)cs[i+1].focus();else{const b=t.closest('form').querySelector('[type=submit]');if(b)b.focus();}}
function spread(t,v){const cs=cells(t);let i=cs.indexOf(t);if(v.length===6)i=0;for(const ch of v.slice(0,6-i)){cs[i].value=ch;i++;}if(i>=6){const b=t.closest('form').querySelector('[type=submit]');if(b)b.focus();}else cs[i].focus();}
document.addEventListener('paste',e=>{const t=e.target;if(!t.matches||!t.matches('[data-otp-i]'))return;e.preventDefault();const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'');if(v)spread(t,v);});
document.addEventListener('keydown',e=>{
  const t=e.target;if(!t.matches||!t.matches('[data-otp-i]'))return;const cs=cells(t),i=cs.indexOf(t);
  if(e.key==='Backspace'&&!t.value&&i>0){e.preventDefault();cs[i-1].value='';cs[i-1].focus();}
  else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();cs[i-1].focus();}
  else if(e.key==='ArrowRight'&&i<5){e.preventDefault();cs[i+1].focus();}
});
function tick(b){const n=+b.dataset.cool;const L=b.dataset.label;if(n>0){b.setAttribute('aria-disabled','true');b.innerHTML=`${L} en <span class="tn">${fmt(n)}</span>`;}else{b.removeAttribute('aria-disabled');b.textContent=L;}}
setInterval(()=>{document.querySelectorAll('.vp [data-cool]').forEach(b=>{const n=+b.dataset.cool;if(n>0){b.dataset.cool=String(n-1);tick(b);}});},1000);
window.addEventListener('resize',fit);
render();
</script></body></html>
