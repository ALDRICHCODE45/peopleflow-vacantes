<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Bento con siguiente paso · PeopleFlow</title>
<style>
/* base:start — tokens from design/system.md (frontend/src/app/globals.css) */
:root{
  --background:#F7F5FB;--foreground:#1A1626;--card:#FFFFFF;--card-foreground:#1A1626;--popover:#FFFFFF;
  --primary:oklch(0.491 0.27 292.581);--primary-foreground:oklch(0.969 0.016 293.756);
  --secondary:#F1EEF7;--muted:#F1EEF7;--accent:#F1EEF7;--muted-foreground:#6B6480;
  --border:#E4DFF0;--input:#E4DFF0;--destructive:oklch(0.577 0.245 27.325);--ring:oklch(0.708 0 0);
  --brand-decorative-strong:oklch(0.54 0.15 292.581);
  --status-info:oklch(0.45 0.16 250);--status-review:oklch(0.47 0.12 70);
  --status-success:oklch(0.46 0.13 152);--status-danger:oklch(0.45 0.2 25);
  --sidebar:oklch(0.985 0 0);--sidebar-foreground:oklch(0.145 0 0);--sidebar-accent:oklch(0.97 0 0);
  --sidebar-accent-foreground:oklch(0.205 0 0);--sidebar-border:oklch(0.922 0 0);
  --pf-glow-alpha:0.12;
  --radius:0.625rem;
  /* dashboard tokens (globals.css «Dashboards») */
  --primary-text:var(--primary);
  --pf-tint-base:var(--card);
  --pf-tone-late:color-mix(in oklab,var(--primary) 45%,var(--pf-tint-base));
  --pf-tone-none:var(--border);
  /* application status paint: the same tones as the status badges (Enviada info, En proceso accent, Cerrada neutral) */
  --st-sent:var(--status-info);
  --st-proc:var(--primary);
  --st-closed:color-mix(in oklab,var(--muted-foreground) 35%,var(--card));
  --chart-accent:var(--primary);
  --font-sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
.dark{
  --background:#0C0912;--foreground:#F6F2FF;--card:#15121F;--card-foreground:#F6F2FF;--popover:#1A1626;
  --primary:oklch(0.432 0.232 292.759);--secondary:#171226;--muted:#171226;--accent:#171226;
  --muted-foreground:#A79FBF;--border:#262233;--input:#262233;--destructive:oklch(0.704 0.191 22.216);--ring:oklch(0.556 0 0);
  --brand-decorative-strong:oklch(0.70 0.14 292.759);
  --status-info:oklch(0.78 0.12 245);--status-review:oklch(0.82 0.12 78);
  --status-success:oklch(0.78 0.14 155);--status-danger:oklch(0.75 0.15 22);
  --sidebar:oklch(0.205 0 0);--sidebar-foreground:oklch(0.985 0 0);--sidebar-accent:oklch(0.269 0 0);
  --sidebar-accent-foreground:oklch(0.985 0 0);--sidebar-border:oklch(1 0 0 / 10%);
  --pf-glow-alpha:0.22;
  --primary-text:var(--brand-decorative-strong);
  --pf-tint-base:color-mix(in oklab,var(--foreground) 40%,var(--card));
  --pf-tone-late:color-mix(in oklab,var(--brand-decorative-strong) 70%,var(--card));
  --pf-tone-none:color-mix(in oklab,var(--muted-foreground) 28%,var(--card));
  --st-proc:var(--brand-decorative-strong);
  --st-closed:color-mix(in oklab,var(--muted-foreground) 45%,var(--card));
  --chart-accent:var(--brand-decorative-strong);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--foreground);background:var(--sidebar);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ol,ul,figure{margin:0}
ol,ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand-decorative-strong);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:16px;top:-48px;z-index:60;background:var(--card);padding:10px 14px;border-radius:8px}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted-foreground)}

/* artboard-only design controls: a static strip above the product frame, never over it */
.design-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px dashed color-mix(in srgb,var(--brand-decorative-strong) 50%,transparent);background:var(--background)}
.design-bar>small{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin-right:4px}
.design-ctl{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1.5px dashed var(--brand-decorative-strong);border-radius:var(--radius);
  background:var(--card);color:var(--brand-decorative-strong);font-size:12px;font-weight:600}
.design-ctl[aria-pressed="true"]{border-style:solid;background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.design-ctl[aria-pressed="true"]::before{content:"✓"}

/* candidate shell: shadcn sidebar «inset» + dashboard-frame classes (components/candidate-dashboard) */
.frame{container:frame / inline-size;position:relative;background:var(--sidebar)}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - 57px)}
.app.collapsed{grid-template-columns:64px minmax(0,1fr)}
.side{position:sticky;top:0;align-self:start;height:calc(100vh - 57px);min-height:640px;display:flex;flex-direction:column;gap:8px;padding:8px;color:var(--sidebar-foreground);background:var(--sidebar)}
.brand-row{display:flex;align-items:center;gap:10px;height:48px;padding:6px;border-radius:12px}
.brand-mark{width:32px;height:32px;border-radius:999px;background:var(--primary);display:grid;place-items:center;flex:none}
.wordmark{font-size:18px;font-weight:700;letter-spacing:-.02em}
.wordmark span{color:var(--primary-text)}
.side-group{display:flex;flex-direction:column;gap:2px;padding:8px}
.side-label{height:32px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--sidebar-foreground) 70%,transparent)}
.side a.nav{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:12px;font-size:14px;white-space:nowrap;overflow:hidden}
.side a.nav:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.side a.nav[aria-current="page"]{background:var(--sidebar-accent);font-weight:500}
.side .count{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;min-height:48px}
.side-user:hover{background:var(--sidebar-accent)}
.avatar{width:32px;height:32px;border-radius:10px;background:var(--secondary);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--foreground);flex:none}
.side-user b{display:block;font-weight:500;font-size:14px;line-height:18px}
.side-user div span{display:block;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.app.collapsed .side .lbl,.app.collapsed .side-label,.app.collapsed .wordmark,.app.collapsed .side-user>div,.app.collapsed .side .count{display:none}
.app.collapsed .side a.nav{justify-content:center;padding:0;width:40px;margin:0 auto}
.app.collapsed .side-group{padding:4px 0}
.inset{min-width:0;margin:12px 12px 12px 0;background:var(--background);border-radius:calc(var(--radius)*2.2);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 15%,transparent),0 4px 6px -1px color-mix(in srgb,var(--foreground) 8%,transparent),0 2px 4px -2px color-mix(in srgb,var(--foreground) 6%,transparent);
  display:flex;flex-direction:column;overflow-x:clip}
.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-bottom:1px solid var(--border);flex:none}
.top h1{font-size:16px;line-height:24px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{width:1px;height:16px;background:var(--border);margin:0 8px}
.ghost-ic{width:40px;height:40px;margin:-4px;border:0;border-radius:var(--radius);background:transparent;display:grid;place-items:center;color:var(--foreground)}
.ghost-ic:hover{background:var(--muted)}
.top .end{margin-left:auto;display:flex;align-items:center;gap:8px}
main{padding:24px;min-width:0}
.page{max-width:1536px;margin:0 auto;display:flex;flex-direction:column;gap:40px;min-width:0}
.scrim{display:none}

/* shared parts */
.card{position:relative;background:var(--card);border-radius:calc(var(--radius)*1.4);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0;
  box-shadow:0 2px 3px color-mix(in srgb,var(--foreground) 4%,transparent),0 0 0 1px color-mix(in srgb,var(--border) 50%,transparent)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
.card-head h3{font-size:15px;line-height:22px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.sec-head h2{font-size:18px;line-height:28px;font-weight:600;display:flex;align-items:center;gap:4px}
.cap{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.lab{font-size:14px;line-height:20px;font-weight:500;color:var(--muted-foreground)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--radius);font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap}
.btn-lg{min-height:44px;padding:0 20px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,var(--foreground))}
.btn-outline{background:var(--card);border-color:var(--border)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{color:var(--muted-foreground);padding:0 12px}
.btn-ghost:hover{background:var(--muted);color:var(--foreground)}
.link{color:var(--primary-text);font-weight:500;border-radius:4px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.help{width:40px;height:40px;border:0;background:transparent;border-radius:var(--radius);display:inline-grid;place-items:center;color:var(--muted-foreground);margin:-8px 0}
.help:hover,.help[aria-expanded="true"]{background:var(--muted);color:var(--foreground)}
/* badge (components/ui/badge.tsx): h-5, radius-md, 12/500, token text + border over a 10–12 % fill, leading dot */
.badge{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:calc(var(--radius)*.8);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.nodot::before{display:none}
.b-sent{--t:var(--status-info);color:var(--t);border-color:color-mix(in oklch,var(--t) 40%,transparent);background:color-mix(in oklch,var(--t) 10%,transparent)}
.b-proc{color:var(--foreground);border-color:color-mix(in oklch,var(--primary) 40%,transparent);background:color-mix(in oklch,var(--primary) 12%,transparent)}
.b-proc::before{background:var(--st-proc)}
.b-closed{color:var(--muted-foreground);background:var(--muted);border-color:var(--border)}
.b-act{--t:var(--status-review);color:var(--t);border-color:color-mix(in oklch,var(--t) 40%,transparent);background:color-mix(in oklch,var(--t) 10%,transparent)}
.b-new{color:var(--primary-foreground);background:var(--primary)}
.b-new::before{background:currentColor}

/* ring: part of a whole with a goal (research §5) — one SVG, stroke-dashoffset only */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--muted)}
.dark .ring .track{stroke:var(--border)}
.ring .arc{fill:none;stroke:var(--chart-accent);stroke-linecap:round}
.ring .arc.full{stroke:var(--status-success)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-variant-numeric:tabular-nums}
.ring .in b{font-weight:600;letter-spacing:-.01em}
/* status composition: words + counts (below 5 records) or segmented bar (5+) */
.stbar{display:flex;gap:3px;height:10px;border-radius:999px;overflow:hidden}
.stbar i{display:block;height:100%;min-width:6px}
.st-sent{background:var(--st-sent)}.st-proc{background:var(--st-proc)}.st-closed{background:var(--st-closed)}
.stkeys{display:flex;flex-wrap:wrap;gap:8px 20px}
.stkeys li{display:inline-flex;align-items:center;gap:8px;color:var(--muted-foreground)}
.stkeys li i{width:8px;height:8px;border-radius:99px;flex:none}
.stkeys b{color:var(--foreground);font-weight:600;font-variant-numeric:tabular-nums}
.stbig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stbig li{display:flex;flex-direction:column;gap:2px;min-width:0}
.stbig b{font-size:32px;line-height:40px;letter-spacing:-.02em;font-weight:600;font-variant-numeric:tabular-nums}
.stbig span{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--muted-foreground);white-space:nowrap}
.stbig span i{width:8px;height:8px;border-radius:99px;flex:none}
/* constancy dot strip: 12 ISO weeks × 1 row, the running week dashed (principle 7) */
.dots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:center}
.dots li{display:grid;place-items:center;aspect-ratio:1;max-width:28px;width:100%;justify-self:center}
.dots li i{display:block;width:100%;height:100%;border-radius:999px;background:var(--muted)}
.dark .dots li i{background:var(--border)}
.dots li.l1 i{background:var(--pf-tone-late)}
.dots li.l2 i{background:color-mix(in oklab,var(--chart-accent) 75%,var(--pf-tint-base))}
.dots li.l3 i{background:var(--chart-accent)}
.dots li.now{outline:1.5px dashed var(--chart-accent);outline-offset:2px;border-radius:999px}
.dots-axis{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:8px}
/* sparkline (Tufte): no axes, last point in --primary */
.spark{display:block;width:100%;height:auto;overflow:visible}
.spark .ln{fill:none;stroke:var(--chart-accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .ar{fill:color-mix(in srgb,var(--chart-accent) 10%,transparent);stroke:none}
.spark .pt{fill:var(--chart-accent)}

/* popover + dialog */
.pop{position:absolute;z-index:40;width:340px;background:var(--popover);border-radius:calc(var(--radius)*1.4);padding:20px;
  box-shadow:0 12px 32px color-mix(in srgb,var(--foreground) 14%,transparent),0 0 0 1px var(--border)}
.pop h3{font-size:15px;line-height:22px;font-weight:600}
.pop dl{margin:12px 0 0}
.pop dd+dt{margin-top:12px}
.pop dt{font-weight:500}
.pop dd{margin:4px 0 0;color:var(--muted-foreground)}
.pop .list{display:flex;flex-direction:column;gap:4px;margin-top:12px}
dialog.msg{border:0;padding:0;border-radius:calc(var(--radius)*1.8);width:min(520px,calc(100vw - 32px));background:var(--popover);color:var(--foreground);
  box-shadow:0 24px 48px color-mix(in srgb,#000 24%,transparent),0 0 0 1px var(--border)}
dialog.msg::backdrop{background:color-mix(in srgb,#0C0912 45%,transparent)}
.msg-in{padding:24px;display:flex;flex-direction:column;gap:16px}
.msg-in h2{font-size:18px;line-height:28px;font-weight:600}
.msg-in p{color:var(--foreground)}
.msg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* skeleton */
.sk{display:block;border-radius:6px;background:var(--muted)}
.dark .sk{background:var(--border)}
.sk-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.sk-layer .sk{position:absolute}
.loading [data-load]>*:not(.sk-layer){visibility:hidden}
@media (prefers-reduced-motion:no-preference){
  .sk{background:linear-gradient(90deg,var(--muted) 0%,color-mix(in srgb,var(--border) 70%,var(--muted)) 50%,var(--muted) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
  .dark .sk{background:linear-gradient(90deg,var(--border) 0%,color-mix(in srgb,var(--muted-foreground) 25%,var(--border)) 50%,var(--border) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
  @keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
  .btn,.side a.nav,.ghost-ic,.help,.link,.design-ctl{transition:background-color .12s ease,color .12s ease}
  /* entrance: once per mount, ease-out 200–400 ms, transform / opacity / stroke-dashoffset only */
  .enter .rv{animation:rv .32s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d,0) * 40ms)}
  .enter .ring .arc{animation:arc .4s cubic-bezier(.22,1,.36,1) both;animation-delay:.08s}
  .enter .stbar{animation:grow .36s cubic-bezier(.22,1,.36,1) both;transform-origin:left center;animation-delay:.08s}
  .enter .dots{animation:fade .32s cubic-bezier(.22,1,.36,1) both;animation-delay:.08s}
  .enter .spark .ln{animation:draw .4s cubic-bezier(.22,1,.36,1) both;animation-delay:.08s}
  .enter .spark .ar,.enter .spark .pt{animation:fadeo .3s ease-out both;animation-delay:.3s}
  .enter .hist{animation:growy .32s cubic-bezier(.22,1,.36,1) both;transform-origin:bottom center;animation-delay:.1s}
  @keyframes rv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes arc{from{stroke-dashoffset:var(--c)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @keyframes fadeo{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
}

/* 390 px preview: the frame narrows and the container rules take over */
.m390{background:color-mix(in srgb,var(--muted-foreground) 14%,var(--background))}
.m390 .frame{width:390px;margin:32px auto 40px;border-radius:28px;overflow:hidden;
  box-shadow:0 0 0 1px var(--border),0 12px 32px color-mix(in srgb,var(--foreground) 14%,transparent)}
.m390 .app{min-height:auto}
@container frame (max-width:1100px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{display:none;position:absolute;z-index:45;top:0;left:0;bottom:0;height:auto;width:288px;max-width:85%;box-shadow:0 12px 32px color-mix(in srgb,#000 24%,transparent)}
  .app.open .side{display:flex}
  .app.open .scrim{display:block;position:absolute;inset:0;z-index:44;background:color-mix(in srgb,#0C0912 40%,transparent)}
  .inset{margin:0;border-radius:0;box-shadow:none}
}
@container frame (max-width:560px){
  .top{padding:0 16px}
  main{padding:16px 16px 32px}
  .page{gap:32px}
  .sec-head h2{font-size:17px}
  .card{padding:20px}
}
@media (max-width:600px){
  .design-bar{padding:8px 12px}
  .design-ctl{min-height:32px;padding:0 10px}
}
/* base:end */

/* ---- 02 · Bento personal ---- */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.greet h2{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em}
.greet .date{margin-top:4px;color:var(--muted-foreground)}
.top-wrap{display:flex;flex-direction:column;gap:20px}
/* ---- 04: «Siguiente paso» replaces the pending chips (focus order from 01) ---- */
/* card + bento share one stack so the card reads as the bento's first, full-width row */
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
/* quiet tint + the hero's violet glow, no alert border, no warning colour */
.next{padding:24px 28px 28px;gap:16px;overflow:hidden;isolation:isolate;
  background:color-mix(in oklab,var(--primary) 6%,var(--card));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 16%,var(--border)),0 10px 24px -18px color-mix(in srgb,var(--primary) 55%,transparent)}
.dark .next{background:color-mix(in oklab,var(--primary) 11%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 34%,transparent)}
.next::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 160% at 100% 0%,color-mix(in oklab,var(--chart-accent) calc(var(--pf-glow-alpha) * 110%),transparent),transparent 72%),
    radial-gradient(30% 120% at 0% 100%,color-mix(in oklab,var(--chart-accent) calc(var(--pf-glow-alpha) * 40%),transparent),transparent 70%)}
.next-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--primary-text)}
.eyebrow .pip{width:6px;height:6px;border-radius:99px;background:var(--chart-accent)}
.eyebrow .of{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted-foreground)}
.more{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;margin:-6px -10px -6px 0;border:0;border-radius:var(--radius);background:transparent;color:var(--muted-foreground);font-weight:500;white-space:nowrap}
.more:hover,.more[aria-expanded="true"]{background:color-mix(in srgb,var(--primary) 8%,var(--muted));color:var(--foreground)}
.more svg.i{transition:transform .15s ease-out}
.more[aria-expanded="true"] svg.i{transform:rotate(180deg)}
.next-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px 20px}
.next-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--primary-text);
  background:color-mix(in srgb,var(--primary) 10%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 18%,transparent)}
.next-ic svg.i{width:22px;height:22px}
.next-ic.has-ring{background:transparent;box-shadow:none}
.next-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.next-txt h3{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-txt p{color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-act{display:flex;align-items:center;gap:4px}
.next-act .link{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:var(--radius);white-space:nowrap}
.more-item{display:inline-flex;align-items:center;min-height:40px;padding:0;border:0;background:none;text-align:left;font:inherit}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(176px,auto);gap:24px}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s8{grid-column:span 8}.r2{grid-row:span 2}
.tile{gap:12px;justify-content:flex-start}
.tile .foot{margin-top:auto}
.tile .tl{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:500;color:var(--muted-foreground)}
.tile .tl svg{color:var(--primary-text)}
.tile .val{font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.tile .val small{font-size:14px;line-height:20px;font-weight:500;letter-spacing:0;color:var(--muted-foreground)}
.tile .ctx{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.tile .ctx a{color:var(--primary-text);font-weight:500}
.tile .ctx a:hover{text-decoration:underline;text-underline-offset:3px}
.tile .dots{gap:4px}
.tile .dots li.now{outline-offset:1px}
/* hero tile: inverted (.pf-kpi-hero, bg-foreground text-background) */
.hero{background:var(--foreground);color:var(--background);padding:28px;gap:20px;overflow:hidden;isolation:isolate;justify-content:space-between;
  --hero-accent:oklch(0.70 0.14 292.759);--hero-muted:color-mix(in oklab,var(--background) 64%,var(--foreground));
  --st-sent:oklch(0.78 0.12 245);--st-proc:var(--hero-accent);--st-closed:color-mix(in oklab,var(--background) 32%,var(--foreground));--chart-accent:var(--hero-accent);
  box-shadow:0 12px 32px -12px color-mix(in srgb,var(--primary) 45%,transparent)}
.dark .hero{--foreground:color-mix(in oklab,var(--primary) 30%,var(--card));--background:var(--card-foreground);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 40%,transparent)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 70% at 100% 0%,color-mix(in oklab,var(--hero-accent) 34%,transparent),transparent 70%),radial-gradient(50% 60% at 0% 100%,color-mix(in oklab,var(--hero-accent) 14%,transparent),transparent 70%)}
.hero .hl{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--hero-muted);font-weight:500}
.hero .big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.hero .big b{font-size:72px;line-height:72px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .big span{font-size:18px;line-height:28px;font-weight:500}
.delta{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;
  background:color-mix(in oklab,var(--background) 12%,transparent);color:var(--background)}
.delta.up{background:color-mix(in oklab,oklch(0.78 0.14 155) 22%,transparent);color:oklch(0.78 0.14 155)}
.hero .insight{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em;max-width:420px;text-wrap:balance}
.hero .insight em{font-style:normal;color:var(--hero-accent)}
.hero .stkeys li{color:var(--hero-muted)}
.hero .stkeys b{color:var(--background)}
.hero .stbar{height:8px}
.hero .spark .ar{fill:color-mix(in srgb,var(--hero-accent) 18%,transparent)}
.hero .spark-wrap{display:flex;flex-direction:column;gap:6px}
.hero .spark-lbl{font-size:12px;line-height:16px;color:var(--hero-muted)}
.hero .spark-ax{display:flex;justify-content:space-between;font-size:12px;color:var(--hero-muted)}
.hero .comp{display:flex;flex-direction:column;gap:12px}
/* response histogram (5+ responses) */
.histo{display:flex;flex-direction:column;gap:6px}
.hist{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:4px;height:40px}
.hist i{display:block;border-radius:4px 4px 2px 2px;background:var(--pf-tone-late);min-height:3px}
.hist i.top{background:var(--chart-accent)}
.hist-ax{display:flex;justify-content:space-between;font-size:11px;line-height:14px;color:var(--muted-foreground)}
/* recent applications */
.recent .rlist>li{border-top:1px solid var(--border)}
.recent .rlist>li:first-child{border-top:0}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;min-height:60px;padding:10px 0}
.rrow .t{min-width:0}
.rrow .t a{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .t a:hover{text-decoration:underline;text-underline-offset:3px}
.rrow .t small{display:block;font-size:12px;line-height:16px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow time{font-size:12px;color:var(--muted-foreground);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.unread-dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--chart-accent);margin-right:8px;vertical-align:1px}
.stack-col{display:grid;grid-template-rows:1fr 1fr;gap:24px;grid-column:span 4;grid-row:span 2}
.prof{display:flex;align-items:center;gap:16px}
@container frame (max-width:1100px){
  .s6,.s8{grid-column:span 12}.s3{grid-column:span 6}.s4{grid-column:span 6}
  .stack-col{grid-column:span 12;grid-row:auto;grid-template-rows:none;grid-template-columns:1fr 1fr}
  .hero.r2{grid-row:auto}
}
@container frame (max-width:560px){
  .greet h2{font-size:24px;line-height:32px}
  .bento{gap:12px;grid-auto-rows:auto}
  .tile{padding:16px;min-height:168px}
  .tile .val{font-size:26px;line-height:32px}
  .tile .val.txt{font-size:20px;line-height:28px}
  .hero{padding:20px;gap:16px}
  .hero .big b{font-size:56px;line-height:56px}
  .hero .insight{font-size:18px;line-height:26px}
  .stack-col{gap:12px}
  .stack-col .tile{min-height:0}
  .prof{flex-direction:column;align-items:flex-start;gap:10px}
  .recent{padding:16px 16px 8px}
  .rrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .rrow time{display:none}
  .rrow .t a{white-space:normal}
  .stack{gap:12px}
  .next{padding:16px 16px 16px;gap:12px}
  .next-body{grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:start}
  .next-ic{width:44px;height:44px;border-radius:14px}
  .next-ic svg.i{width:20px;height:20px}
  .next-txt h3{font-size:17px;line-height:24px;white-space:normal;text-wrap:balance}
  .next-txt p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .next-act{grid-column:1/-1;flex-direction:column;align-items:stretch;gap:4px}
  .next-act .btn{width:100%;min-height:44px}
  .next-act .link{min-height:44px;justify-content:center}
}

const LABEL={submitted:'Enviada',in_process:'En proceso',closed:'Cerrada'};
const BCLS={submitted:'b-sent',in_process:'b-proc',closed:'b-closed'};
const STCLS={submitted:'st-sent',in_process:'st-proc',closed:'st-closed'};

const S={rich:false,assess:false,p83:false,none:false,loading:false,m390:false,read:false};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl=(n,one,many)=>`${n} ${n===1?one:many}`;
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const ddiff=(a,b)=>Math.round((day0(a)-day0(b))/864e5);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const hhmm=d=>`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
function rel(d){const n=ddiff(NOW,d);if(n===0)return `Hoy, ${hhmm(d)}`;if(n===1)return 'Ayer';if(n<7)return `Hace ${n} días`;return `${d.getDate()} ${MES[d.getMonth()]}`}
const last=a=>a.up||a.ap;

/* derived model (features/candidate/dashboard/insights.ts gives the same figures) */
function model(){
  /* «Sin pendientes»: message read, no assessment, profile complete, every saved vacancy already applied to */
  const apps=(S.rich?BASE4.concat(OLDER):BASE4).map(a=>({...a,unread:!!a.msg&&!S.read&&!S.none})).sort((x,y)=>last(y)-last(x));
  const st={submitted:0,in_process:0,closed:0};apps.forEach(a=>st[a.st]++);
  const mon=d=>{const x=day0(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
  const cur=mon(NOW),weeks=[];
  for(let i=11;i>=0;i--){const s=new Date(cur);s.setDate(s.getDate()-7*i);weeks.push({start:s,n:0,now:i===0})}
  apps.forEach(a=>{const w=weeks.find(w=>+w.start===+mon(a.ap));if(w)w.n++});
  let streak=0;for(let i=weeks.length-1;i>=0&&weeks[i].n>0;i--)streak++;
  const active=weeks.filter(w=>w.n>0).length;
  const resp=apps.filter(a=>a.fr).map(a=>ddiff(a.fr,a.ap));
  const avg=resp.length?Math.round(resp.reduce((s,n)=>s+n,0)/resp.length*10)/10:null;
  const month=apps.filter(a=>a.ap.getMonth()===NOW.getMonth()).length;
  const prev=apps.filter(a=>a.ap.getMonth()===NOW.getMonth()-1).length;
  const profile=S.p83?{pct:83,done:10,total:12,missing:'LinkedIn y portafolio'}:{pct:100,done:12,total:12,missing:''};
  const cv={n:1,max:10,inUse:1};
  const saved=S.none?[]:S.rich?SAVED_RICH:SAVED;
  const unread=apps.filter(a=>a.unread);
  /* focus order (artboard 01, research §4 A): assessment that expires → unread message → incomplete profile → saved not applied to */
  const steps=[];
  if(S.assess)steps.push({k:'eval'});
  unread.forEach(a=>steps.push({k:'msg',a}));
  if(profile.pct<100)steps.push({k:'profile'});
  if(saved.length)steps.push({k:'saved'});
  return {apps,st,total:apps.length,weeks,streak,active,resp,avg,month,prev,profile,cv,saved,unread,steps};
}
/* headline generated from the data: the one thing worth saying (principles 1, 5) */
function headline(m){
  const p=m.st.in_process,t=m.total;
  const adv=p===1?`1 de tus ${t} postulaciones ya avanzó a proceso`:`${p} de tus ${t} postulaciones ya avanzaron a proceso`;
  if(m.streak>=3)return {title:`Llevas ${m.streak} semanas seguidas postulando`,sub:`${adv[0].toUpperCase()+adv.slice(1)} y ${m.resp.length} ya tuvieron respuesta.`};
  const cos=[...new Set(m.apps.filter(a=>a.fr).map(a=>a.co))],who=cos.length===1?cos[0]:'Las empresas';
  if(p)return {title:adv[0].toUpperCase()+adv.slice(1),sub:m.resp.length===t?'Todas ya tuvieron respuesta.':`${who} ${cos.length===1?'respondió':'respondieron'} ${m.resp.length} de ${t}${m.avg===0?' el mismo día que postulaste':''}.`};
  return {title:`Enviaste ${pl(t,'postulación','postulaciones')} este mes`,sub:'Te avisamos aquí en cuanto una empresa responda.'};
}
const evalLeft=()=>Math.ceil(EVAL.minutes*(EVAL.total-EVAL.answered)/EVAL.total);

/* ---------- chart primitives ---------- */
function ring(v,t,size,sw,inner,label,cls=''){
  const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.min(v,t)/t),full=v>=t?' full':'';
  return `<div class="ring ${cls}" style="width:${size}px;height:${size}px" role="img" aria-label="${esc(label)}"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/>
    <circle class="arc${full}" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--c:${c.toFixed(2)}"/></svg>
    <span class="in" aria-hidden="true">${inner}</span></div>`}
/* composition by status: below 5 records only words and counts; from 5 a segmented bar above them */
function statusComp(m,{keys='inline'}={}){
  const order=['submitted','in_process','closed'];
  const label=order.map(k=>`${m.st[k]} ${LABEL[k].toLowerCase()}`).join(', ');
  const bar=m.total>=5?`<div class="stbar" role="img" aria-label="Postulaciones por estado: ${label}">${order.filter(k=>m.st[k]).map(k=>`<i class="${STCLS[k]}" style="flex:${m.st[k]}"></i>`).join('')}</div>`:'';
  const list=keys==='big'
    ?`<ul class="stbig" aria-label="Postulaciones por estado">${order.map(k=>`<li><b>${m.st[k]}</b><span><i class="${STCLS[k]}"></i>${LABEL[k]}</span></li>`).join('')}</ul>`
    :`<ul class="stkeys" aria-label="Postulaciones por estado">${order.map(k=>`<li><i class="${STCLS[k]}"></i>${LABEL[k]} <b>${m.st[k]}</b></li>`).join('')}</ul>`;
  return bar+list}
function dotStrip(m){
  const lv=n=>n===0?'':n===1?'l1':n===2?'l2':'l3';
  const fmt=d=>`${d.getDate()} ${MES[d.getMonth()]}`;
  return `<ol class="dots" aria-label="Constancia de las últimas 12 semanas: ${m.active} con postulaciones, racha de ${pl(m.streak,'semana','semanas')}">${m.weeks.map(w=>`<li class="${lv(w.n)}${w.now?' now':''}" title="Semana del ${fmt(w.start)}${w.now?' (en curso)':''}: ${pl(w.n,'postulación','postulaciones')}"><i></i></li>`).join('')}</ol>
  <div class="dots-axis" aria-hidden="true"><span>${fmt(m.weeks[0].start)}</span><span>Esta semana</span></div>`}
function sparkline(m,w=280,h=56){
  const ws=m.weeks,max=Math.max(...ws.map(x=>x.n),1),step=w/(ws.length-1);
  const pts=ws.map((x,i)=>[i*step,h-4-(x.n/max)*(h-12)]);
  const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const lp=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Postulaciones por semana, últimas 12 semanas: ${ws.map(x=>x.n).join(', ')}">
    <path class="ar" d="${d} L${w} ${h} L0 ${h} Z"/><path class="ln" d="${d}" pathLength="1" stroke-dasharray="1" vector-effect="non-scaling-stroke"/>
    <circle class="pt" cx="${lp[0]}" cy="${lp[1]}" r="3.5"/></svg>`}

/* popover: one open at a time; Escape / outside click close; focus returns to the trigger */
const pop=$('#pop');let popTrig=null;
function closePop(ret=true){if(!popTrig)return;pop.hidden=true;popTrig.setAttribute('aria-expanded','false');if(ret)popTrig.focus();popTrig=null}
function openPop(b,title,html){if(popTrig===b){closePop();return}closePop(false);
  $('#pop-t').textContent=title;$('#pop-b').innerHTML=html;pop.hidden=false;
  const r=b.getBoundingClientRect(),vw=document.documentElement.clientWidth,w=Math.min(340,vw-16);pop.style.width=w+'px';
  /* a trigger on the right edge of its card opens the popover leftwards, inside the product frame */
  const fr=$('.frame').getBoundingClientRect();let x=(r.left+w>fr.right-8?r.right-w:r.left)+scrollX;x=Math.max(scrollX+Math.max(8,fr.left+8),Math.min(x,scrollX+vw-w-8));pop.style.left=x+'px';pop.style.top=(r.bottom+scrollY+8)+'px';
  b.setAttribute('aria-expanded','true');popTrig=b;pop.focus()}
document.addEventListener('click',e=>{if(popTrig&&!pop.contains(e.target)&&!e.target.closest('[data-pop]'))closePop(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});

/* ---------- loading: skeleton measured from the real layout, card by card (rule 15/17) ---------- */
function blk(layer,x,y,w,h,r){const s=document.createElement('span');s.className='sk';Object.assign(s.style,{left:x+'px',top:y+'px',width:Math.max(0,w)+'px',height:Math.max(0,h)+'px',borderRadius:(r||6)+'px'});layer.append(s)}
function skeletonize(card){const cr=card.getBoundingClientRect(),layer=document.createElement('div');layer.className='sk-layer';layer.setAttribute('aria-hidden','true');
  const rel=e=>{const r=e.getBoundingClientRect();return {x:r.left-cr.left,y:r.top-cr.top,w:r.width,h:r.height}};
  card.querySelectorAll('[data-sk]').forEach(el=>{if(!el.getClientRects().length)return;const b=rel(el),k=el.dataset.sk;
    if(k==='round')blk(layer,b.x,b.y,b.w,b.h,999);
    else if(k==='rows')[...el.children].forEach(li=>{const r=rel(li),mid=r.y+r.h/2;blk(layer,r.x,mid-14,Math.min(r.w*.5,300),12);blk(layer,r.x,mid+4,Math.min(r.w*.3,160),10);if(r.w>300)blk(layer,r.x+r.w-96,mid-10,96,20,8)});
    else if(k==='pill')blk(layer,b.x,b.y,b.w,b.h,999);
    else if(k==='text'){const lines=Math.max(1,Math.round(b.h/22));for(let i=0;i<lines;i++)blk(layer,b.x,b.y+i*(b.h/lines)+3,Math.min(b.w,i===lines-1&&lines>1?b.w*.55:b.w*.85),Math.min(14,b.h/lines-6))}
    else blk(layer,b.x,b.y,b.w,b.h,8)});
  card.append(layer)}
function setLoading(on){$$('.sk-layer').forEach(l=>l.remove());document.body.classList.toggle('loading',on);
  $$('[data-load]').forEach(c=>{if(on){c.setAttribute('aria-busy','true');skeletonize(c)}else c.removeAttribute('aria-busy')})}

function render(animate){closePop(false);renderPage(model());if(animate)enter();if(S.loading)requestAnimationFrame(()=>setLoading(true))}
$$('.design-ctl').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.t;S[k]=!S[k];b.setAttribute('aria-pressed',String(S[k]));
  if(k==='m390'){document.body.classList.toggle('m390',S.m390);app.classList.remove('open');render(false);return}
  if(k==='loading'){if(S.loading)setLoading(true);else{setLoading(false);render(true)}return}
  if(k==='rich')S.read=false;
  /* «Sin pendientes» clears the pending toggles; turning one of them on leaves that state */
  const set=(key,v)=>{S[key]=v;$(`.design-ctl[data-t="${key}"]`).setAttribute('aria-pressed',String(v))};
  if(k==='none'){if(S.none){set('assess',false);set('p83',false)}else S.read=false}
  if((k==='assess'||k==='p83')&&S[k]&&S.none)set('none',false);
  render(false)}));

/* one pending item → label, title, one line of context, primary + secondary, and its line in «+N más» */
function stepView(s,m){
  const arrow='<svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>';
  if(s.k==='eval')return {
    ic:ring(EVAL.answered,EVAL.total,52,5,`<b style="font-size:13px">${EVAL.answered}</b>`,`Evaluación: ${EVAL.answered} de ${EVAL.total} preguntas respondidas`),ring:true,
    title:'Termina tu evaluación de Grupo Altavista',
    ctx:`${EVAL.vacancy} · ${EVAL.answered} de ${EVAL.total} · vence el vie 20 nov`,
    primary:`<a class="btn btn-primary" href="#" data-focus-after-msg>Continuar evaluación${arrow}</a>`,
    secondary:`<a class="link" href="#">Ver postulación</a>`,
    short:`Terminar tu evaluación · vence el vie 20 nov`};
  if(s.k==='msg')return {
    ic:'<svg class="i" aria-hidden="true"><use href="#i-mail"/></svg>',
    title:`${s.a.co} te escribió`,
    ctx:`Sobre ${s.a.t} · ${rel(s.a.up).replace(/^Hoy/,'hoy')} · postulación cerrada`,
    primary:`<button class="btn btn-primary" type="button" data-msg="${s.a.id}"><svg class="i" aria-hidden="true"><use href="#i-mail"/></svg>Leer mensaje</button>`,
    secondary:`<a class="link" href="#">Ver vacantes similares</a>`,
    short:`Leer el mensaje de ${s.a.co}`,msg:s.a.id};
  if(s.k==='profile')return {
    ic:'<svg class="i" aria-hidden="true"><use href="#i-user"/></svg>',
    title:`Completa tu perfil: te faltan ${m.profile.total-m.profile.done} datos`,
    ctx:`Falta ${m.profile.missing} · ${m.profile.done} de ${m.profile.total} datos completos`,
    primary:`<a class="btn btn-primary" href="#" data-focus-after-msg>Completar perfil${arrow}</a>`,
    secondary:`<a class="link" href="#">Ver mi perfil</a>`,
    short:`Completar tu perfil · falta ${m.profile.missing}`};
  const names=m.saved.slice(0,2).map(v=>v.t).join(', ');
  return {
    ic:'<svg class="i" aria-hidden="true"><use href="#i-bookmark"/></svg>',
    title:`Tienes ${pl(m.saved.length,'vacante guardada','vacantes guardadas')} sin postular`,
    ctx:`${names}${m.saved.length>2?` y ${m.saved.length-2} más`:''} · todas siguen abiertas`,
    primary:`<a class="btn btn-primary" href="#" data-focus-after-msg>Ver guardadas${arrow}</a>`,
    secondary:`<a class="link" href="#">Explorar vacantes</a>`,
    short:`Postular a tus ${pl(m.saved.length,'vacante guardada','vacantes guardadas')}`};
}
function nextCard(m){

  return `<section class="card next rv" style="--d:0" aria-labelledby="next-l next-t" data-load>
    <div class="next-top">
      <p class="eyebrow" id="next-l" data-sk="pill"><span class="pip" aria-hidden="true"></span>Siguiente paso</p>
      ${rest?`<button class="more" type="button" data-pop="more" aria-expanded="false" aria-haspopup="dialog" aria-label="${rest} ${rest===1?'pendiente más':'pendientes más'}">+${rest} más<svg class="i" aria-hidden="true"><use href="#i-down"/></svg></button>`:''}
    </div>
    <div class="next-body">
      <span class="next-ic${v.ring?' has-ring':''}" data-sk="${v.ring?'round':'block'}" ${v.ring?'':'aria-hidden="true"'}>${v.ic}</span>

function moreList(m){

function histHTML(m){

    </article>

    <section class="card recent s8 r2 rv" style="--d:4" aria-labelledby="rec-t" data-load>
      <div class="card-head"><h3 id="rec-t" data-sk="text">Postulaciones recientes</h3><a class="btn btn-ghost" href="#" style="margin:-10px -12px">Ver ${t>5?'las '+t:'todas'}<svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
      <ol class="rlist" data-sk="rows" aria-label="Ordenadas por su último cambio">
        ${m.apps.slice(0,5).map(a=>`<li class="rrow"><div class="t"><a href="#">${a.unread?'<span class="unread-dot" aria-label="Mensaje sin leer"></span>':''}${esc(a.t)}</a><small>${esc(a.co)}${a.unread?' · 1 mensaje nuevo':''}${a.eval&&S.assess?` · Evaluación ${EVAL.answered}/${EVAL.total}`:''}</small></div><span class="badge ${BCLS[a.st]}">${LABEL[a.st]}</span><time>${rel(last(a))}</time></li>`).join('')}
      </ol>
    </section>
    <div class="stack-col">
      <article class="card tile rv" style="--d:3" aria-labelledby="t-prof" data-load>
        <p class="tl" id="t-prof" data-sk="text"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg>Perfil</p>
        <div class="prof"><span data-sk="round">${ring(m.profile.pct,100,64,7,`<b style="font-size:15px">${m.profile.pct}<span style="font-size:11px">%</span></b>`,`Perfil completo al ${m.profile.pct} %`)}</span>
          <div data-sk="text"><p style="font-weight:600">${m.profile.pct===100?'Completo':'Casi listo'}</p><p class="ctx">${m.profile.pct===100?'Las empresas ven todo tu perfil':`Falta ${m.profile.missing} · <a href="#">Completar</a>`}</p></div></div>
      </article>
      <article class="card tile rv" style="--d:4" aria-labelledby="t-cv" data-load>
        <p class="tl" id="t-cv" data-sk="text"><svg class="i" aria-hidden="true"><use href="#i-cv"/></svg>CVs</p>
        <div data-sk><p class="val">${m.cv.n} <small>de ${m.cv.max}</small></p><p class="ctx">En uso en ${pl(t,'postulación','postulaciones')} · <a href="#">Subir otro</a></p></div>
      </article>
    </div>
  </div>
  </div>`;
  const mb=$('[data-pop="more"]');if(mb)mb.addEventListener('click',e=>openPop(e.currentTarget,'También por hacer',moreList(m)));
}

render(true);
</script>
</body>
</html>
