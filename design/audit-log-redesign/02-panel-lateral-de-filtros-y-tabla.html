.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:18px;border:1px solid transparent;background:transparent;font-weight:500;line-height:20px;white-space:nowrap;text-decoration:none;color:var(--foreground)}

.pw{position:relative;display:inline-flex}

/* ---------- Auditoría · shared ---------- */

function mountFrames(){
  const make=(el,m)=>{const f={el,m,s:null,render(){renderFrame(f)}};AB.frames.push(f);
    el.addEventListener('click',e=>handle(f,e,'click'));

function handle(f,e,type){
  const t=e.target.closest('[data-act]');if(!t||!f.el.contains(t)){if(AB.onBlank&&type==='click')AB.onBlank(f,e);return}
  const kind=t.dataset.on||'click';
  if(kind!==type)return;

  AB.onAct(f,t.dataset.act,t,e);

function trap(f,e){
  const ov=$('.ov',f.el);if(!ov)return;
  const items=$$('button:not([disabled]),input:not([disabled]),a[href],[tabindex="0"]',ov).filter(x=>x.offsetParent!==null||x===document.activeElement);
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(!ov.contains(document.activeElement)){first.focus();e.preventDefault();return}
  if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}

}
function renderFrame(f){
  const a=document.activeElement;

  const fk=inF?(a.closest('[data-fk]')||{}).dataset?.fk:null;
  const ss=inF&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  const sc=$('.page',f.el),top=sc?sc.scrollTop:0;
  const ovScroll=$$('[data-keep]',f.el).map(x=>[x.dataset.keep,x.scrollTop]);
  f.el.innerHTML=AB.render(f);uniq(f.el,f.m?'-m':'-d');fixIndeterminate(f.el);
  const sc2=$('.page',f.el);if(sc2)sc2.scrollTop=top;
  ovScroll.forEach(([k,v])=>{const x=$(`[data-keep="${k}"]`,f.el);if(x)x.scrollTop=v});
  const want=f.focus||fk;f.focus=null;const noAuto=f.noAuto;

  if(want)tgt=$(`[data-fk="${CSS.escape(want)}"]`,f.el);

  f.noAuto=false;layout();
}
function uniq(root,suf){
  const ids=new Set($$('[id]',root).map(e=>e.id));
  $$('[id]',root).forEach(e=>e.id=e.id+suf);
  $$('[for],[aria-labelledby],[aria-describedby],[aria-controls]',root).forEach(e=>{
    ['for','aria-labelledby','aria-describedby','aria-controls'].forEach(a=>{const v=e.getAttribute(a);if(v)e.setAttribute(a,v.split(/\s+/).map(x=>ids.has(x)?x+suf:x).join(' '))})});
  $$('a[href^="#"]',root).forEach(a=>{const h=a.getAttribute('href').slice(1);if(ids.has(h))a.setAttribute('href','#'+h+suf)});
  $$('input[name]',root).forEach(i=>i.name+=suf);
}
function layout(){
  const ab=$('.ab');if(!ab)return;
  const avail=Math.max(320,ab.clientWidth-48);
  const fd=$('.fr.d'),fm=$('.fr.m');
  fd.hidden=AB.view==='mobile';fm.hidden=AB.view==='desktop';
  const side=AB.view==='side'&&avail>=1100;
  let sd=Math.min(1,avail/1440);
  if(AB.view==='side'&&side)sd=Math.min(1,(avail-32-390)/1440);
  $$('.frames',ab)[0].style.flexWrap=side?'nowrap':'wrap';
  [[fd,sd,1440],[fm,Math.min(1,avail/390),390]].forEach(([fr,s,w])=>{
    const vp=$('.vp',fr);vp.classList.toggle('auto',AB.full);

function parseDMY(v){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((v||'').trim());if(!m)return null;const n=dn(+m[3],+m[2]-1,+m[1]);const x=dOf(n);return x.d===+m[1]&&x.m===+m[2]-1?n:null}
const dmy=n=>{const x=dOf(n);return `${p2(x.d)}/${p2(x.m+1)}/${x.y}`};
const PRESETS={hoy:['Hoy',0],'7':['7 días',6],'30':['30 días',29]};
function rangeOf(r){
  if(!r||!r.k)return null;
  if(r.k==='custom'){const a=parseDMY(r.from),b=parseDMY(r.to);return a!=null&&b!=null?[a,b]:null}
  return[TODAY-PRESETS[r.k][1],TODAY];
}
function rangeText(r){
  const g=rangeOf(r);if(!g)return null;
  if(r.k==='hoy')return `Hoy (${fmtDay(TODAY)})`;
  if(r.k==='custom')return `Del ${fmtDay(g[0])} al ${fmtDay(g[1])}`;
  return `Últimos ${PRESETS[r.k][1]+1} días (${fmtDayShort(g[0])} – ${fmtDay(g[1])})`;
}
function rangeIssue(r){
  if(!r||r.k!=='custom')return null;
  const a=parseDMY(r.from),b=parseDMY(r.to);
  if(!r.from||!r.to)return 'required';if(a==null||b==null)return 'invalid';if(b<a)return 'order';if(b-a+1>366)return 'long';return null;
}

}
function catFull(f,c){const all=ANNEX.filter(x=>x[1]===c).map(x=>x[0]);return all.every(t=>f.types.includes(t))}
function chipsOf(s){
  const f=s.filters,out=[];
  if(f.actor){const p=[...PEOPLE,...CANDACT].find(x=>x.id===f.actor);out.push({k:'actor',t:'Persona',v:personFull(p)})}

  f.types.filter(t=>!done.has(t)).forEach(t=>out.push({k:'type:'+t,t:'Acción',v:eventLabel(t)}));

}

/* ---------- actions ---------- */
function auditAct(f,act,el,e){
  const s=f.s,F=s.filters;
  
  switch(act){
   case 'noop':return;
   case 'pop':{const p=el.dataset.p;s.pop=s.pop===p?null:p;s.q={p:'',a:'',v:''};f.focus=s.pop?(p==='persona'?'q-p':p==='vacante'?'q-v':p==='accion'?'q-a':null):el.dataset.fk;break}
   case 'dr-open':s.dr=el.dataset.p||'main';s.pop=s.dr==='main'?null:s.dr;f.focus=null;break;
   case 'dr-back':s.dr='main';s.pop=null;f.focus=null;break;
   case 'ov-close':
     if(s.det){s.det=null;f.focus='row-'+(el.dataset.id||s.lastRow||'')}
     else if(s.pop==='export'){s.pop=null;f.focus='export-open'}
     else{const was=s.dr||s.pop;s.dr=null;s.pop=null;f.focus=was?'trig-'+was:null}
     break;
   case 'q':s.q[el.dataset.k]=el.value;break;
   case 'pick-p':F.actor=el.dataset.id||null;s.page=1;s.more=30;if(!AB.railMode)s.pop=null;if(s.dr==='persona')s.dr=AB.noMain?null:'main';f.focus=AB.railMode&&!f.m?el.dataset.fk:'trig-persona';break;
   case 'pick-v':F.vac=el.dataset.id||null;s.page=1;s.more=30;if(!AB.railMode)s.pop=null;if(s.dr==='vacante')s.dr=AB.noMain?null:'main';f.focus=AB.railMode&&!f.m?el.dataset.fk:'trig-vacante';break;
   case 'pick-t':{const t=el.dataset.id;F.types=F.types.includes(t)?F.types.filter(x=>x!==t):[...F.types,t];s.page=1;s.more=30;break}
   case 'pick-cat':{const c=el.dataset.id,set=ANNEX.filter(x=>x[1]===c).map(x=>x[0]);const all=set.every(t=>F.types.includes(t));F.types=all?F.types.filter(t=>!set.includes(t)):[...new Set([...F.types,...set])];s.page=1;s.more=30;break}
   case 'clear-t':F.types=[];s.page=1;break;
   case 'rg-set':{const k=el.dataset.id;if(F.range.k===k&&k!=='custom'){F.range={k:'',from:'',to:''}}else{F.range={k,from:k==='custom'?(F.range.from||'01/11/2026'):'',to:k==='custom'?(F.range.to||'24/11/2026'):''}};s.page=1;s.more=30;s.pop=k==='custom'?'rango':(s.pop==='rango'?null:s.pop);if(k!=='custom'&&s.dr==='rango')s.dr=AB.noMain?null:'main';f.focus=k==='custom'?'r-from':el.dataset.fk;break}
   case 'rg-in':F.range[el.dataset.k]=el.value;s.page=1;return f.softRender?f.softRender():f.render();
   case 'chip-rm':removeChip(s,el.dataset.k);f.focus='clear';if(!hasFilters(s))f.focus=null;break;
   case 'clear':s.filters={actor:null,types:[],vac:null,range:{k:'',from:'',to:''}};s.page=1;s.more=30;s.pop=null;f.focus=null;break;
   case 'retry':s.status='ok';break;
   case 'row':s.det=el.dataset.id;s.lastRow=el.dataset.id;s.pop=null;f.focus=null;break;
   case 'page':{const to=el.dataset.to;const total=filt(F).length,pc=Math.max(1,Math.ceil(total/s.size));s.page=to==='first'?1:to==='prev'?Math.max(1,s.page-1):Math.min(pc,s.page+1);break}
   case 'more':s.more+=30;break;
   case 'ex-set':{const k=el.dataset.id;s.exp.k=k;s.exp.state='idle';if(k!=='custom'){s.exp.from='';s.exp.to=''}else{s.exp.from=s.exp.from||'01/11/2026';s.exp.to=s.exp.to||'24/11/2026'}f.focus=k==='custom'?'ex-from':el.dataset.fk;break}
   case 'ex-in':s.exp[el.dataset.k]=el.value;s.exp.state='idle';return f.render();
   case 'ex-go':{if(expInfo(s).iss)return;s.exp.state='done';f.focus='ex-done';break}
   case 'export-open':{const rg=rangeOf(F.range);s.exp={k:rg?(F.range.k):'30',from:F.range.k==='custom'?F.range.from:'',to:F.range.k==='custom'?F.range.to:'',state:'idle'};s.pop='export';f.focus=null;break}
   case 'copy-id':s.toast=['ID copiado','El identificador del evento está en el portapapeles.'];break;
   case 'cols':s.pop=s.pop==='cols'?null:'cols';break;
   case 'col-t':s.cols[el.dataset.id]=!s.cols[el.dataset.id];break;
   case 'help':s.pop=s.pop==='help'?null:'help';break;
   case 'acc':s.sec=s.sec===el.dataset.id?null:el.dataset.id;s.q={p:'',a:'',v:''};f.focus=el.dataset.fk;break;
   default:if(AB.extra&&AB.extra(f,act,el,e)===false)return;
  }
  if(act==='ov-close'||act==='clear'||act==='pick-p'||act==='pick-v')s.toast=null;
  f.render();
}
AB.onAct=auditAct;
AB.onInput=(f,e)=>{
  const t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='q'||a==='rg-in'||a==='ex-in')auditAct(f,a,t,e);
};
AB.isModal=(f)=>f.m||(AB.modalExport&&f.s.pop==='export');
AB.onBlank=(f,e)=>{const s=f.s;if(s.pop&&!s.dr&&!AB.isModal(f)&&!e.target.closest('.pop')&&!e.target.closest('[data-popbtn]')){s.pop=null;f.render()}};
AB.onEscape=(f,e)=>{const s=f.s;if(s.det||s.dr||s.pop){auditAct(f,'ov-close',{dataset:{}},e);return true}return false};
function toastA(s){return s.toast?`<div class="toast" role="status">${ic('check')}<div><b>${s.toast[0]}</b>${s.toast[1]}</div></div>`:''}
function paginationBar(s,total,{simple=false}={}){
  const pc=Math.max(1,Math.ceil(total/s.size));
  const a=(s.page-1)*s.size+1,b=Math.min(total,s.page*s.size);
  const btn=(to,i,l,dis)=>`<button class="btn outline icon" data-act="page" data-to="${to}" ${dis?'disabled':''} aria-label="${l}" style="width:40px">${ic(i)}</button>`;
  return `<div class="pg"><span class="hp" role="status">Mostrando ${a}–${b} de ${nf.format(total)} ${total===1?'evento':'eventos'}</span>
${simple?'':`<div class="pgr"><label class="lb" for="rows" style="font-weight:500">Filas por página</label><div class="ic"><select class="inp sel" id="rows" style="width:80px;min-height:40px;padding:0 10px" aria-label="Filas por página"><option>10</option><option>20</option><option>30</option></select>${ic('down')}</div></div>`}
<nav class="pgn" aria-label="Paginación"><span class="pgt">Página ${s.page} de ${pc}</span>${btn('first','lleft','Ir a la primera página',s.page===1)}${btn('prev','left','Ir a la página anterior',s.page===1)}${btn('next','right','Ir a la página siguiente',s.page>=pc)}</nav></div>`;
}

/* shared audit shell bits used by the three directions */
const REG_FIRST=EV[EV.length-1].day,REG_N=EV.length;
function regSummary(s){return s.status==='empty'||s.status==='error'?'':`<strong>${nf.format(REG_N)}</strong> eventos registrados · desde el ${fmtDay(REG_FIRST)} · hora de la Ciudad de México`}
function headA(f,{expBtn}){
  const s=f.s;
  const sum=s.status==='loading'?`<span class="sk" style="display:block;width:320px;max-width:100%;height:16px"></span><span class="sr" role="status">Cargando auditoría</span>`:regSummary(s);
  return `<header class="ahead"><div class="tt"><div class="tr1"><h2>Registro de actividad</h2><span class="badge b-neutral">${ic('shield')}Solo el dueño</span></div>
<p class="ds">Quién hizo qué en tu empresa, cuándo y desde dónde. Los registros no se pueden editar.</p><p class="sum">${sum}</p></div>${expBtn}</header>`;
}
function exportPanelPop(s,{end=true,w=400}={}){
  return `<div class="pop${end?' end':''}" role="dialog" aria-label="Exportar a CSV" style="width:${w}px"><h3>Exportar a CSV</h3><p class="mut">Descarga los eventos con los filtros activos. La exportación queda registrada en la auditoría.</p>${exportBody(s)}<div class="pop-f" style="justify-content:flex-end">${exportFoot(s)}</div></div>`;
}
function drawerA({id,title,desc,body,foot,back}){
  return `${scrim()}<section class="drw" role="dialog" aria-modal="true" aria-labelledby="${id}-t"><div class="sh-h" style="padding-left:${back?'56px':'16px'}">${back?`<button class="ib" data-act="dr-back" data-fk="dr-back" aria-label="Volver a Filtros" style="position:absolute;left:8px;top:8px">${ic('left')}</button>`:''}<h2 id="${id}-t">${title}</h2>${desc?`<p>${desc}</p>`:''}<button class="sh-x" data-act="ov-close" data-fk="sheet-x" aria-label="Cerrar">${ic('x')}</button></div><div class="sh-b" data-keep="${id}">${body}</div>${foot?`<div class="sh-f">${foot}</div>`:''}</section>`;
}
const fbtn=(label,valueHTML,p,on)=>`<button class="fbtn" data-act="dr-open" data-p="${p}" data-fk="trig-${p}" aria-haspopup="dialog"><span class="fb"><span class="fl">${label}</span><span class="fv${on?'':' mut'}">${valueHTML}</span></span>${ic('right')}</button>`;
function filterValues(s){
  const F=s.filters,p=F.actor?[...PEOPLE,...CANDACT].find(x=>x.id===F.actor):null,v=F.vac?VACS.find(x=>x.id===F.vac):null;
  const cs=chipsOf(s).filter(c=>c.k!=='actor'&&c.k!=='vac'&&c.k!=='range');
  return{persona:p?esc(personFull(p)):'Todas las personas',accion:cs.length?cs.map(c=>esc(c.v)).join('<br>'):'Todas las acciones',vacante:v?esc(vacLabel(v))+(vacMissing(v)?` · #${v.tag}`:''):'Todas las vacantes'};
}
function mobileFilterDrawer(f,{showRange=true}={}){
  const s=f.s,F=s.filters;const fv=filterValues(s);const total=filt(F).length;
  if(s.dr==='persona')return drawerA({id:'dp',title:'Persona',body:pickPersona(s,{h:440}),foot:`<button class="btn primary" data-act="dr-back">Listo</button>`,back:true});
  if(s.dr==='vacante')return drawerA({id:'dv',title:'Vacante',body:pickVacante(s,{h:440}),foot:`<button class="btn primary" data-act="dr-back">Listo</button>`,back:true});
  if(s.dr==='accion')return drawerA({id:'da',title:'Acción',body:pickAccion(s,{h:440}),foot:`<button class="btn primary" data-act="dr-back">Listo</button>`,back:true});
  const rg=F.range;
  const body=`${fbtn('Persona',fv.persona,'persona',!!F.actor)}${fbtn('Acción',fv.accion,'accion',F.types.length>0)}${fbtn('Vacante',fv.vacante,'vacante',!!F.vac)}
${showRange?`<div class="fld"><span class="lb">Rango de fechas</span>${presetSeg(s,{full:true,id:'dpr'})}${rg.k==='custom'?rangeCustom(s,{id:'dr'}):''}</div>`:''}`;
  return drawerA({id:'df',title:'Filtros',desc:hasFilters(s)?(chipsOf(s).length===1?'1 activo':`${chipsOf(s).length} activos`):'Ninguno activo',body,foot:`<button class="btn primary" data-act="ov-close">Ver ${nf.format(total)} ${total===1?'evento':'eventos'}</button>${hasFilters(s)?`<button class="btn ghost" data-act="clear">Limpiar filtros</button>`:''}`});
}
const logoA=null;

/* ---------- A2 · panel lateral de filtros + tabla ---------- */
AB.railMode=true;AB.modalExport=true;
function expBtnA2(f){
  const s=f.s,dis=s.status==='empty';
  return `<div class="aact"><button class="btn outline" data-act="export-open" data-popbtn data-fk="export-open" aria-haspopup="dialog" ${dis?'aria-disabled="true" disabled':''}>${ic('download')}Exportar CSV</button>${dis?'<p class="hp">Todavía no hay actividad para exportar</p>':exportHint(s)}</div>`;
}
function railSec(s,key,label,summaryHTML,on,inner){
  const open=s.sec===key;
  return `<section class="as"><h3><button class="ah" data-act="acc" data-id="${key}" data-fk="trig-${key}" aria-expanded="${open}" aria-controls="ap-${key}"><span class="at"><span class="al">${label}</span><span class="av2${on?' on':''}">${summaryHTML}</span></span>${ic('down')}</button></h3>${open?`<div class="ap" id="ap-${key}">${inner}</div>`:''}</section>`;
}
function railBody(f,{head=true}={}){
  const s=f.s,F=s.filters,fv=filterValues(s);
  const rt=rangeText(F.range);
  const acc=chipsOf(s).filter(c=>c.k.startsWith('type:')||c.k.startsWith('cat:'));
  const n=chipsOf(s).length;
  const h=f.m?300:260;
  return `${head||n?`<div class="rh">${head?`<h3>Filtros${n?` <span class="badge b-sec">${n}</span>`:''}</h3>`:'<span></span>'}${n?`<button class="btn ghost" data-act="clear" data-fk="clear">Limpiar</button>`:''}</div>`:''}
${railSec(s,'rango','Rango de fechas',rt?esc(rt):'Todo el historial',!!rt,`${presetSeg(s,{full:true,id:'tp'})}${F.range.k==='custom'?rangeCustom(s):''}`)}
${railSec(s,'persona','Persona',fv.persona,!!F.actor,pickPersona(s,{h,av:f.m}))}
${railSec(s,'accion','Acción',acc.length?acc.map(c=>esc(c.v)).join('<br>'):'Todas las acciones',acc.length>0,pickAccion(s,{h}))}
${railSec(s,'vacante','Vacante',fv.vacante,!!F.vac,pickVacante(s,{h}))}`;
}
function rowA2(e,s){
  const a=aboutOf(e);
  const vl=e.vac&&e.ent.type!=='vac'?`<div class="vl">${ic('briefcase','s12')}<span class="cl2 ${vacMissing(e.vac)?'':''}" title="${esc(vacLabel(e.vac))}">${esc(vacLabel(e.vac))}${vacMissing(e.vac)?` · #${e.vac.tag}`:''}</span></div>`:'';
  const main=e.ent.type==='vac'?`<b class="${a.missing?'mut-t':''}">${esc(a.main)}</b><small>Vacante</small>`:a.main==='—'?`<b class="mut-t">—</b>`:`<b class="${a.missing?'mut-t':''}">${esc(a.main)}</b><small>${a.sub}</small>`;
  return `<tr class="r" data-act="row" data-id="${e.id}"><td class="when"><b>${fmtDay(e.day)}</b><small>${fmtTime(e.min,e.sec)}</small></td><td>${actorCell(e.actor,{email:false})}</td><td class="acc"><b>${esc(eventLabel(e.type))}</b></td><td class="abt">${main}${vl}</td><td><button class="rowb" data-act="row" data-id="${e.id}" data-fk="row-${e.id}" aria-haspopup="dialog" aria-label="Ver el detalle: ${esc(eventLabel(e.type))}, ${esc(actorFull(e.actor))}, ${fmtDay(e.day)}">${ic('right')}</button></td></tr>`;
}
const colsA2='<colgroup><col style="width:128px"><col style="width:22%"><col style="width:20%"><col><col style="width:48px"></colgroup>';
function tableA2(rows){return `<table class="tbl">${colsA2}<thead><tr><th scope="col">Cuándo</th><th scope="col">Quién</th><th scope="col">Acción</th><th scope="col">Sobre</th><th scope="col"><span class="sr">Detalle</span></th></tr></thead><tbody>${rows.map(e=>rowA2(e)).join('')}</tbody></table>`}
function skelA2(){
  const r=()=>`<tr class="rsk"><td>${skel('90px',16)}<div style="height:6px"></div>${skel('70px',12)}</td><td><div class="who"><span class="sk" style="width:32px;height:32px;border-radius:50%"></span><div class="wt">${skel('80%',16)}</div></div></td><td>${skel('78%',16)}</td><td>${skel('72%',16)}<div style="height:6px"></div>${skel('90%',12)}</td><td></td></tr>`;
  return `<div class="tblw" aria-hidden="true"><table class="tbl">${colsA2}<thead><tr><th>Cuándo</th><th>Quién</th><th>Acción</th><th>Sobre</th><th></th></tr></thead><tbody>${[0,1,2,3,4].map(r).join('')}</tbody></table></div>`;
}
function ecardD(e){
  const a=aboutOf(e);
  const vl=e.vac&&e.ent.type!=='vac'?`<div class="vl">${ic('briefcase','s12')}<span class="cl2" style="display:-webkit-box">${esc(vacLabel(e.vac))}</span></div>`:'';
  const main=e.ent.type==='vac'?`<b style="font-weight:500">${esc(a.main)}</b>`:a.main==='—'?'':`<b style="font-weight:500">${esc(a.main)}</b> <span class="mut">· ${a.sub}</span>`;
  return `<li><button class="ecard" data-act="row" data-id="${e.id}" data-fk="row-${e.id}" aria-haspopup="dialog"><span class="eh"><span class="tile" aria-hidden="true">${ic(CATI[e.cat]||'scroll')}</span><b>${esc(eventLabel(e.type))}</b>${ic('right')}</span>
<span class="ew"><span class="av" aria-hidden="true">${e.actor.system?ic('settings','s12'):e.actor.deleted?ic('user','s12'):ini(e.actor.name)}</span><span>${e.actor.deleted?'<span class="mut">Usuario eliminado</span>':e.actor.system?'Sistema':esc(e.actor.name)}</span>${actorFormer(e.actor)?'<span class="badge b-neutral">Ex miembro</span>':''}</span>
${main||vl?`<span class="ea">${main}${vl}</span>`:''}<span class="et">${fmtDay(e.day)} · ${fmtTimeS(e.min)}</span></button></li>`;

function skelEcards(){return `<ul class="elist" aria-hidden="true">${[0,1,2].map(()=>`<li class="ecard" style="gap:12px"><div style="display:flex;gap:10px"><span class="sk" style="width:32px;height:32px;border-radius:10px"></span>${skel('60%',18)}</div>${skel('45%',16)}${skel('85%',16)}${skel('30%',12)}</li>`).join('')}</ul>`}
AB.render=f=>{
  const s=f.s,F=s.filters;
  const rows=filt(F),total=rows.length;
  const pageRows=rows.slice((s.page-1)*s.size,s.page*s.size);
  const empty=s.status==='empty',loading=s.status==='loading',err=s.status==='error';
  let content;
  if(loading)content=f.m?skelEcards():`<section class="card" aria-hidden="true">${skelA2()}</section>`;
  else if(err)content=`<section class="card">${errorState}</section>`;
  else if(empty)content=`<section class="card">${firstUse(s)}</section>`;
  else if(!total)content=`<section class="card">${noResults(s)}</section>`;
  else content=f.m?`<ul class="elist">${pageRows.map(ecardD).join('')}</ul>${paginationBar(s,total,{simple:true})}`:`<section class="card t2" role="region" aria-label="Eventos" style="padding:0"><div class="tblw" style="border-top:0">${tableA2(pageRows)}</div>${paginationBar(s,total)}</section>`;
  const res=loading?`<div class="ares"><span class="sk" style="width:120px;height:16px"></span><span class="sr" role="status">Cargando eventos</span></div>`
    :(empty||err)?'':`<div class="ares"><span role="status" aria-live="polite">${countText(total)}${hasFilters(s)?` <span class="mut">de ${nf.format(REG_N)}</span>`:''}</span><span class="mut" style="font-size:12px">· Más recientes primero</span><span class="sp"></span><div class="pw"><button class="btn ghost icon" data-act="help" data-popbtn data-fk="help" aria-haspopup="dialog" aria-expanded="${s.pop==='help'}" aria-label="¿Qué se registra?">${ic('info')}</button>${s.pop==='help'?helpPop():''}</div></div>`;
  const n=chipsOf(s).length;
  const main=`<div class="amain">${f.m&&!empty?`<button class="btn outline lg trig${n?' on':''}" data-act="dr-open" data-p="main" data-fk="trig-main" aria-haspopup="dialog" style="width:100%">${ic('sliders')}Filtros${n?`<span class="n" aria-label="${n} activos">${n}</span>`:''}</button>`:''}${empty?'':chipsRow(s)}${res}${content}</div>`;
  const body=`${headA(f,{expBtn:expBtnA2(f)})}${f.m||empty?main:`<div class="a2"><aside class="card rail" aria-label="Filtros de la auditoría" ${loading?'aria-busy="true"':''}>${railBody(f)}</aside>${main}</div>`}`;
  let ov='';
  if(s.det)ov=detailOverlay(f);
  else if(s.pop==='export')ov=f.m?drawerA({id:'ex',title:'Exportar a CSV',desc:'Descarga los eventos con los filtros activos. Queda registrada en la auditoría.',body:exportBody(s),foot:exportFoot(s)})
     :dialogHTML({id:'ex',title:'Exportar a CSV',desc:'Descarga los eventos con los filtros activos. La exportación queda registrada en la auditoría.',body:exportBody(s),foot:exportFoot(s)});
  else if(f.m&&s.dr){const total2=filt(F).length;ov=drawerA({id:'df',title:'Filtros',desc:n?(n===1?'1 activo':`${n} activos`):'Ninguno activo',body:railBody(f,{head:false}),foot:`<button class="btn primary" data-act="ov-close">Ver ${nf.format(total2)} ${total2===1?'evento':'eventos'}</button>`})}
  return shell(f,{active:'Auditoría',title:'Auditoría',body,overlay:ov,toast:toastA(s),role:'owner'});
};
