/* ---------------- artboard framework ---------------- */
const AB={scenarios:{},render:null,onAct:null,onEscape:null,onInput:null,frames:[],full:false,defaultFrames:['d'],scenario:null,fullToggle:false};
const q=new URLSearchParams(location.search);
document.documentElement.dataset.theme=q.get('theme')==='dark'?'dark':'light';
AB.full=q.get('full')==='1';
function say(html){const el=$('#ab-status');if(el)el.innerHTML=html}
function chromeHTML({eyebrow,title,lead,extra=''}){
  const tabs=Object.entries(AB.scenarios).map(([k,v])=>`<button role="tab" data-sc="${k}" aria-selected="false" aria-controls="ab-frames">${v.label}</button>`).join('');
  return `<main class="ab"><header class="ab-top"><div><p class="eyebrow">${eyebrow}</p><h1 class="h1">${title}</h1><p>${lead}</p></div>
<div class="ab-ctl"><div class="seg" role="group" aria-label="Tema"><button data-theme-btn="light" aria-pressed="true">${ic('sun')}Claro</button><button data-theme-btn="dark">${ic('moon')}Oscuro</button></div>
${AB.fullToggle?`<div class="seg" role="group" aria-label="Alto del marco"><button data-full="0" aria-pressed="true">Pantalla</button><button data-full="1">Página completa</button></div>`:''}</div></header>
<div class="states" role="tablist" aria-label="Estados del artboard">${tabs}</div>
<div class="cap"><p></p></div>
<div class="frames" id="ab-frames" role="tabpanel" aria-label="Marcos"></div>
<p class="ab-status" id="ab-status" role="status" aria-live="polite"></p>${extra}</main>`;
}
function frameSpecs(sc){return (sc.frames||AB.defaultFrames).map(x=>{const [k,v]=x.split(':');return {m:k==='m',v:v||null}})}
function buildFrames(sc){
  const box=$('#ab-frames');box.innerHTML='';AB.frames=[];
  const specs=frameSpecs(sc);let mrow=null;
  specs.forEach((sp,i)=>{
    const cap=(sc.captions&&sc.captions[i])||(sp.m?'Teléfono · 390 × 844':'Escritorio · 1440 × 900 · el contenido se desplaza dentro del marco, como en la app');
    const fig=document.createElement('figure');fig.className='fr '+(sp.m?'m':'d');
    fig.innerHTML=`<div class="scaler"><div class="vp${sp.m?' m':''}"></div></div><figcaption>${cap}</figcaption>`;
    if(sp.m){if(!mrow){mrow=document.createElement('div');mrow.className='frames row';mrow.style.flexWrap='wrap';mrow.style.gap='24px 32px';box.appendChild(mrow)}mrow.appendChild(fig)}
    else{mrow=null;box.appendChild(fig)}
    const el=$('.vp',fig);
    const f={el,m:sp.m,v:sp.v,i,s:null,focus:null,render(){renderFrame(f)}};
    AB.frames.push(f);
    el.addEventListener('click',e=>handle(f,e,'click'));
    el.addEventListener('change',e=>handle(f,e,'change'));
    el.addEventListener('input',e=>{if(AB.onInput)AB.onInput(f,e)});
    el.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&AB.onEscape&&AB.onEscape(f,e)){e.preventDefault();e.stopPropagation();return}
      if(e.key==='Tab')trap(f,e);
      if(AB.onKey)AB.onKey(f,e)});
  });
}
function handle(f,e,type){
  const t=e.target.closest('[data-act]');
  if(!t||!f.el.contains(t)){if(type==='click'&&AB.onBlank)AB.onBlank(f,e);return}
  const kind=t.dataset.on||'click';if(kind!==type)return;
  if(t.tagName==='A')e.preventDefault();
  if(t.dataset.act==='theme'){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';syncTheme();AB.frames.forEach(x=>x.render());return}
  if(t.dataset.act==='noop'){say(`Enlace de ejemplo: <b>${esc(t.dataset.say||t.textContent.trim())}</b>`);return}
  AB.onAct(f,t.dataset.act,t,e);
}
function trap(f,e){
  const ov=$('[data-modal]',f.el);if(!ov)return;
  const items=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href],[tabindex="0"]',ov).filter(x=>x.getClientRects().length);
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(!ov.contains(document.activeElement)){first.focus();e.preventDefault();return}
  if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}
  else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}
}
function renderFrame(f){
  const a=document.activeElement,inF=a&&f.el.contains(a);
  const fk=inF?(a.closest('[data-fk]')||{}).dataset?.fk:null;
  const keep=$$('[data-keep]',f.el).map(x=>[x.dataset.keep,x.scrollTop]);
  f.el.innerHTML=AB.render(f);uniq(f.el,'-f'+f.i);
  keep.forEach(([k,v])=>{const x=$(`[data-keep="${k}"]`,f.el);if(x)x.scrollTop=v});
  const want=f.focus||fk;f.focus=null;
  let tgt=null;
  if(f.autoFocus){tgt=$('[data-autofocus]',f.el)||$('[data-modal] button, [data-modal] input',f.el)}
  if(!tgt&&want)tgt=$(`[data-fk="${CSS.escape(want)}"]`,f.el);
  f.autoFocus=false;
  if(tgt&&!f.noFocus)tgt.focus({preventScroll:true});
  f.noFocus=false;layout();
}
function uniq(root,suf){
  const ids=new Set($$('[id]',root).map(e=>e.id));
  $$('[id]',root).forEach(e=>e.id=e.id+suf);
  $$('[for],[aria-labelledby],[aria-describedby],[aria-controls]',root).forEach(e=>{
    ['for','aria-labelledby','aria-describedby','aria-controls'].forEach(at=>{const v=e.getAttribute(at);if(v)e.setAttribute(at,v.split(/\s+/).map(x=>ids.has(x)?x+suf:x).join(' '))})});
  $$('input[name]',root).forEach(i=>i.name+=suf);
}
function layout(){
  const ab=$('.ab');if(!ab)return;
  const avail=Math.max(320,ab.clientWidth-48);
  AB.frames.forEach(f=>{
    const w=f.m?390:1440,s=Math.min(1,avail/w);
    f.el.classList.toggle('auto',AB.full);
    f.el.style.transform='scale('+s+')';
    const sc=f.el.parentElement;sc.style.width=w*s+'px';sc.style.height=f.el.offsetHeight*s+'px';
  });
}
function setScenario(name){
  AB.scenario=name;const sc=AB.scenarios[name];
  $$('.states [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.sc===name));
  $('.cap p').textContent=sc.desc;say('');
  buildFrames(sc);
  AB.frames.forEach(f=>{f.s=sc.make(f.m,f.v,f);f.noFocus=true;f.render()});
}
function syncTheme(){$$('[data-theme-btn]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.themeBtn===document.documentElement.dataset.theme))}
function boot(chrome){
  $('#root').innerHTML=chromeHTML(chrome);
  $$('[data-theme-btn]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.dataset.theme=b.dataset.themeBtn;syncTheme();AB.frames.forEach(f=>f.render())}));
  $$('[data-full]').forEach(b=>b.addEventListener('click',()=>{AB.full=b.dataset.full==='1';$$('[data-full]').forEach(x=>x.setAttribute('aria-pressed',x===b));layout()}));
  $$('[data-full]').forEach(x=>x.setAttribute('aria-pressed',(x.dataset.full==='1')===AB.full));
  $$('.states [role=tab]').forEach(b=>b.addEventListener('click',()=>setScenario(b.dataset.sc)));
  $('.states').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;const t=$$('.states [role=tab]');const i=t.indexOf(document.activeElement);if(i<0)return;const n=t[(i+(e.key==='ArrowRight'?1:t.length-1))%t.length];n.focus();n.click();e.preventDefault()});
  syncTheme();addEventListener('resize',layout);
  setScenario(q.get('state')&&AB.scenarios[q.get('state')]?q.get('state'):Object.keys(AB.scenarios)[0]);
}

/* ---------------- notification rendering ---------------- */
function urgentBadge(n){
  if(n.urgent==='late')return `<span class="badge b-danger">${ic('clockalert')}Vencida</span>`;
  if(n.urgent==='soon')return `<span class="badge b-review">${ic('clock')}${esc(n.due||'Vence mañana, 12:00')}</span>`;
  if(n.status)return `<span class="badge b-${n.status==='neutral'?'neutral':n.status} dot">${esc(n.statusL)}</span>`;
  return '';
}
/* opts: {sel, exp, button (select instead of link), hideRead, compact} */
function ntRow(n,opts={}){
  const T=TYPES[n.type],idb=`nt-${n.id}`;
  const meta=`<span class="nt-m">${urgentBadge(n)}${opts.showVac?`<span>${esc(n.vac)}</span><span aria-hidden="true">·</span>`:''}<span>${n.time}</span>${opts.noTarget?'':`<span aria-hidden="true">·</span><span class="tgt">${esc(n.tgt)}${ic('right')}</span>`}</span>`;
  const inner=`<span class="nt-ic tone-${T.tone}" aria-hidden="true">${ic(T.icon)}</span><span class="nt-tx"><span class="nt-t" id="${idb}-t">${n.unread?'<span class="sr">No leída. </span>':''}${esc(n.title)}</span>${n.sub?`<span class="nt-s">${esc(n.sub)}</span>`:''}${meta}</span>`;
  const main=opts.button
    ?`<button class="nt-a" data-act="nt-select" data-id="${n.id}" data-fk="${idb}" ${opts.sel?'aria-current="true"':''}>${inner}</button>`
    :`<a class="nt-a" href="${n.href}" data-act="nt-open" data-id="${n.id}" data-fk="${idb}">${inner}</a>`;
  const side=`<div class="nt-side">${n.unread?`<button class="nt-x" data-act="nt-read" data-id="${n.id}" data-fk="${idb}-r" aria-label="Marcar como leída" aria-describedby="${idb}-t" title="Marcar como leída">${ic('check')}</button>`:''}</div>`;
  let more='';
  if(n.items&&!opts.button&&!opts.noMore){
    const open=!!(opts.exp&&opts.exp[n.id]);
    more=`<button class="nt-more" data-act="nt-more" data-id="${n.id}" data-fk="${idb}-m" aria-expanded="${open}" aria-controls="${idb}-sub">${open?'Ocultar':'Ver'} ${n.items.length===2?'las 2':`los ${n.items.length}`}${ic('down','s14')}</button>`
     +(open?`<ul class="nt-sub" id="${idb}-sub">${n.items.map(([nm,t])=>`<li><a href="/empresa/candidatos/${slug(nm)}" data-act="noop" data-say="Ficha de ${nm}"><span class="av" aria-hidden="true">${ini(nm)}</span><span>${nm}</span><small>${t}</small></a></li>`).join('')}</ul>`:'');
  }
  return `<li class="nt${n.unread?' un':''}${opts.sel?' sel':''}">${n.unread?'<span class="udot" aria-hidden="true"></span>':''}${main}${side}${more}</li>`;
}

    return `<section aria-labelledby="${idp}-${k}"><h3 class="dayh" id="${idp}-${k}">${l}</h3><ul class="nl">${rows.map(n=>ntRow(n,opts)).join('')}</ul></section>`}).join('');

/* visible list for a state: tab filter + session-kept items */
function visible(s,extra=()=>true){return s.list.filter(n=>(s.tab==='all'||n.unread||s.keep.includes(n.id))&&extra(n))}
function baseNotifState(o={}){return Object.assign({list:clone(N_CO),tab:'un',open:true,exp:{},keep:[],undo:null,loading:false,error:false,empty:false,sel:null},o)}
/* shared list actions; returns true if handled */
function listAct(f,act,el){
  const s=f.s,id=el&&el.dataset.id,n=id&&s.list.find(x=>x.id===id);
  switch(act){
   case 'tab':s.tab=el.dataset.tab;s.keep=[];s.undo=null;f.focus=s.tab==='un'?'tab-un':'tab-all';return true;
   case 'nt-read':if(n){n.unread=false;s.keep.push(n.id);s.undo=null;f.focus=`nt-${n.id}`;say(`Marcada como leída: <b>${esc(n.title)}</b>. Se queda en la lista hasta cerrar el panel.`)}return true;
   case 'nt-open':if(n){n.unread=false;say(`Abre <code>${esc(n.href)}</code> y la marca como leída.`);f.focus=`nt-${n.id}`}return true;
   case 'nt-more':s.exp[id]=!s.exp[id];f.focus=`nt-${id}-m`;return true;
   case 'nt-all':{const c=unreadCount(s.list);s.undo=s.list.filter(x=>x.unread).map(x=>x.id);s.list.forEach(x=>x.unread=false);s.keep=[];f.focus='undo';say(`${plural(c,'notificación marcada','notificaciones marcadas')} como leídas.`);return true}
   case 'undo':if(s.undo){s.list.forEach(x=>{if(s.undo.includes(x.id))x.unread=true});s.undo=null;f.focus='mark-all'}return true;
   case 'retry':s.error=false;s.loading=false;f.focus='tab-un';return true;
   case 'prefs':say('Abre <code>/empresa/configuracion/notificaciones</code> (preferencias personales, artboard 05).');return true;
  }
  return false;
}

  {k:'prueba_ok',t:'Prueba completada',d:'Cuando un candidato de tus vacantes termina su prueba. Se agrupan por vacante.',kind:'op',def:{app:true,mail:'dia'}},
  {k:'prueba_pend',t:'Prueba pendiente del candidato',d:'Cuando un candidato lleva 3 días sin completar su prueba.',kind:'info',why:'Encendido por Grupo Altavista; llega solo a la campana.',def:{app:true,mail:'off'}}]],
];
const ROWS_CA=[
 ['Tus postulaciones',[
  {k:'c_estado',t:'Cambios en tus postulaciones',d:'Cuando una empresa cambia el estado de tu postulación o cierra la vacante.',kind:'op',def:{app:true,mail:'inm'}},
  {k:'c_mensaje',t:'Mensajes de las empresas',d:'Cuando una empresa te escribe sobre una postulación.',kind:'appLock',why:'Los mensajes siempre llegan a tu campana; el correo lo eliges tú.',def:{app:true,mail:'inm'}},
  {k:'c_prueba',t:'Pruebas pendientes',d:'Cuando una empresa te envía una prueba psicométrica y antes de que venza.',kind:'oblig',why:'Te avisamos siempre porque tienen fecha límite.',def:{app:true,mail:'inm'}}]],
 ['Próximamente',[
  {k:'s1',icon:'sparkles',tone:'mu',t:'Alertas de vacantes compatibles',d:'Vacantes que coincidan con tu perfil profesional.',kind:'soon',def:{app:false,mail:'off'}},
  {k:'s2',icon:'bell',tone:'mu',t:'Resumen semanal',d:'Un repaso de tu actividad de la semana.',kind:'soon',def:{app:false,mail:'off'}}]],
];
ICONS.sparkles='<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>';
const rowsOf=s=>s.who==='candidate'?ROWS_CA:ROWS_CO;
const allRows=s=>rowsOf(s).flatMap(g=>g[1]);
const editable=r=>r.kind==='op'||r.kind==='info'||r.kind==='appLock';
function defaults(s){const o={};allRows(s).forEach(r=>o[r.k]={...r.def});return o}
function diffs(s,a,b){return allRows(s).filter(r=>editable(r)&&(a[r.k].app!==b[r.k].app||a[r.k].mail!==b[r.k].mail))}
function evIcon(r){const T=TYPES[r.k]||{icon:r.icon,tone:r.tone};return `<span class="nt-ic tone-${r.tone||T.tone}" aria-hidden="true">${ic(r.icon||T.icon)}</span>`}
function badges(s,r){
  const b=[],D=r.def,v=s.draft[r.k];
  if(r.kind==='oblig')b.push(`<span class="badge b-neutral">${ic('lock')}Obligatoria</span>`);
  if(r.kind==='off')b.push(`<span class="badge b-neutral">${ic('belloff')}Desactivada por tu empresa</span>`);
  if(r.kind==='info')b.push(`<span class="badge b-neutral">${ic('appwin')}Solo en la app</span>`);
  if(r.kind==='soon')b.push(`<span class="badge b-neutral">${ic('clock')}Próximamente</span>`);
  if(editable(r)&&s.who!=='candidate'&&(v.app!==D.app||v.mail!==D.mail))b.push(`<span class="badge b-acc">Tu ajuste · tu empresa: ${[v.app!==D.app?(D.app?'encendido en la app':'apagado en la app'):'',v.mail!==D.mail&&r.kind!=='info'?`correo ${mailName(D.mail).toLowerCase()}`:''].filter(Boolean).join(', ')}</span>`);
  return b.length?`<span class="bdg">${b.join('')}</span>`:'';
}
function appCell(s,r,id){
  const v=s.draft[r.k];
  if(r.kind==='oblig'||r.kind==='appLock')return `<span class="lockt">${ic('lock')}Siempre</span>`;
  if(r.kind==='off'||r.kind==='soon')return `<span class="mut">—</span>`;
  return `<label class="sw"><input type="checkbox" role="switch" ${v.app?'checked':''} data-act="app" data-on="change" data-k="${r.k}" data-fk="app-${r.k}" aria-labelledby="${id}-t ${id}-app"><span class="sr" id="${id}-app">En la app</span></label>`;
}
function mailCell(s,r,id){
  const v=s.draft[r.k];
  if(r.kind==='oblig')return `<span class="lockt">${ic('lock')}Inmediato, siempre</span>`;
  if(r.kind==='info')return `<span class="mut">No se envía por correo</span>`;
  if(r.kind==='off'||r.kind==='soon')return `<span class="mut">—</span>`;
  return `<span class="sr" id="${id}-ml">Correo</span><div class="seg mail" role="radiogroup" aria-labelledby="${id}-t ${id}-ml">${MAIL.map(([k,l])=>`<button role="radio" aria-checked="${v.mail===k}" ${v.mail===k?'':'tabindex="-1"'} data-act="mail" data-k="${r.k}" data-v="${k}" data-fk="mail-${r.k}-${k}">${l}</button>`).join('')}</div>`;
}
function warnLine(s,r){const v=s.draft[r.k];return editable(r)&&!v.app&&(v.mail==='off'||r.kind==='info')?`<span class="warn5" role="status">${ic('alert')}Con esto no te llegará este aviso por ningún medio.</span>`:''}
function tableD(s){
  return `<div class="card" style="overflow:hidden"><table class="ptab"><caption class="sr">Avisos y canales</caption><thead><tr><th scope="col">Aviso</th><th scope="col" style="width:130px">En la app</th><th scope="col" style="width:360px">Correo</th></tr></thead>
${rowsOf(s).map(([g,rows],gi)=>`<tbody><tr class="gh"><th scope="colgroup" colspan="3">${g}</th></tr>${rows.map(r=>{const id='r-'+r.k;return `<tr class="${r.kind==='off'||r.kind==='soon'?'off':''}"><th scope="row" style="font-weight:400"><span class="ev">${evIcon(r)}<span><b id="${id}-t">${r.t}</b><small>${r.d}</small>${r.why?`<small>${r.why}</small>`:''}${badges(s,r)}${warnLine(s,r)}</span></span></th><td>${appCell(s,r,id)}</td><td>${mailCell(s,r,id)}</td></tr>`}).join('')}</tbody>`).join('')}</table></div>`;
}
function tableM(s){
  return `<div class="card" style="overflow:hidden">${rowsOf(s).map(([g,rows])=>`<section aria-label="${g}"><h3 class="mgh">${g}</h3><ul class="mrows">${rows.map(r=>{const id='r-'+r.k;const ed=r.kind!=='off'&&r.kind!=='soon';return `<li><span class="ev" style="display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px"><span>${evIcon(r)}</span><span><b id="${id}-t" style="font-weight:500">${r.t}</b><small class="meta" style="display:block">${r.d}</small>${r.why?`<small class="meta" style="display:block">${r.why}</small>`:''}${badges(s,r).replace('class="bdg"','class="bdg" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"')}${warnLine(s,r)}</span></span>
${ed?`<div class="ctl"><span>En la app</span>${appCell(s,r,id)}</div><div style="display:grid;gap:8px"><span style="font-weight:500">Correo</span>${mailCell(s,r,id)}</div>`:''}</li>`}).join('')}</ul></section>`).join('')}</div>`;
}
function saveBar(s){
  const d=diffs(s,s.draft,s.saved).length;
  if(!d&&!s.justSaved)return '';
  return `<div class="tbbar stk">${s.justSaved?`<p class="status ok" role="status">${ic('check')}Preferencias guardadas</p>`:`<p class="status inf" role="status"><span class="badge b-review dot">${plural(d,'cambio sin guardar','cambios sin guardar')}</span></p>`}<div class="tbbtn">${d?`<button class="btn ghost" data-act="discard" data-fk="discard">Descartar</button><button class="btn primary" data-act="save" data-fk="save">Guardar cambios</button>`:''}</div></div>`;
}
function body05(f){
  const s=f.s,cand=s.who==='candidate';
  if(s.loading)return `<div class="pw5" aria-busy="true"><span class="sr" role="status">Cargando preferencias</span><div aria-hidden="true" style="display:grid;gap:8px">${skel('180px',28)}${skel('420px',14)}</div><div class="card" aria-hidden="true" style="padding:24px;display:grid;gap:18px">${[0,1,2,3,4].map(()=>`<div style="display:grid;grid-template-columns:36px 1fr 130px 300px;gap:16px;align-items:center"><span class="sk" style="width:36px;height:36px;border-radius:12px"></span><div style="display:grid;gap:6px">${skel('40%',14)}${skel('70%',12)}</div>${skel('56px',32,999)}${skel('100%',32)}</div>`).join('')}</div></div>`;
  const P=PEOPLE[s.person];
  const reset=cand?`<button class="btn outline" data-act="reset" data-fk="reset">${ic('rotate')}Restablecer recomendados</button>`:`<button class="btn outline" data-act="reset" data-fk="reset" aria-haspopup="dialog">${ic('rotate')}Restablecer a lo que define tu empresa</button>`;
  const head=`<div class="ih"><div><h2 class="h1">Notificaciones</h2><p>${cand?'Elige cómo te avisamos de tus postulaciones. Lo que tiene fecha límite siempre te llega.':'Eliges cómo te llegan los avisos, dentro de las reglas que define Grupo Altavista. Lo obligatorio y lo que tu empresa desactivó se muestra con su motivo.'}</p></div>${reset}</div>`;
  const mail=`<div class="card mailrow"><span class="tile pr" aria-hidden="true">${ic('mail')}</span><div class="tx2"><b>Los correos llegan a ${P.email}</b><small>El «Resumen diario» junta en un solo correo lo que no pediste al momento.</small></div><label class="lb" for="dtime">Hora del resumen</label><span class="slw"><select class="slct" id="dtime" data-fk="dtime" data-act="dtime" data-on="change">${['7:00 a. m.','8:00 a. m.','9:00 a. m.','6:00 p. m.'].map(t=>`<option ${t===s.dtime?'selected':''}>${t}</option>`).join('')}</select>${ic('down')}</span></div>`;
  const lg=`<p class="lgd"><span>${ic('lock','s12')}Obligatoria: no se puede apagar</span><span>${ic('appwin','s12')}Solo en la app: no se envía por correo</span>${cand?'':`<span>${ic('belloff','s12')}Desactivada por tu empresa: nadie la recibe</span>`}</p>`;
  const core=`${head}${mail}${lg}${f.m?tableM(s):tableD(s)}${saveBar(s)}`;
  if(!cand)return `<div class="pw5">${core}</div>`;
  const nav=[['user','Cuenta'],['bell','Notificaciones'],['palette','Apariencia'],['shield','Seguridad']];
  return `<div class="d1c"><nav class="snav5" aria-label="Secciones de configuración">${nav.map(([i,t])=>`<a href="#" data-act="noop" data-say="${t}" ${t==='Notificaciones'?'aria-current="true"':''}>${ic(i)}${t}</a>`).join('')}</nav><div class="pw5" style="max-width:none">${core}</div></div>`;
}
function resetDialog(f){
  const s=f.s,d=diffs(s,s.draft,defaults(s));
  return `<div class="scrim"></div><section class="dlg alertd" role="alertdialog" aria-modal="true" aria-labelledby="rs-t" aria-describedby="rs-d" style="gap:16px"><div style="display:grid;gap:6px"><h2 id="rs-t">¿Volver a lo que define tu empresa?</h2><p id="rs-d" class="mut">${d.length?`${plural(d.length,'aviso vuelve','avisos vuelven')} al valor de Grupo Altavista:`:'Ya sigues lo que define tu empresa.'}</p></div>
${d.length?`<ul style="display:grid;gap:8px">${d.map(r=>`<li style="display:flex;gap:10px;align-items:flex-start">${ic('rotate','s14')}<span><b style="font-weight:500">${r.t}</b><br><small class="meta">Correo: ${mailName(s.draft[r.k].mail)} → ${mailName(r.def.mail)}${s.draft[r.k].app!==r.def.app?` · En la app: ${r.def.app?'encendido':'apagado'}`:''}</small></span></li>`).join('')}</ul>`:''}
<div class="dlg-f"><button class="btn outline" data-act="reset-cancel" data-autofocus data-fk="rs-cancel">Cancelar</button><button class="btn primary" data-act="reset-ok" data-fk="rs-ok">Restablecer</button></div></section>`;
}
AB.render=f=>{
  const s=f.s,cand=s.who==='candidate';
  const o=cand?{who:'candidate',person:'ximena',active:'Configuración',title:'Configuración'}:{person:s.person,active:'Configuración',title:'Notificaciones',crumb:'Configuración'};
  return shell(f,Object.assign(o,{bell:{count:cand?3:6},body:body05(f),overlay:s.ov==='reset'?resetDialog(f):'',modal:true,dim:!!s.ov,toast:toastHTML(s.toast)}));
};
AB.onAct=(f,act,el)=>{
  const s=f.s;s.justSaved=false;
  switch(act){
   case 'bell':say('La campana abre la bandeja (artboards 01–04).');return;
   case 'app':s.draft[el.dataset.k].app=el.checked;s.toast=null;break;
   case 'mail':s.draft[el.dataset.k].mail=el.dataset.v;f.focus=`mail-${el.dataset.k}-${el.dataset.v}`;s.toast=null;break;
   case 'dtime':s.dtime=el.value;s.toast={t:'Hora del resumen actualizada',d:`El resumen diario llegará a las ${el.value}`};break;
   case 'discard':s.draft=clone(s.saved);f.focus='reset';break;
   case 'save':s.saved=clone(s.draft);s.justSaved=true;f.focus='reset';break;
   case 'reset':if(s.who==='candidate'){s.draft=defaults(s);s.toast={t:'Valores recomendados',d:'Revisa y guarda los cambios.'};break}s.ov='reset';f.autoFocus=true;break;
   case 'reset-cancel':s.ov=null;f.focus='reset';break;
   case 'reset-ok':s.draft=defaults(s);s.saved=clone(s.draft);s.ov=null;s.toast={t:'Restablecido',d:'Tus avisos siguen lo que define Grupo Altavista.'};f.focus='reset';break;
   default:return;
  }
  f.render();
};
AB.onKey=(f,e)=>{const r=e.target.closest('.seg.mail [role=radio]');if(!r||!['ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();const k=r.dataset.k,i=MAIL.findIndex(m=>m[0]===f.s.draft[k].mail);const n=MAIL[(i+(e.key==='ArrowRight'?1:2))%3][0];f.s.draft[k].mail=n;f.focus=`mail-${k}-${n}`;f.render()};
AB.onEscape=f=>{if(f.s.ov){f.s.ov=null;f.focus='reset';f.render();return true}return false};
function st05(o={}){
  const s=Object.assign({who:'company',person:'valeria',dtime:'8:00 a. m.',ov:null,toast:null,loading:false,justSaved:false},o);
  const d=defaults(s);
  if(s.who==='company'){d.postulacion.mail='dia';d.equipo.mail='off'}
  s.saved=d;s.draft=clone(d);return s;
}
AB.fullToggle=true;AB.defaultFrames=['d','m'];
AB.scenarios={
 reposo:{label:'Reposo',desc:'Valeria Ortiz en Configuración › Notificaciones. Tabla de avisos × canales: «En la app» con interruptor y «Correo» como Inmediato · Resumen diario · Apagado. Las obligatorias muestran el candado y el motivo; «Prueba pendiente del candidato» llega encendida, solo en la app; dos filas llevan «Tu ajuste» porque difieren de lo que define Grupo Altavista.',make:()=>st05()},
 cambios:{label:'Cambios sin guardar',desc:'Valeria apaga «Prueba completada» en la app y en el correo: la fila avisa que no le llegará por ningún medio y aparece la barra «2 cambios sin guardar» con Descartar y Guardar.',make:()=>{const s=st05();s.draft.prueba_ok={app:false,mail:'off'};s.draft.por_vencer.mail='dia';return s}},
 restablecer:{label:'Restablecer',desc:'«Restablecer a lo que define tu empresa» pide confirmación y lista qué vuelve a su valor (Nueva postulación y Te agregan al equipo).',make:()=>st05({ov:'reset'})},
 restablecido:{label:'Restablecido',desc:'Tras confirmar: se guardan los valores de la empresa, desaparecen los «Tu ajuste» y un aviso lo confirma.',make:()=>{const s=st05();s.saved=defaults(s);s.draft=clone(s.saved);s.toast={t:'Restablecido',d:'Tus avisos siguen lo que define Grupo Altavista.'};return s}},
 candidato:{label:'Candidato',desc:'Ximena Ruiz en su Configuración: la sección Notificaciones deja de ser «Próximamente». Los mensajes siempre llegan a la campana (el correo lo elige ella) y las pruebas pendientes son obligatorias porque tienen fecha límite; alertas y resumen semanal siguen como «Próximamente».',make:()=>st05({who:'candidate',person:'ximena'})},
 cargando:{label:'Cargando',desc:'Esqueleto con la forma de la tabla mientras llegan las preferencias.',make:()=>st05({loading:true})},
};
boot({eyebrow:'Preferencias personales · etapa 2',title:'Mis notificaciones',
 lead:'Configuración › Notificaciones para cada persona: una tabla de avisos × canales dentro de las reglas de la empresa (S3). Lo obligatorio no se apaga y dice por qué; lo que el dueño desactivó se ve como tal; «Tu ajuste» marca lo que difiere de la empresa y «Restablecer» lo devuelve.'});
