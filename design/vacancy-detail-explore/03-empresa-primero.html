<div class="shell"><aside class="sidebar" aria-label="Área de candidato"><div class="brand">people<span>flow</span></div><nav aria-label="Navegación principal" id="nav"></nav><div id="side-foot"></div></aside><div class="frame"><header class="topbar"><nav class="crumb" aria-label="Ruta" id="crumb"><a class="text-link" href="/vacantes">Vacantes</a><span class="sep">/</span><span>Detalle de la vacante</span></nav><a class="text-link mobile-login" id="mobile-login" href="/iniciar-sesion?next=%2Fvacantes%2Fj1" hidden>Ingresar</a><div class="demo" role="group" aria-label="Estado de la maqueta (solo diseño)"><span>Resultados</span><div class="seg" data-group="results"><button type="button" data-v="datos" aria-pressed="true">Con resultados</button><button type="button" data-v="cargando" aria-pressed="false">Cargando</button><button type="button" data-v="pocos" aria-pressed="false">Pocos</button><button type="button" data-v="vacio" aria-pressed="false">Sin resultados</button></div><span>Sesión</span><div class="seg" data-group="session"><button type="button" data-v="candidato" aria-pressed="true">Candidato</button><button type="button" data-v="visitante" aria-pressed="false">Visitante</button></div><span>Tema</span><div class="seg" data-group="theme"><button type="button" data-v="light" aria-pressed="true">Claro</button><button type="button" data-v="dark" aria-pressed="false">Oscuro</button></div></div></header><main id="main"></main></div></div><div class="sr" id="announcement" aria-live="polite"></div><div class="toasts" aria-live="polite" id="toasts"></div><div class="mobile-apply" aria-label="Postulación"><p>$45,000 – $55,000 MXN<br><span class="muted">Mensual · bruto</span></p><button type="button" class="primary">Postularme</button></div>
<script>
const DIRECTION=3;const TRADEOFF="El contexto de empresa acompaña la lectura y mantiene la postulación al lado; retrasa las oportunidades de otras empresas y requiere más scroll móvil.";

// Design only. Fixtures represent published fields; no request, storage or mutation.
const JOBS=[{id:'j1',title:'Diseñadora o diseñador UX Senior',co:'Nuvia Fintech',ini:'NF',loc:'Ciudad de México',mode:'Híbrido',modeIcon:'building',type:'Tiempo completo',level:'Senior',area:'Diseño',sal:'$45,000 – $55,000',pub:'28 oct 2026',apps:34}];
const COMPANY=[
 {id:'n2',title:'Product Designer · Plataforma de pagos',co:'Nuvia Fintech',ini:'NF',loc:'Ciudad de México',mode:'Híbrido',sal:'$40,000 – $50,000'},
 {id:'n3',title:'Investigadora o investigador UX',co:'Nuvia Fintech',ini:'NF',loc:'Ciudad de México',mode:'Híbrido',sal:'$35,000 – $45,000'},
 {id:'n4',title:'Diseñadora o diseñador de interfaces',co:'Nuvia Fintech',ini:'NF',loc:'Guadalajara, Jal.',mode:'Remoto',sal:'$32,000 – $42,000'}
];
const SIMILAR=[
 {id:'s1',title:'Product Designer Senior',co:'Kuali Software',ini:'KS',loc:'Ciudad de México',mode:'Remoto',sal:'$42,000 – $52,000'},
 {id:'s2',title:'Diseñadora o diseñador UX/UI',co:'Ruta Logística',ini:'RL',loc:'Ciudad de México',mode:'Híbrido',sal:'$38,000 – $48,000'},
 {id:'s3',title:'Diseñadora o diseñador de producto digital',co:'Marea Digital',ini:'MD',loc:'Ciudad de México',mode:'Híbrido',sal:'$40,000 – $50,000'},
 {id:'s4',title:'UX Researcher Senior',co:'Kuali Software',ini:'KS',loc:'Guadalajara, Jal.',mode:'Remoto',sal:'$38,000 – $46,000'},
 {id:'s5',title:'Diseño de sistemas · Senior',co:'Ruta Logística',ini:'RL',loc:'Querétaro, Qro.',mode:'Remoto',sal:'$44,000 – $54,000'},
 {id:'s6',title:'Product Designer',co:'Marea Digital',ini:'MD',loc:'Monterrey, N.L.',mode:'Remoto',sal:'$35,000 – $45,000'}
];
const S={results:'datos',session:'candidato',theme:'light',tab:'similar',saved:new Set(),busy:new Set()};
const $=id=>document.getElementById(id);const ic=(n,c='')=>`<svg aria-hidden="true" class="${c}"><use href="#${n}"/></svg>`;
function setMarkup(el,m){const d=new DOMParser().parseFromString(m,'text/html');el.replaceChildren(...d.body.childNodes)}
function items(kind){const a=kind==='company'?COMPANY:SIMILAR;return S.results==='vacio'?[]:S.results==='pocos'?a.slice(0,1):a}
function compact(j){const busy=S.results==='cargando';return `<li><${busy?'div':'a'} ${busy?'aria-hidden="true"':`href="/vacantes/${j.id}"`} class="card compact ${busy?'loading':''}"><div class="compact-header"><span class="co ${busy?'sk':''}" aria-hidden="true">${busy?'':j.ini}</span><div><h3 class="${busy?'sk':''}" title="${j.title}">${busy?'&nbsp;<br>&nbsp;':j.title}</h3><p class="meta ${busy?'sk':''}">${busy?'&nbsp;':j.co}</p></div></div><p class="meta ${busy?'sk':''}">${busy?'&nbsp;':j.loc+' · '+j.mode}</p><p class="salary ${busy?'sk':''}">${busy?'&nbsp;':j.sal+' MXN'}<small>${busy?'&nbsp;':'Mensual · bruto'}</small></p></${busy?'div':'a'}></li>`}
function grid(kind,list=false){const a=items(kind),busy=S.results==='cargando';return `<div ${busy?'aria-busy="true"':''}>${busy?'<span class="sr" role="status">Cargando vacantes</span>':''}<ul class="${list?'company-list':'job-grid'} ${a.length===1?'single':''}">${a.slice(0,DIRECTION===2?6:3).map(compact).join('')}</ul></div>`}
function section(kind){if(!items(kind).length)return '';const company=kind==='company';return `<section aria-labelledby="heading-${kind}"><header class="section-head"><div><h2 id="heading-${kind}">${company?'Más vacantes de Nuvia Fintech':'Vacantes similares'}</h2><p>${company?'Otras oportunidades en la misma empresa.':'Otras empresas que buscan talento en diseño.'}</p></div><a class="text-link" href="${company?'/empresas/nuvia-fintech':'/vacantes?professional_area=design_creative'}" aria-label="${company?'Ver todas las vacantes de Nuvia Fintech':'Ver todas las vacantes de diseño'}">Ver todas ${ic('arrow')}</a></header>${grid(kind)}${company?companyLink():''}</section>`}
function companyLink(){if(S.results==='cargando')return '';const n=items('company').length+1;return `<a class="text-link" href="/empresas/nuvia-fintech">Ver las ${n} vacantes de Nuvia Fintech ${ic('arrow')}</a>`}
function companySection(){const busy=S.results==='cargando';return `<section class="card sec company-context ${busy?'loading':''}" ${busy?'aria-busy="true"':''} aria-labelledby="about-company"><div class="company-title"><span class="co ${busy?'sk':''}" aria-hidden="true">${busy?'':'NF'}</span><h2 id="about-company">Sobre Nuvia Fintech</h2></div>${busy?'<span class="sr" role="status">Cargando empresa</span>':''}<p class="${busy?'sk':''}">${busy?'&nbsp;':'Creamos herramientas digitales para que los pequeños negocios en México puedan cobrar y administrar sus pagos.'}</p><p class="${busy?'sk':''}">${busy?'&nbsp;':'Servicios financieros · 51 a 200 personas'}</p><a class="text-link" href="/empresas/nuvia-fintech">Conoce la empresa ${ic('arrow')}</a>${items('company').length?`<div class="hr"></div><h3 style="font-size:15px;font-weight:600">Más vacantes de Nuvia Fintech</h3>${grid('company',true)}${companyLink()}`:''}</section>`}
function searches(){return `<section aria-labelledby="searches"><header class="section-head"><div><h2 id="searches">Sigue buscando</h2><p>Explora por área, ubicación o modalidad.</p></div></header><nav class="search-links" aria-label="Búsquedas relacionadas"><a href="/vacantes?professional_area=design_creative&amp;state=09">${ic('search')}Diseño en Ciudad de México</a><a href="/vacantes?professional_area=design_creative&amp;work_mode=remote">${ic('globe')}Diseño remoto</a><a href="/vacantes?professional_area=design_creative&amp;seniority=senior">${ic('trend')}Diseño · Senior</a><a href="/vacantes?state=09">${ic('pin')}Vacantes en Ciudad de México</a></nav></section>`}
function tabs(){if(S.results==='vacio')return '';const active=S.tab;return `<section aria-labelledby="exploring"><header class="section-head"><div><p class="explore-intro">Tu siguiente oportunidad</p><h2 id="exploring">Sigue explorando</h2></div><a class="text-link" href="${active==='company'?'/empresas/nuvia-fintech':'/vacantes?professional_area=design_creative'}">Ver todas ${ic('arrow')}</a></header><div class="tabs" role="tablist" aria-label="Otras oportunidades">${['similar','company'].map(k=>`<button type="button" id="tab-${k}" role="tab" aria-selected="${active===k}" aria-controls="panel-${k}" tabindex="${active===k?0:-1}" data-tab="${k}">${k==='similar'?'Similares':'De Nuvia Fintech'}${S.results==='cargando'?'':` (${items(k).length})`}</button>`).join('')}</div>${['similar','company'].map(k=>`<div class="tab-panel" role="tabpanel" id="panel-${k}" aria-labelledby="tab-${k}" tabindex="0" ${active!==k?'hidden':''}>${grid(k)}${k==='company'?companyLink():''}</div>`).join('')}</section>`}
function explore(){return `<div class="explore">${DIRECTION===1?section('company')+section('similar'):DIRECTION===2?tabs():section('similar')}${searches()}</div>`}
function note(){return `<aside class="design-note" aria-label="Notas de diseño (no es UI)"><strong>Notas de diseño (no es UI)</strong><ul><li>Dirección ${DIRECTION}: ${TRADEOFF}. Se conserva el hero, resumen, descripción y aside de la referencia; solo se añade exploración. Datos de ejemplo, no métricas reales.</li><li>Empresa: <code>GET /v2/jobs?company_id=nuvia-fintech&amp;limit=4</code>. Excluir la vacante actual; conservar el orden de publicación descendente del catálogo. Tomar hasta 3. El conteo del enlace proviene del total público de la empresa e incluye la vacante actual (4 en este ejemplo), no del tamaño de la muestra.</li><li>Similares: <code>GET /v2/jobs?professional_area=design_creative&amp;states=09&amp;limit=12</code>; completar con <code>GET /v2/jobs?professional_area=design_creative&amp;limit=12</code>. Excluir actual y toda la empresa actual; deduplicar por id. Primero mismo estado, después otros estados; en cada grupo mantener orden de publicación descendente. Mostrar ${DIRECTION===2?'hasta 6':'hasta 3'}. Si faltan resultados, paginar con el cursor existente hasta llenar o agotar; nunca inventar coincidencias ni totales.</li><li>No se necesita un endpoint nuevo. Reutilizar el catálogo y el contenido publicado del sitio de empresa para logo (fallback de iniciales), descripción corta, sector y tamaño; omitir campos ausentes. No usar datos privados. El bloque «Sobre» solo aparece en la dirección 03 para no duplicar jerarquías.</li><li>Las búsquedas usan <code>buildJobsUrl</code>: <code>professional_area=design_creative</code>, <code>state=09</code>, <code>work_mode=remote</code>, <code>seniority=senior</code>; la consulta propuesta arriba usa <code>states</code> según el brief del API, mientras el frontend actual envía <code>state</code>. Al implementar, validar ese nombre con el contrato backend y extender el adaptador de lectura: hoy <code>listJobs</code> canonicaliza con <code>buildJobsUrl</code> y descarta <code>company_id</code> y <code>limit</code>. Es trabajo frontend, no un endpoint nuevo. En producto usar los identificadores reales de empresa y vacantes, no los slugs de esta maqueta.</li><li>«Cargando» ilustra la espera de las consultas añadidas, no la carga del detalle. Skeletons replican avatar, título de dos líneas, empresa, condiciones y salario, sin botones ficticios ni demoras. «Pocos» adapta cada grilla a una tarjeta. «Sin resultados» omite secciones públicas opcionales y tabs completos; conserva detalle, búsquedas y, en 03, la información publicada de empresa. No se muestra un Empty decorativo.</li><li>Las tarjetas completas son un solo enlace, sin marcador ni acciones anidadas. Tabs: flechas izquierda/derecha, Inicio/Fin y selección automática; Tab entra al panel. Sesión visitante conserva el shell público con autenticación y retorno al detalle. En móvil 03 añade «Postularme» fijo abajo.</li><li>HTML autónomo sin red: postulación y compartir son placeholders habilitados e inertes. No hay escrituras ni toasts de éxito simulados. El helper de toasts se conserva de la plantilla: éxito solo tras confirmación real y 6 s; error fijo, una acción y referencia <code>HTTP 503 · service_unavailable · 17:58:46</code>. Implementación futura: Card, Avatar, Tabs y Skeleton instalados, no trasladar este markup a React.</li></ul></aside>`}
function navHTML(){const l=(icon,t,href,current=false)=>`<a class="nav-link" href="${href}" ${current?'aria-current="page"':''}>${ic(icon)}${t}</a>`;return l('search','Vacantes','/vacantes',true)+(S.session==='candidato'?`<p class="nav-label">Mi búsqueda</p>${l('dash','Dashboard','/candidato')}${l('case','Postulaciones','/candidato/postulaciones')}<p class="nav-label">Mi perfil</p>${l('person','Perfil','/candidato/perfil')}${l('file','CVs','/candidato/cvs')}${l('gear','Configuración','/candidato/configuracion')}`:'')}
function render(){
 document.documentElement.classList.toggle('dark',S.theme==='dark');
 setMarkup($('nav'),navHTML());
 const auth='/iniciar-sesion?next=%2Fvacantes%2Fj1';
 setMarkup($('side-foot'),S.session==='candidato'?`<div class="account"><span class="avatar" aria-hidden="true">XR</span><div><strong>Ximena Ruiz</strong><p class="muted">Mi cuenta</p></div></div>`:`<div class="visitor-card"><strong>Guarda tu búsqueda y sigue tus postulaciones</strong><a class="primary auth-link" href="/crear-cuenta?next=%2Fvacantes%2Fj1">Crear cuenta</a><a class="auth-link" href="${auth}">Iniciar sesión</a><a href="/empresas">¿Eres empresa? Publica vacantes</a></div>`);
 $('mobile-login').hidden=S.session!=='visitante';
 setMarkup($('main'),detail()+explore()+`<footer class="page-footer"><span>PeopleFlow · Encuentra tu siguiente oportunidad</span><a href="/vacantes">Explorar todas las vacantes ${ic('arrow')}</a></footer>`+note());
 document.querySelectorAll('.demo .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S[g.dataset.group]===b.dataset.v))));
 document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>selectTab(b.dataset.tab,false);b.onkeydown=e=>{const ks=['ArrowLeft','ArrowRight','Home','End'];if(!ks.includes(e.key))return;e.preventDefault();selectTab(e.key==='Home'?'similar':e.key==='End'?'company':S.tab==='similar'?'company':'similar',true)}});
 $('announcement').textContent=S.results==='cargando'?'Cargando oportunidades relacionadas':S.results==='vacio'?'Sin vacantes relacionadas; puedes seguir buscando':S.results==='pocos'?'Una vacante por sección':'Oportunidades relacionadas disponibles';
}
function selectTab(k,focus){S.tab=k;document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===k;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;$('panel-'+b.dataset.tab).hidden=!on});if(focus)$('tab-'+k).focus();const link=$('exploring').closest('section').querySelector('.text-link');link.setAttribute('href',k==='company'?'/empresas/nuvia-fintech':'/vacantes?professional_area=design_creative')}
function pick(g,v){S[g]=v;render()}
document.querySelectorAll('.demo .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(g.dataset.group,b.dataset.v)));
render();

function detail(){const j=JOBS[0],on=S.saved.has(j.id),busy=S.busy.has(j.id);
 const saveBtn='';
 const apply=S.session==='empresa'?`<p class="note">Las postulaciones son para cuentas de candidato</p>`:`<button type="button" class="primary wide">Postularme${ic('arrow')}</button>`;
 return `<article class="detail"><section class="card hero"><span class="co" aria-hidden="true">${j.ini}</span><p class="muted">${j.co}</p><h1>${j.title}</h1><div class="badges"><span class="badge">${ic('pin')}${j.loc}</span><span class="badge">${ic(j.modeIcon)}${j.mode}</span><span class="badge">${j.type}</span><span class="badge">${j.level}</span></div><p class="when">${ic('cal')}Publicada el ${j.pub}</p></section>
<div class="dgrid"><div class="stack" style="gap:24px"><section class="card sec"><h2>La vacante de un vistazo</h2><dl class="facts"><div><dt>Área</dt><dd>${j.area}</dd></div><div><dt>Experiencia</dt><dd>5 años o más</dd></div><div><dt>Escolaridad</dt><dd>Licenciatura</dd></div><div><dt>Idiomas</dt><dd>Inglés avanzado</dd></div><div><dt>Horario</dt><dd>Lunes a viernes</dd></div><div><dt>Contrato</dt><dd>Indeterminado</dd></div></dl></section>
<section class="card sec"><h2>Sobre la vacante</h2><div class="prose"><p>En Nuvia diseñamos herramientas de cobro para pequeños negocios en México. Buscamos a una persona que lidere el diseño de la experiencia de cobro y conciliación.</p><p>Trabajarás con producto e ingeniería para transformar la investigación en experiencias claras y accesibles.</p></div></section>${DIRECTION===3?companySection():''}</div>
<aside class="card aside" aria-label="Compensación y postulación"><h2>${ic('money')}Compensación</h2><p class="big">${j.sal} MXN</p><p class="muted" style="margin-top:-12px;font-size:13px">Mensual · bruto</p><div class="hr"></div><div class="stack"><strong>¿Te ves en este equipo?</strong><p class="muted" style="font-size:13px">Da el siguiente paso en tu carrera con ${j.co}.</p></div>
<div class="stack">${apply}<div class="stack">${saveBtn}<button type="button" class="ghost" style="width:100%">${ic('share')}Compartir</button></div><p class="status-line" role="status">${on&&!busy?'Está en tus vacantes guardadas':''}</p><p class="note">${ic('users')}${j.apps} postulantes</p></div>
<div class="company-foot">${ic('building')}<div><strong>${j.co}</strong><p class="muted">${j.loc} · ${j.mode}</p></div></div></aside></div></article>`}

function toast(kind,title,desc,action,ref){const el=document.createElement('div');el.className='toast '+kind;el.setAttribute('role',kind==='err'?'alert':'status');setMarkup(el,`${ic(kind==='ok'?'ok':'alert','i')}<div><strong>${title}</strong><p>${desc}</p>${ref?`<p class="ref">${ref}</p>`:''}</div><div style="display:flex;gap:4px;align-items:center">${action?`<button type="button" class="act">${action}</button>`:''}<button type="button" class="x" aria-label="Cerrar aviso">${ic('x')}</button></div>`);$('toasts').replaceChildren(el);el.querySelector('.x').onclick=()=>el.remove();const a=el.querySelector('.act');if(a)a.onclick=()=>{el.remove();if(action==='Deshacer'){S.removed.pop();render()}else if(action==='Ver guardadas'){pick('view','guardadas')}else if(action==='Reintentar'){pick('fail','ok')}};if(kind!=='err')setTimeout(()=>el.remove(),6000)}

</script></body></html>
