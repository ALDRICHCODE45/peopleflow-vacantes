// Design only: all confirmations are simulated, never network or storage.
const JOBS=[
 {id:'j1',title:'Diseñadora o diseñador UX Senior',co:'Nuvia Fintech',ini:'NF',loc:'Ciudad de México',mode:'Híbrido',modeIcon:'building',type:'Tiempo completo',level:'Senior',area:'Diseño',sal:'$45,000 – $55,000',ex:'Liderarás la investigación y el diseño de la app de pagos para pequeños negocios, junto a producto e ingeniería.',pub:'28 oct 2026',apps:34},
 {id:'j2',title:'Desarrollador o desarrolladora Frontend React',co:'Kuali Software',ini:'KS',loc:'Guadalajara, Jal.',mode:'Remoto',modeIcon:'globe',type:'Tiempo completo',level:'Semi senior',area:'Tecnología y sistemas',sal:'$38,000 – $48,000',ex:'Construirás el panel de facturación electrónica que usan más de 4 mil empresas en México.',pub:'27 oct 2026',apps:51},
 {id:'j3',title:'Analista de datos comerciales',co:'Grupo Andale Retail',ini:'GA',loc:'Monterrey, N.L.',mode:'Presencial',modeIcon:'building',type:'Tiempo completo',level:'Junior',area:'Datos y analítica',sal:'$26,000 – $32,000',ex:'Analizarás ventas de 120 tiendas y prepararás los tableros semanales para dirección comercial.',pub:'25 oct 2026',apps:18}
];
const SAVED=[{...JOBS[0],savedOn:'30 oct 2026',status:'open'},{...JOBS[1],savedOn:'29 oct 2026',status:'applied'},{id:'j4',title:'Product Designer',co:'Ruta Logística',ini:'RL',loc:'Querétaro, Qro.',mode:'Híbrido',modeIcon:'building',sal:'$40,000 – $50,000',savedOn:'12 oct 2026',status:'closed'},{...JOBS[2],savedOn:'8 oct 2026',status:'open'}];
const S={view:'listado',session:'candidato',fail:'ok',list:'datos',theme:'light',saved:new Set(SAVED.map(j=>j.id)),busy:new Set(),pop:null,filter:'all',query:'',results:new Map()};
const $=id=>document.getElementById(id);const ic=(n,c='')=>`<svg aria-hidden="true" class="${c}"><use href="#${n}"/></svg>`;
function setMarkup(el,m){const d=new DOMParser().parseFromString(m,'text/html');el.replaceChildren(...d.body.childNodes)}
function allSaved(){return SAVED.filter(j=>S.saved.has(j.id))}
function bookmark(j,ctx,labeled=false){
 const on=S.session==='candidato'&&S.saved.has(j.id),busy=S.session==='candidato'&&S.busy.has(j.id),company=S.session==='empresa';
 const label=(on?'Quitar de guardadas: ':'Guardar: ')+j.title;
 const help=company?`<button type="button" class="ghost icon-btn" data-help="${j.id+ctx}" aria-label="Ayuda: guardar vacantes" aria-expanded="${S.pop===j.id+ctx}"><span aria-hidden="true">ⓘ</span></button>${S.pop===j.id+ctx?'<div class="pop" role="dialog" aria-label="Guardar vacantes"><strong>Guardar vacantes es para cuentas de candidato</strong></div>':''}`:'';
 return `<span class="pop-wrap"><button type="button" class="${labeled?'save-label':'bm'}" data-save="${j.id}" data-ctx="${ctx}" ${company||busy?'disabled':''} aria-label="${label}" aria-pressed="${on}" aria-busy="${busy}" aria-describedby="status-${j.id}-${ctx}">${ic('bookmark')}${labeled?(busy?'Guardando…':on?'Guardada':'Guardar'):''}</button>${help}</span>`;
}
function status(j,ctx){return `<p class="action-status" id="status-${j.id}-${ctx}" role="status">${S.session==='candidato'?S.results.get(j.id)||'':''}</p>`}
function card(j){return `<li><article class="card vcard"><div class="vhead"><span class="co" aria-hidden="true">${j.ini}</span><p class="company">${j.co}</p><h3><a href="#" data-detail>${j.title}</a></h3><div class="corner">${j.id==='j3'?'<span class="badge accent">Nueva</span>':''}</div></div><ul class="chips" aria-label="Condiciones principales"><li>${ic('pin')}${j.loc}</li><li>${ic(j.modeIcon)}${j.mode}</li><li>${ic('case')}${j.type}</li><li>${ic('trend')}${j.level}</li><li class="muted">${ic('users')}${j.apps} postulantes</li></ul><p class="excerpt">${j.ex}</p><div class="vfoot"><p class="salary">${j.sal} MXN<small>Mensual · bruto</small></p><div class="save-unit"><div class="actions">${bookmark(j,'card',true)}<button type="button" class="primary" data-detail>Ver vacante${ic('arrow')}</button></div>${status(j,'card')}</div></div></article></li>`}
function listing(){return `<h1 class="sr">Vacantes</h1><p class="muted" style="margin-bottom:16px">128 vacantes · Ordenadas por más recientes</p><ul class="results">${JOBS.map(card).join('')}</ul>`}
function detail(){const j=JOBS[0];const apply=S.session==='empresa'?'<p class="note">Las postulaciones son para cuentas de candidato</p>':`<button type="button" class="primary wide">Postularme${ic('arrow')}</button>`;
 return `<article class="detail"><section class="card hero"><span class="co" aria-hidden="true">${j.ini}</span><p class="muted">${j.co}</p><h1>${j.title}</h1><div class="badges"><span class="badge">${ic('pin')}${j.loc}</span><span class="badge">${ic(j.modeIcon)}${j.mode}</span><span class="badge">${j.type}</span><span class="badge">${j.level}</span></div><div class="hero-action">${bookmark(j,'hero',true)}${status(j,'hero')}</div><p class="when">${ic('cal')}Publicada el ${j.pub}</p></section><div class="dgrid"><div class="stack" style="gap:24px"><section class="card sec"><h2>La vacante de un vistazo</h2><dl class="facts"><div><dt>Área</dt><dd>${j.area}</dd></div><div><dt>Experiencia</dt><dd>5 años o más</dd></div><div><dt>Escolaridad</dt><dd>Licenciatura</dd></div><div><dt>Idiomas</dt><dd>Inglés avanzado</dd></div><div><dt>Horario</dt><dd>Lunes a viernes</dd></div><div><dt>Contrato</dt><dd>Indeterminado</dd></div></dl></section><section class="card sec"><nav aria-label="Secciones de la vacante"><a href="#descripcion">Sobre la vacante</a></nav><h2 id="descripcion">Sobre la vacante</h2><div class="prose"><p>En Nuvia ayudamos a más de 60 mil pequeños negocios a cobrar con tarjeta desde el celular. Buscamos a una persona que lidere el diseño de la experiencia de cobro y conciliación.</p><p>Trabajarás con un equipo de producto de ocho personas y presentarás tus hallazgos de investigación directamente a dirección.</p></div></section></div><aside class="card aside" aria-label="Compensación y postulación"><h2>${ic('money')}Compensación</h2><p class="big">${j.sal} MXN</p><p class="muted" style="margin-top:-12px;font-size:13px">Mensual · bruto</p><div class="hr"></div><div class="stack"><strong>¿Te ves en este equipo?</strong><p class="muted" style="font-size:13px">Da el siguiente paso en tu carrera con ${j.co}.</p></div><div class="stack">${apply}<button type="button" class="ghost" style="width:100%">${ic('share')}Compartir</button><p class="note">${ic('users')}${j.apps} postulantes</p></div><div class="company-foot">${ic('building')}<div><strong>${j.co}</strong><p class="muted">${j.loc} · ${j.mode}</p></div></div></aside></div></article>`}
function statusBadge(j){return j.status==='closed'?'<span class="badge neutral">Ya no disponible</span>':j.status==='applied'?`<span class="badge tone">${ic('ok')}Ya te postulaste</span>`:'<span class="badge tone success">Abierta</span>'}
function empty(filtered=false){return `<section class="card empty"><span class="tile">${filtered?'<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M8 8l4 4M12 8l-4 4"/></svg>':ic('bookmark')}</span><h2>${filtered?'Sin resultados':'Todavía no tienes vacantes guardadas'}</h2><p>${filtered?'Ninguna vacante coincide con la búsqueda o el filtro de disponibilidad.':'Guarda las vacantes que te interesen para revisarlas después. Aquí podrás encontrarlas cuando quieras postularte.'}</p><button type="button" class="primary" ${filtered?'data-clear':'data-explore'}>${filtered?'Limpiar filtros':'Explorar vacantes'}</button></section>`}
function savedCard(j){return `<li><article class="card saved-card"><header class="saved-head"><span class="identity" aria-hidden="true">${ic('bookmark')}</span><h2>${j.title}</h2><p class="company">${j.co}</p><div class="header-actions">${bookmark(j,'saved')}${statusBadge(j)}</div></header><div class="saved-content"><dl><div><dt>${ic(j.modeIcon)}Modalidad</dt><dd>${j.mode}</dd></div><div><dt>${ic('pin')}Ubicación</dt><dd>${j.loc}</dd></div></dl>${j.type?`<p class="muted">${j.type} · ${j.level}</p>`:''}${status(j,'saved')}</div><footer class="saved-foot"><div><strong>${j.sal} MXN</strong><small>Mensual · bruto</small><small>Guardada el ${j.savedOn}</small></div>${j.status==='closed'?'<span class="muted">Sin enlace de postulación</span>':'<button type="button" data-detail>Ver vacante'+ic('arrow')+'</button>'}</footer></article></li>`}
function savedResults(){const items=allSaved();const visible=items.filter(j=>(S.filter==='all'||(S.filter==='closed'?j.status==='closed':j.status!=='closed'))&&(!S.query||(j.title+' '+j.co).toLocaleLowerCase('es-MX').includes(S.query.toLocaleLowerCase('es-MX'))));return !items.length?empty():!visible.length?empty(true):`<ul class="saved-grid">${visible.map(savedCard).join('')}</ul>`}
function savedPage(){const items=allSaved();return `<div class="page-head"><div><h1>Vacantes guardadas</h1><p class="muted">Las vacantes que guardaste para revisarlas con calma.</p></div>${items.length?'<label class="search-label">'+ic('search')+'<span>Buscar guardadas</span><input id="query" type="search" placeholder="Puesto o empresa" aria-label="Buscar por puesto o empresa"></label>':''}</div>${items.length?`<div class="filters" role="group" aria-label="Disponibilidad">${[['all','Todas',items.length],['open','Abiertas',items.filter(j=>j.status!=='closed').length],['closed','Ya no disponibles',items.filter(j=>j.status==='closed').length]].map(([v,t,n])=>`<button type="button" data-filter="${v}" aria-pressed="${S.filter===v}">${t} (${n})</button>`).join('')}</div>`:''}<div id="saved-results" aria-live="polite">${savedResults()}</div>`}
function note(){return `<aside class="design-note" aria-label="Notas de diseño (no es UI)"><strong>Notas de diseño (no es UI)</strong><ul><li>Dirección 02: Guardar con etiqueta en el pie del listado y arriba a la derecha del hero. El aside conserva su composición; las guardadas usan la anatomía de tarjetas verticales de la pantalla actual.</li><li>Datos ilustrativos compartidos con la dirección 01. Solo cambia el estado después de una confirmación simulada; no hay requests ni persistencia. Éxito: 6 s. Error fijo, una acción y referencia técnica; el resultado también permanece junto al control.</li><li>Backend requerido, contrato por acordar: lectura de /candidato/guardadas con fecha, disponibilidad y postulación; consultas de catálogo/detalle con saved por candidato; guardar/quitar idempotentes y reconciliación de caché y conteos. No se deben inferir estados ausentes.</li><li>Visitante: Dialog de acceso, conservar ruta y filtros con next seguro. Empresa: Guardar deshabilitado y ayuda ⓘ. Autenticación y postulación son destinos ilustrativos, no flujos implementados.</li><li>Buscar y filtrar son locales; el vacío real no ofrece limpiar filtros. En producción: Skeleton de la misma grilla, error de lectura con StateCard y Reintentar, validación de acceso en servidor.</li></ul></aside>`}
function toast(kind,title,desc,action,ref){const el=document.createElement('div');el.className='toast '+kind;el.setAttribute('role',kind==='err'?'alert':'status');setMarkup(el,`${ic(kind==='ok'?'ok':'alert','i')}<div><strong>${title}</strong><p>${desc}</p>${ref?`<p class="ref">${ref}</p>`:''}</div><div style="display:flex;gap:4px;align-items:center">${action?`<button type="button" class="act">${action}</button>`:''}<button type="button" class="x" aria-label="Cerrar aviso">${ic('x')}</button></div>`);$('toasts').replaceChildren(el);el.querySelector('.x').onclick=()=>el.remove();const a=el.querySelector('.act');if(a)a.onclick=()=>{el.remove();if(action==='Ver guardadas')pick('view','guardadas');else if(action==='Reintentar'&&lastAttempt)save(...lastAttempt)};if(kind!=='err')setTimeout(()=>el.remove(),6000)}
let lastAttempt=null,returnFocus=null;
function focusSave(id,ctx){document.querySelector(`[data-save="${id}"][data-ctx="${ctx}"]`)?.focus()}
function save(id,ctx){
 if(S.session==='empresa'||S.busy.has(id))return;
 if(S.session==='visitante'){returnFocus={id,ctx};$('auth').showModal();return}
 const was=S.saved.has(id);S.busy.add(id);S.results.set(id,'Confirmando…');lastAttempt=[id,ctx];$('toasts').replaceChildren();render();
 setTimeout(()=>{S.busy.delete(id);if(S.fail==='error'){S.results.set(id,'No cambió · vuelve a intentar');render();focusSave(id,ctx);toast('err','El servidor tuvo un problema','Tu lista no cambió. Puedes reintentar sin duplicar.','Reintentar','HTTP 503 · service_unavailable · 17:58:46');return}
 was?S.saved.delete(id):S.saved.add(id);S.results.set(id,was?'Quitada de guardadas':'Vacante guardada');render();focusSave(id,ctx);if(ctx==='saved')document.querySelector('[data-filter]')?.focus();toast('ok',was?'Quitaste la vacante':'Vacante guardada',was?'Ya no aparece en tus vacantes guardadas.':'La encontrarás en Vacantes guardadas.',was?null:'Ver guardadas')},700)
}
function navHTML(){const v=S.view,priv=S.session==='candidato';const l=(id,icon,t)=>`<a class="nav-link" href="#" ${id===v?'aria-current="page"':''} ${id==='guardadas'?'data-saved':id==='listado'?'data-explore':''}>${ic(icon)}${t}</a>`;return l('listado','search','Vacantes')+(priv?`<p class="nav-label">Mi búsqueda</p>${l('-','dash','Dashboard')}${l('-','case','Postulaciones')}${l('guardadas','bookmark','Vacantes guardadas')}<p class="nav-label">Mi perfil</p>${l('-','person','Perfil')}${l('-','file','CVs')}${l('-','gear','Configuración')}`:'')}
function bind(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();save(b.dataset.save,b.dataset.ctx)});document.querySelectorAll('[data-help]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.pop=S.pop===b.dataset.help?null:b.dataset.help;render();document.querySelector(`[data-help="${b.dataset.help}"]`)?.focus()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>pick('view','detalle'));document.querySelectorAll('[data-explore]').forEach(b=>b.onclick=()=>pick('view','listado'));document.querySelectorAll('[data-saved]').forEach(b=>b.onclick=()=>pick('view','guardadas'));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render();document.querySelector(`[data-filter="${S.filter}"]`)?.focus()});document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{S.filter='all';S.query='';render();$('query')?.focus()})}
function render(){document.documentElement.classList.toggle('dark',S.theme==='dark');if(S.view==='guardadas'&&S.session!=='candidato')S.view='listado';setMarkup($('nav'),navHTML());setMarkup($('side-foot'),S.session==='candidato'?'<div class="account"><span class="avatar" aria-hidden="true">XR</span><div><strong>Ximena Ruiz</strong><p class="muted">Mi cuenta</p></div></div>':S.session==='visitante'?'<div class="visitor-card"><strong>Guarda tu búsqueda y sigue tus postulaciones</strong><button type="button" class="primary">Crear cuenta</button><button type="button">Iniciar sesión</button><button type="button" class="ghost">¿Eres empresa? Publica vacantes</button></div>':'<div class="visitor-card"><strong>Estás viendo las vacantes como las ve un candidato</strong><button type="button">Ir a mi panel</button><p class="muted">Cuenta de empresa</p></div>');setMarkup($('crumb'),S.view==='detalle'?'<a href="#" data-explore>Vacantes</a><span class="sep">/</span><span>Detalle de la vacante</span>':`<span>${S.view==='guardadas'?'Vacantes guardadas':'Vacantes'}</span>`);setMarkup($('main'),(S.view==='listado'?listing():S.view==='detalle'?detail():savedPage())+note());if($('query')){$('query').value=S.query;$('query').oninput=e=>{S.query=e.target.value;setMarkup($('saved-results'),savedResults());bind()}}bind();document.querySelectorAll('.demo .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S[g.dataset.group]===b.dataset.v))))}
function pick(g,v){S[g]=v;S.pop=null;if(g==='list'){S.saved=new Set(v==='datos'?SAVED.map(j=>j.id):[]);S.filter='all';S.query='';S.results.clear()}render()}
document.querySelectorAll('.demo .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(g.dataset.group,b.dataset.v)));
$('auth').querySelector('[data-close]').onclick=()=>$('auth').close();$('auth').addEventListener('close',()=>{if(returnFocus)focusSave(returnFocus.id,returnFocus.ctx)});
document.addEventListener('click',e=>{if(S.pop&&!e.target.closest('.pop-wrap')){const id=S.pop;S.pop=null;render();document.querySelector(`[data-help="${id}"]`)?.focus()}if(e.target.closest('a[href="#"]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pop){const id=S.pop;S.pop=null;render();document.querySelector(`[data-help="${id}"]`)?.focus()}});
render();
</script></body></html>
