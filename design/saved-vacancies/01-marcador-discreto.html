.rows{list-style:none;margin:0;padding:0}.rows-card{overflow:hidden}.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 190px auto;gap:16px;align-items:center;padding:14px 16px 14px 20px}.srow+.srow{border-top:1px solid var(--border)}.srow .co{width:44px;height:44px;font-size:14px}.srow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow .m{font-size:12px;color:var(--muted-foreground);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}.srow .money{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.srow .money small{display:block;font-size:12px;font-weight:400;color:var(--muted-foreground)}.srow .acts{display:flex;gap:4px;align-items:center}.srow.closed .t,.srow.closed .money{color:var(--muted-foreground)}.srow.closed .co{opacity:.6}.srow.removing{background:color-mix(in srgb,var(--primary) 4%,var(--card))}

<script>
// Design only: nothing is saved; state lives in this page.
const JOBS=[
 {id:'j1',title:'Diseñadora o diseñador UX Senior',co:'Nuvia Fintech',ini:'NF',loc:'Ciudad de México',mode:'Híbrido',modeIcon:'building',type:'Tiempo completo',level:'Senior',area:'Diseño',sal:'$45,000 – $55,000',ex:'Liderarás la investigación y el diseño de la app de pagos para pequeños negocios, junto a producto e ingeniería.',pub:'28 oct 2026',apps:34},
 {id:'j2',title:'Desarrollador o desarrolladora Frontend React',co:'Kuali Software',ini:'KS',loc:'Guadalajara, Jal.',mode:'Remoto',modeIcon:'globe',type:'Tiempo completo',level:'Semi senior',area:'Tecnología y sistemas',sal:'$38,000 – $48,000',ex:'Construirás el panel de facturación electrónica que usan más de 4 mil empresas en México.',pub:'27 oct 2026',apps:51},
 {id:'j3',title:'Analista de datos comerciales',co:'Grupo Andale Retail',ini:'GA',loc:'Monterrey, N.L.',mode:'Presencial',modeIcon:'building',type:'Tiempo completo',level:'Junior',area:'Datos y analítica',sal:'$26,000 – $32,000',ex:'Analizarás ventas de 120 tiendas y prepararás los tableros semanales para dirección comercial.',pub:'25 oct 2026',apps:18}
];
const SAVED=[
 {...JOBS[0],savedOn:'30 oct 2026',status:'open'},
 {...JOBS[1],savedOn:'29 oct 2026',status:'applied'},
 {id:'j4',title:'Product Designer',co:'Ruta Logística',ini:'RL',loc:'Querétaro, Qro.',mode:'Híbrido',modeIcon:'building',sal:'$40,000 – $50,000',savedOn:'12 oct 2026',status:'closed'},
 {...JOBS[2],savedOn:'8 oct 2026',status:'open'}
];
const S={view:'listado',session:'candidato',fail:'ok',list:'datos',theme:'light',saved:new Set(['j2']),busy:new Set(),pop:null,removed:[]};
const $=id=>document.getElementById(id);const ic=(n,c='')=>`<svg aria-hidden="true" class="${c}"><use href="#${n}"/></svg>`;
function setMarkup(el,m){const d=new DOMParser().parseFromString(m,'text/html');el.replaceChildren(...d.body.childNodes)}
function bookmark(job,ctx){
 if(S.session==='empresa')return'';
 const on=S.saved.has(job.id),busy=S.busy.has(job.id);
 const label=on?`Quitar ${job.title} de guardadas`:`Guardar ${job.title}`;
 const pop=S.pop===job.id+ctx&&S.session==='visitante'?visitorPop():'';
 return `<span class="pop-wrap"><button type="button" class="bm" data-save="${job.id}" data-ctx="${ctx}" aria-pressed="${on}" aria-busy="${busy}" aria-label="${label}" title="${on?'Guardada':'Guardar'}">${ic('bookmark')}</button>${pop}</span>`;
}
function visitorPop(){return `<div class="pop" role="dialog" aria-label="Inicia sesión para guardar"><strong>Guarda vacantes para verlas después</strong><p>Crea una cuenta o inicia sesión. Volverás a esta misma página y la vacante quedará guardada.</p><div class="row2"><button type="button" class="primary">Crear cuenta</button><button type="button">Iniciar sesión</button></div></div>`}
function card(j){return `<li><article class="card vcard"><div class="vhead"><span class="co" aria-hidden="true">${j.ini}</span><p class="company">${j.co}</p><h3><a href="#">${j.title}</a></h3><div class="corner">${j.id==='j3'?'<span class="badge accent">Nueva</span>':''}${bookmark(j,'card')}</div></div>
<ul class="chips" aria-label="Condiciones principales"><li>${ic('pin')}${j.loc}</li><li>${ic(j.modeIcon)}${j.mode}</li><li>${ic('case')}${j.type}</li><li>${ic('trend')}${j.level}</li><li class="muted">${ic('users')}${j.apps} postulantes</li></ul><p class="excerpt">${j.ex}</p>
<div class="vfoot"><p class="salary">${j.sal} MXN<small>Mensual · bruto</small></p><a href="#" class="primary" style="display:inline-flex;gap:8px;align-items:center;min-height:44px;padding:8px 20px;border-radius:calc(var(--radius)*.8);font-weight:500">Ver vacante${ic('arrow')}</a></div></article></li>`}
function listing(){return `<h1 class="sr">Vacantes</h1><p class="muted" style="margin-bottom:16px">128 vacantes · Ordenadas por más recientes</p><ul class="results">${JOBS.map(card).join('')}</ul>`}
function detail(){const j=JOBS[0],on=S.saved.has(j.id),busy=S.busy.has(j.id);
 const saveBtn=S.session==='empresa'?'':`<span class="pop-wrap" style="display:grid"><button type="button" class="save-label" data-save="${j.id}" data-ctx="aside" aria-pressed="${on}" aria-busy="${busy}">${ic('bookmark')}${busy?(on?'Quitando…':'Guardando…'):on?'Guardada':'Guardar'}</button>${S.pop===j.id+'aside'&&S.session==='visitante'?visitorPop():''}</span>`;
 const apply=S.session==='empresa'?`<p class="note">Las postulaciones son para cuentas de candidato</p>`:`<button type="button" class="primary wide">Postularme${ic('arrow')}</button>`;
 return `<article class="detail"><section class="card hero"><span class="co" aria-hidden="true">${j.ini}</span><p class="muted">${j.co}</p><h1>${j.title}</h1><div class="badges"><span class="badge">${ic('pin')}${j.loc}</span><span class="badge">${ic(j.modeIcon)}${j.mode}</span><span class="badge">${j.type}</span><span class="badge">${j.level}</span></div><p class="when">${ic('cal')}Publicada el ${j.pub}</p></section>
<div class="dgrid"><div class="stack" style="gap:24px"><section class="card sec"><h2>La vacante de un vistazo</h2><dl class="facts"><div><dt>Área</dt><dd>${j.area}</dd></div><div><dt>Experiencia</dt><dd>5 años o más</dd></div><div><dt>Escolaridad</dt><dd>Licenciatura</dd></div><div><dt>Idiomas</dt><dd>Inglés avanzado</dd></div><div><dt>Horario</dt><dd>Lunes a viernes</dd></div><div><dt>Contrato</dt><dd>Indeterminado</dd></div></dl></section>
<section class="card sec"><h2>Sobre la vacante</h2><div class="prose"><p>En Nuvia ayudamos a más de 60 mil pequeños negocios a cobrar con tarjeta desde el celular. Buscamos a una persona que lidere el diseño de la experiencia de cobro y conciliación.</p><p>Trabajarás con un equipo de producto de ocho personas y presentarás tus hallazgos de investigación directamente a dirección.</p></div></section></div>
<aside class="card aside" aria-label="Compensación y postulación"><h2>${ic('money')}Compensación</h2><p class="big">${j.sal} MXN</p><p class="muted" style="margin-top:-12px;font-size:13px">Mensual · bruto</p><div class="hr"></div><div class="stack"><strong>¿Te ves en este equipo?</strong><p class="muted" style="font-size:13px">Da el siguiente paso en tu carrera con ${j.co}.</p></div>
<div class="stack">${apply}<div class="${S.session==='empresa'?'':'pair'}">${saveBtn}<button type="button" class="ghost" style="width:100%">${ic('share')}Compartir</button></div><p class="status-line" role="status">${on&&!busy?'Está en tus vacantes guardadas':''}</p><p class="note">${ic('users')}${j.apps} postulantes</p></div>
<div class="company-foot">${ic('building')}<div><strong>${j.co}</strong><p class="muted">${j.loc} · ${j.mode}</p></div></div></aside></div></article>`}
function statusBadge(s){return s.status==='applied'?`<span class="badge tone">${ic('ok')}Ya te postulaste</span>`:s.status==='closed'?`<span class="badge neutral">Ya no está disponible</span>`:''}
function savedPage(){
 const items=S.list==='vacia'?[]:SAVED.filter(s=>!S.removed.includes(s.id));
 const head=`<div class="page-head"><div><h1>Vacantes guardadas</h1><p class="muted">Las vacantes que guardaste para revisarlas con calma.</p></div>${items.length?`<label class="sort"><span class="muted">${items.length} guardadas · Ordenar por</span><select class="select"><option>Guardadas recientemente</option><option>Publicación más reciente</option></select></label>`:''}</div>`;
 if(!items.length)return head+`<section class="card empty"><span class="tile">${ic('bookmark')}</span><h2>Todavía no tienes vacantes guardadas</h2><p>Toca el marcador de cualquier vacante para guardarla. Aquí la tendrás a mano para postularte cuando estés listo o lista.</p><button type="button" class="primary">${ic('search')}Explorar vacantes</button></section>`;
 return head+`<section class="card rows-card" aria-label="Lista de vacantes guardadas"><ul class="rows">${items.map(s=>`<li class="srow ${s.status==='closed'?'closed':''}"><span class="co" aria-hidden="true">${s.ini}</span><div style="min-width:0"><p class="t">${s.title}</p><p class="m"><span>${s.co}</span><span>${s.loc}</span><span>${s.mode}</span><span>Guardada el ${s.savedOn}</span></p><div style="margin-top:6px;display:flex;gap:6px">${statusBadge(s)}</div></div><p class="money">${s.status==='closed'?'—':s.sal+' MXN'}<small>${s.status==='closed'?'Cerró el 28 oct 2026':'Mensual · bruto'}</small></p><div class="acts">${s.status==='closed'?'':`<a href="#" class="ghost" style="display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border:1px solid var(--border);border-radius:calc(var(--radius)*.8);font-weight:500">${s.status==='applied'?'Ver postulación':'Ver vacante'}</a>`}<button type="button" class="bm" aria-pressed="true" data-remove="${s.id}" aria-label="Quitar ${s.title} de guardadas" title="Quitar de guardadas">${ic('bookmark')}</button></div></li>`).join('')}</ul></section>`+note();
}
function note(){return `<aside class="design-note" aria-label="Notas de diseño (no es UI)"><strong>Notas de diseño (no es UI)</strong><ul><li>El marcador es un toggle con <code>aria-pressed</code>; mientras el servidor confirma muestra un anillo de carga y no cambia de estado. El toast de éxito sale solo tras la confirmación (§12).</li><li>Quitar desde esta lista saca la fila al instante y ofrece «Deshacer» durante 6 s; una vacante cerrada se conserva con «Ya no está disponible» hasta que la quites.</li><li>Necesita backend: <code>PUT/DELETE /v2/me/saved-jobs/{jobId}</code> (idempotentes), <code>GET /v2/me/saved-jobs</code> con estado de la vacante y si ya te postulaste, y <code>saved: bool</code> en el catálogo para la sesión de candidato.</li></ul></aside>`}
function toast(kind,title,desc,action,ref){const el=document.createElement('div');el.className='toast '+kind;el.setAttribute('role',kind==='err'?'alert':'status');setMarkup(el,`${ic(kind==='ok'?'ok':'alert','i')}<div><strong>${title}</strong><p>${desc}</p>${ref?`<p class="ref">${ref}</p>`:''}</div><div style="display:flex;gap:4px;align-items:center">${action?`<button type="button" class="act">${action}</button>`:''}<button type="button" class="x" aria-label="Cerrar aviso">${ic('x')}</button></div>`);$('toasts').replaceChildren(el);el.querySelector('.x').onclick=()=>el.remove();const a=el.querySelector('.act');if(a)a.onclick=()=>{el.remove();if(action==='Deshacer'){S.removed.pop();render()}else if(action==='Ver guardadas'){pick('view','guardadas')}else if(action==='Reintentar'){pick('fail','ok')}};if(kind!=='err')setTimeout(()=>el.remove(),6000)}
function save(id,ctx){
 if(S.session==='visitante'){S.pop=S.pop===id+ctx?null:id+ctx;render();return}
 const was=S.saved.has(id);S.busy.add(id);render();
 setTimeout(()=>{S.busy.delete(id);
  if(S.fail==='error'){render();toast('err',was?'No se pudo quitar la vacante':'No se pudo guardar la vacante','No hubo respuesta del servidor. Puedes reintentar: no se duplicará.','Reintentar','HTTP 503 · service_unavailable · 17:58:46');return}
  was?S.saved.delete(id):S.saved.add(id);render();
  was?toast('ok','Quitaste la vacante','Ya no aparece en tus vacantes guardadas.'):toast('ok','Vacante guardada','La encontrarás en Vacantes guardadas.','Ver guardadas')},700)}
function navHTML(){const v=S.view,priv=S.session==='candidato';const l=(id,icon,t)=>`<a class="nav-link" href="#" ${v===id?'aria-current="page"':''}>${ic(icon)}${t}</a>`;
 return l(v==='guardadas'?'x':v,'search','Vacantes')+(priv?`<p class="nav-label">Mi búsqueda</p>${l('-','dash','Dashboard')}${l('-','case','Postulaciones')}${l('guardadas','bookmark','Vacantes guardadas')}<p class="nav-label">Mi perfil</p>${l('-','person','Perfil')}${l('-','file','CVs')}${l('-','gear','Configuración')}`:'')}
function render(){
 document.documentElement.classList.toggle('dark',S.theme==='dark');
 if(S.view==='guardadas'&&S.session!=='candidato')S.view='listado';
 setMarkup($('nav'),navHTML().replace('aria-current="page"','aria-current="page"'));
 setMarkup($('side-foot'),S.session==='candidato'?`<div class="account"><span class="avatar" aria-hidden="true">XR</span><div><strong>Ximena Ruiz</strong><p class="muted">Mi cuenta</p></div></div>`:S.session==='visitante'?`<div class="visitor-card"><strong>Guarda tu búsqueda y sigue tus postulaciones</strong><button type="button" class="primary">Crear cuenta</button><button type="button">Iniciar sesión</button></div>`:`<div class="visitor-card"><strong>Estás viendo las vacantes como las ve un candidato</strong><button type="button">Ir a mi panel</button></div>`);
 setMarkup($('crumb'),S.view==='detalle'?`<a href="#">Vacantes</a><span class="sep">/</span><span>Detalle de la vacante</span>`:S.view==='guardadas'?`<span>Vacantes guardadas</span>`:`<span>Vacantes</span>`);
 setMarkup($('main'),S.view==='listado'?listing()+note():S.view==='detalle'?detail()+note():savedPage());
 document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();save(b.dataset.save,b.dataset.ctx)});
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{S.removed.push(b.dataset.remove);render();toast('ok','Quitaste la vacante','Ya no aparece en tus vacantes guardadas.','Deshacer')});
 document.querySelectorAll('.demo .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S[g.dataset.group]===b.dataset.v))));
}
function pick(g,v){S[g]=v;S.pop=null;if(g==='list')S.removed=[];render()}
document.querySelectorAll('.demo .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(g.dataset.group,b.dataset.v)));
document.addEventListener('click',e=>{if(S.pop&&!e.target.closest('.pop')){S.pop=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pop){const id=S.pop;S.pop=null;render();const t=document.querySelector(`[data-save="${id.replace(/card|aside/,'')}"]`);t&&t.focus()}});
document.addEventListener('click',e=>{if(e.target.closest('a[href="#"]'))e.preventDefault()});
render();
</script></body></html>
