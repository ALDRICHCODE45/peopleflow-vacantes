<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Página propia de tabla</title><style>
:root{color-scheme:light;--background:#F7F5FB;--foreground:#1A1626;--card:#FFFFFF;--popover:#FFFFFF;--primary:oklch(0.491 0.27 292.581);--primary-foreground:oklch(0.969 0.016 293.756);--secondary:#F1EEF7;--muted:#F1EEF7;--accent:#F1EEF7;--muted-foreground:#6B6480;--border:#E4DFF0;--input:#E4DFF0;--destructive:oklch(0.577 0.245 27.325);--brand-decorative-strong:oklch(0.54 0.15 292.581);--primary-text:var(--primary);--status-info:oklch(0.45 0.16 250);--status-review:oklch(0.47 0.12 70);--status-success:oklch(0.46 0.13 152);--status-danger:oklch(0.45 0.2 25);--sidebar:oklch(0.985 0 0);--sidebar-accent:oklch(0.97 0 0);--ring:oklch(0.708 0 0);--pf-tint-base:var(--card);--pf-tone-on-time:var(--primary);--pf-tone-late:color-mix(in oklab,var(--primary) 45%,var(--pf-tint-base));--pf-tone-none:var(--border);--sel:var(--primary);--on-sel:var(--primary-foreground);--edge:color-mix(in oklab,var(--foreground) 50%,var(--card))}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:14px/20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

b,strong{font-weight:600}

/* ---------- artboard chrome (not product UI) ---------- */
.ab{max-width:1488px;margin:0 auto;padding:24px 24px 48px}

html[data-theme=dark] .seg [aria-pressed=true],html[data-theme=dark] .seg [aria-selected=true]{background:color-mix(in srgb,var(--foreground) 10%,transparent);box-shadow:none}

/* ---------- frame + shell ---------- */

.m .page{padding:16px 16px 24px;gap:16px}
.vp.auto .page{overflow:visible}
.page.dim{overflow:hidden}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:18px;background:transparent;color:var(--foreground)}
.ib:hover{background:var(--muted)}
/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:18px;border:1px solid transparent;background:transparent;font-weight:500;line-height:20px;white-space:nowrap;text-decoration:none;color:var(--foreground)}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{background:color-mix(in oklab,var(--primary) 85%,var(--foreground))}
.btn.outline{background:var(--background);border-color:var(--border)}
.btn.outline:hover{background:var(--muted)}
.btn.ghost{color:var(--muted-foreground)}.btn.ghost:hover{background:var(--muted);color:var(--foreground)}
.btn.sec{background:var(--secondary)}
.btn.lg{min-height:44px}.btn.icon{width:40px;padding:0}
.btn.wrapt{white-space:normal;text-align:left;height:auto;padding-top:8px;padding-bottom:8px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn.link{color:var(--primary-text);padding:0 4px}.btn.link:hover{text-decoration:underline}
.btn[aria-expanded=true]{background:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--c);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}

.b-neutral{--c:var(--muted-foreground);background:var(--muted);border-color:var(--border)}

.card{background:var(--card);border-radius:24px;box-shadow:0 1px 2px color-mix(in srgb,var(--foreground) 6%,transparent),0 0 0 1px color-mix(in srgb,var(--foreground) 5%,transparent)}

.av{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:color-mix(in oklab,var(--primary) 10%,var(--card));color:var(--primary-text);font-size:12px;font-weight:500}

.tile{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:14px;background:var(--muted);color:var(--foreground)}

.tile .i{width:20px;height:20px}
.inp{width:100%;min-height:40px;padding:0 14px;border:0;border-radius:18px;background:color-mix(in srgb,var(--input) 50%,transparent);color:var(--foreground)}
.inp:focus{outline:2px solid var(--primary-text);outline-offset:0}
select.inp{appearance:none;padding-right:36px}
.ic{position:relative;display:block}
.ic>.i{position:absolute;right:12px;top:12px;color:var(--muted-foreground);pointer-events:none}
.fld{display:grid;gap:8px;align-content:start;min-width:0}
.lb{font-weight:500}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--status-danger);font-size:12px;line-height:16px}

.sk{border-radius:18px;background:var(--muted);animation:pulse 1.6s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:color-mix(in oklab,var(--primary) 6%,var(--card));font-size:12px;line-height:16px}
.note .i{color:var(--primary-text);margin-top:0}
.note.mu{background:var(--muted)}.note.mu .i{color:var(--muted-foreground)}
/* choice list (system: «Choice and file controls») */
.lst{border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--border);overflow:hidden}
.li{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;cursor:pointer}
.li+.li{border-top:1px solid color-mix(in oklab,var(--border) 60%,transparent)}
.li input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:inherit}
.li.hd{background:color-mix(in oklab,var(--muted) 55%,var(--card))}
.li:hover{background:color-mix(in oklab,var(--muted) 70%,transparent)}
.li:has(:checked),.li:has(:indeterminate){background:color-mix(in oklab,var(--primary) 7%,var(--card))}
.li:has(:checked)::before,.li:has(:indeterminate)::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:999px;background:var(--sel)}
.li:has(:focus-visible){outline:2px solid var(--primary-text);outline-offset:-2px}
.li:has(:disabled){cursor:not-allowed;background:var(--muted)}
.tx2{display:grid;gap:2px;min-width:0;flex:1}
.tx2 b{font-weight:500;overflow-wrap:anywhere}

.tr{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--edge);color:var(--on-sel);margin-left:auto}
.tr.sq{border-radius:7px}
.tr .i{width:14px;height:14px;stroke-width:3;opacity:0}
.li:has(:checked) .tr,.li:has(:indeterminate) .tr{background:var(--sel);box-shadow:none}
.li:has(:checked) .tr .i,.li:has(:indeterminate) .tr .i{opacity:1}
.li input:indeterminate~.tr .ck-i{display:none}.li input:not(:indeterminate)~.tr .mn-i{display:none}
.li:has(:disabled) .tr{background:transparent;box-shadow:inset 0 0 0 1.5px var(--border)}
.gl{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;font-size:12px;line-height:16px;font-weight:600;color:var(--muted-foreground)}
/* overlays */
.ov{position:absolute;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgb(0 0 0/.3);backdrop-filter:blur(4px)}
.sheet{position:absolute;top:16px;right:16px;bottom:16px;width:448px;border-radius:18px;background:var(--popover);border:1px solid color-mix(in srgb,var(--border) 60%,transparent);box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);display:flex;flex-direction:column;overflow:hidden}
.sh-h{padding:24px 24px 8px;display:grid;gap:6px;padding-right:72px;position:relative}
.sh-h h2{font-size:16px;line-height:24px;font-weight:500}

.sh-x:hover{background:var(--muted)}
.sh-b{flex:1;min-height:0;overflow:auto;padding:16px 24px;display:grid;gap:16px;align-content:start;scrollbar-width:thin}
.sh-f{padding:12px 24px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.drw{position:absolute;left:0;right:0;bottom:0;max-height:92%;border-radius:24px 24px 0 0;background:var(--popover);box-shadow:0 -10px 30px -10px rgb(0 0 0/.1),0 0 0 1px color-mix(in srgb,var(--foreground) 5%,transparent);display:flex;flex-direction:column;overflow:hidden}
.drw::before{content:"";width:48px;height:4px;border-radius:999px;background:var(--border);margin:8px auto 0;flex:none}
.drw .sh-h{padding:12px 16px 4px;padding-right:64px}
.drw .sh-x{top:8px;right:8px}
.drw .sh-b{padding:12px 16px}
.drw .sh-f{padding:12px 16px 16px;border-top:0}
.drw .sh-f .btn{min-height:44px;flex:1 1 0}
.drw.tall{top:24px;max-height:none}
.pw{position:relative;display:inline-flex}
.pop{position:absolute;z-index:40;top:calc(100% + 8px);left:0;width:min(360px,calc(100vw - 48px));padding:16px;border-radius:22px;background:var(--popover);box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1),0 0 0 1px color-mix(in srgb,var(--foreground) 6%,transparent);display:grid;gap:12px;color:var(--foreground);text-align:left;white-space:normal}
.pop.end{left:auto;right:0}
.pop.w460{width:min(460px,calc(100vw - 48px))}
.pop h3{font-size:16px;line-height:24px;font-weight:500}
.pop-f{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.m .pop{position:fixed;left:16px;right:16px;width:auto;top:auto}
.toast{position:absolute;right:16px;bottom:16px;z-index:90;max-width:380px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--popover);box-shadow:0 0 0 1px var(--border),0 10px 15px -3px rgb(0 0 0/.1)}
.toast b{display:block;font-weight:600}
.toast .i{color:var(--primary-text);margin-top:2px}
.m .toast{left:12px;right:12px;bottom:12px;max-width:none}
/* page header, period control, toolbar, chips */
.crumb{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted-foreground);flex-wrap:wrap}
.crumb a{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 8px;margin-left:-8px;border-radius:12px;font-weight:500;color:var(--primary-text);text-decoration:none}
.crumb a:hover{background:var(--muted)}
.crumb [aria-current]{color:var(--foreground);font-weight:500;overflow-wrap:anywhere}
.phead{display:grid;gap:4px;min-width:0}
.phead h2{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em}
.phead .ds{color:var(--muted-foreground);max-width:760px}
.per{display:inline-flex;flex-wrap:wrap;max-width:100%;padding:2px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.per button{min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--muted-foreground);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.per button:hover{background:var(--muted)}
.per [aria-pressed=true]{background:color-mix(in oklab,var(--primary) 10%,var(--card));color:var(--primary-text);font-weight:600}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.tbar .sp{flex:1}
.trig .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:600;line-height:16px}
html[data-theme=dark] .trig .n{background:var(--primary-text);color:var(--card)}
.trig.on{background:color-mix(in oklab,var(--primary) 7%,var(--card));border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:flex-start;max-width:100%;min-height:40px;padding:0 0 0 12px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--border);font-size:14px;line-height:20px}
.chip .ct{min-width:0;overflow-wrap:anywhere;padding:10px 4px 10px 0}
.chip .ct b{font-weight:500}
.chip.ro{padding-right:12px}
.cx{display:grid;place-items:center;flex:none;width:40px;height:40px;border:0;border-radius:14px;background:transparent;color:var(--muted-foreground)}
.cx:hover{background:var(--muted);color:var(--foreground)}
.rline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.rline .sp{flex:1}
/* figures, cells, bars */
.fig{display:inline-block;min-height:24px;line-height:24px;color:inherit;text-decoration:none;border-radius:6px;font-variant-numeric:tabular-nums}
.fig:hover,.fig:focus-visible{text-decoration:underline;text-underline-offset:3px}
.cv{display:grid;gap:3px;min-width:0}
.cp{font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cp .mu2{font-weight:400;color:var(--muted-foreground)}
.cs{font-size:12.5px;line-height:17px;color:var(--muted-foreground);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cs .fig{color:inherit}
.miss{color:var(--muted-foreground);font-weight:400}
.bar{display:flex;height:8px;border-radius:999px;background:var(--pf-tone-none);overflow:hidden;min-width:48px}
.bar i{display:block;height:100%}
.bar .b-on{background:var(--pf-tone-on-time)}.bar .b-late{background:var(--pf-tone-late)}.bar .b-over{background:var(--destructive)}

function mountFrames(){
  const make=(el,m)=>{const f={el,m,s:null,focus:null,noAuto:false,render(){renderFrame(f)}};AB.frames.push(f);
    el.addEventListener('click',e=>handle(f,e,'click'));
    el.addEventListener('change',e=>handle(f,e,'change'));
    el.addEventListener('keydown',e=>{
      if(e.key==='Escape'){if(escFrame(f)){e.preventDefault();e.stopPropagation();return}}
      if(e.key==='Tab')trap(f,e);
      const tab=e.target.closest&&e.target.closest('[role=tab]');
      if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End')){
        const tabs=$$('[role=tab]:not([disabled])',tab.parentElement);let i=tabs.indexOf(tab);
        i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
        e.preventDefault();tabs[i].click()}
      if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr.r')){handle(f,{target:e.target,preventDefault(){}},'click')}
    });
    return f};
  make($('#vd'),false);make($('#vm'),true);
}
function handle(f,e,type){
  const t=e.target.closest('[data-act]');
  if(!t||!f.el.contains(t)){if(type==='click'&&f.s&&f.s.layer&&!e.target.closest('.pw,.ov')){f.s.layer=null;f.render()}return}
  const a=t.dataset.act;
  if((t.dataset.on||'click')!==type)return;
  if(t.tagName==='A'&&e.preventDefault)e.preventDefault();
  const ok=commonAct(f,a,t,e)||AB.act(f,a,t,e);
  if(ok!==false)f.render();
}
function escFrame(f){
  const s=f.s;if(!s)return false;

  return false;
}
function trap(f,e){
  const ov=$('.ov',f.el);if(!ov)return;
  const items=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href],[tabindex="0"]',ov).filter(x=>x.offsetParent!==null||x===document.activeElement);
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(!ov.contains(document.activeElement)){first.focus();e.preventDefault();return}
  if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}
  else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}
}
function renderFrame(f){
  const a=document.activeElement;const inF=a&&f.el.contains(a);
  const fk=inF?(a.closest('[data-fk]')||{}).dataset?.fk:null;
  const sc=$('.page',f.el),top=sc?sc.scrollTop:0;
  const keep=$$('[data-keep]',f.el).map(x=>[x.dataset.keep,x.scrollTop,x.scrollLeft]);
  f.el.innerHTML=AB.render(f);uniq(f.el,f.m?'-m':'-d');
  const sc2=$('.page',f.el);if(sc2)sc2.scrollTop=top;
  keep.forEach(([k,v,h])=>{const x=$(`[data-keep="${k}"]`,f.el);if(x){x.scrollTop=v;x.scrollLeft=h}});
  const want=f.focus||fk;f.focus=null;
  let tgt=null;
  if(want==='@layer')tgt=$('.ov [data-autofocus]',f.el)||$('.pop [data-autofocus]',f.el)||$('.ov .sh-b input,.ov .sh-b select,.ov .sh-b a',f.el)||$('.pop input,.pop button,.pop select',f.el)||$('.ov button',f.el);
  else if(want)tgt=$(`[data-fk="${CSS.escape(want)}"]`,f.el);
  if(!tgt&&!f.noAuto&&$('.ov',f.el)&&!want)tgt=$('.ov [data-autofocus]',f.el)||$('.ov button',f.el);
  if(tgt)tgt.focus({preventScroll:true});
  f.noAuto=false;layout();
  fitSticky(f);fixInd(f.el);
}
function fitSticky(f){/* altura real de la fila de grupos, para que la 2.ª fila de cabecera se pegue debajo */
  $$('.tb',f.el).forEach(t=>{const g=$('thead tr:first-child th[scope=colgroup]',t)||$('thead tr:first-child th',t);if(!g)return;const h=g.getBoundingClientRect().height/(f.scale||1);
    const two=$$('thead tr',t).length>1;$$('thead tr:first-child th',t).forEach(x=>x.style.top='0');
    if(two)$$('thead tr:nth-child(2) th',t).forEach(x=>x.style.top=Math.round(g.offsetHeight)+'px')});
}
function uniq(root,suf){

function commonAct(f,a,t,e){
  const s=f.s;
  switch(a){
    case 'sort':s.layer=null;s.sort=nextSort(s.sort,t.dataset.k);f.focus='sort-'+t.dataset.k;s.announce=true;return true;
    case 'sortsel':{s.layer=null;const [k,d]=t.value.split(':');s.sort={k,d};f.focus='sortsel';return true}
    case 'lay':s.layer=s.layer===t.dataset.l?null:t.dataset.l;s.ret=t.dataset.fk;f.focus=s.layer?'@layer':s.ret;return true;
    case 'lay-close':s.layer=null;f.focus=s.ret;return true;
    case 'coltog':{const id=t.dataset.v;s.hidden=s.hidden.includes(id)?s.hidden.filter(x=>x!==id):[...s.hidden,id];return true}
    case 'colall':s.hidden=s.hidden.length?[]:COLS.map(c=>c.id);return true;
    case 'reset':s.sort={...DEF_SORT};s.hidden=[];if(t.dataset.fk!=='reset-p')s.layer=null;f.focus=t.dataset.fk;return true;
    case 'proc':s.proc=t.dataset.v;s.layer=null;f.focus=s.ret;return true;
    case 'per':if(t.dataset.v==='custom'){s.layer=s.layer==='custom'?null:'custom';s.ret=t.dataset.fk;f.focus=s.layer?'@layer':s.ret}else{s.per=t.dataset.v;s.layer=null;s.data='ok'}return true;
    case 'cfrom':s.cf=t.value;f.focus='cf';return true;
    case 'cto':s.ct=t.value;f.focus='ct';return true;
    case 'capply':s.per='custom';s.layer=null;f.focus=s.ret;return true;
    case 'rmchip':if(t.dataset.k==='proc')s.proc='all';else s.inherit=s.inherit.filter(x=>x!==t.dataset.k);if(s.data==='none'&&!s.inherit.length&&s.proc==='all')s.data='ok';f.focus='tb-first';return true;
    case 'clear':s.proc='all';s.inherit=[];s.data='ok';f.focus='tb-first';return true;
    case 'retry':s.data='loading';f.focus='retry-live';setTimeout(()=>{if(f.s===s&&s.data==='loading'){s.data='ok';f.render()}},1100);return true;
    case 'fig':s.toast=t.dataset.fig;clearTimeout(f.tt);f.tt=setTimeout(()=>{if(f.s===s){s.toast=null;f.noAuto=true;f.render()}},4200);return true;
    case 'open':s.dlg=false;s.screen='detail';s.who=t.dataset.id;s.pop=null;s.layer=null;s.scrollBack=($('.page',f.el)||{}).scrollTop;f.focus='detail-h';return true;
    case 'back':s.screen='page';s.who=null;f.focus='row-'+(t.dataset.id||'');return true;
  }
  return false;
}

  return `<div class="card" style="overflow:hidden" aria-hidden="true"><table class="tb"><thead><tr><th style="position:static;width:216px">Reclutador</th>${cols.map(c=>`<th class="num" style="position:static">${c.label}</th>`).join('')}<th style="position:static;width:48px"></th></tr></thead><tbody>${[0,1,2,3,4,5].map(()=>`<tr><td style="height:86px"><div style="display:flex;gap:12px">${skel('40px',40,999)}<div style="display:grid;gap:8px">${skel('120px',14)}${skel('90px',12)}</div></div></td>${cols.map(()=>`<td><div style="display:grid;gap:8px;justify-items:end">${skel('56px',14)}${skel('72px',12)}</div></td>`).join('')}<td></td></tr>`).join('')}</tbody></table></div>`;
}
function table1(f,rows){
  const s=f.s,cols=visCols(s);
  const groups=GROUPS.map(([g,gn])=>[g,gn,cols.filter(c=>c.grp===g)]).filter(x=>x[2].length);
  const W=184+44+cols.reduce((a,c)=>a+c.w,0);
  const colg=`<colgroup><col style="width:184px">${cols.map(c=>`<col style="width:${c.w}px">`).join('')}<col style="width:44px"></colgroup>`;
  const h1=`<tr><th class="sl" rowspan="2" scope="col"${ariaSort(s,'name')} style="vertical-align:bottom">${sortBtn(s,'name','Reclutador')}</th>${groups.map(([g,gn,cs],i)=>`<th scope="colgroup" colspan="${cs.length}">${gn}</th>`).join('')}<th class="sr2" rowspan="2" scope="col"><span class="sr">Ver ficha</span></th></tr>`;
  const firstOf=new Set(groups.map(g=>g[2][0].id));
  const h2=`<tr>${cols.map(c=>`<th scope="col" class="num${firstOf.has(c.id)?' gst':''}"${ariaSort(s,c.id)}>${sortBtn(s,c.id,c.label)}</th>`).join('')}</tr>`;
  const body=rows.map(p=>`<tr class="r" data-act="open" data-id="${p.id}"><th scope="row" class="sl">${whoHTML(p,{av:''})}</th>${cols.map(c=>`<td class="num${firstOf.has(c.id)?' gst':''}">${cellHTML(c,p,{bar:c.id==='on_time'})}</td>`).join('')}<td class="sr2">${chevHTML(p)}</td></tr>`).join('');
  return `<div class="card" style="overflow:hidden"><div class="tscroll" role="region" aria-label="Tabla con desplazamiento horizontal" tabindex="0" data-keep="tbl" style="max-height:max(480px,calc(100dvh - 120px))"><table class="tb" style="min-width:${W}px"><caption class="sr">Reclutadores del periodo. ${sortLabel(s.sort)}</caption>${colg}<thead>${h1}${h2}</thead><tbody>${body}</tbody></table></div></div>`;
}
function cards1(f,rows){
  const s=f.s,cols=visCols(s);
  const groups=GROUPS.map(([g,gn])=>[g,gn,cols.filter(c=>c.grp===g)]).filter(x=>x[2].length);
  return `<div class="card"><ul class="plist" aria-label="Reclutadores">${rows.map(p=>`<li><article class="pc"><div class="pc-h">${whoHTML(p)}${chevHTML(p)}</div>${groups.map(([g,gn,cs])=>`<div class="pgg" role="group" aria-label="${gn}"><p class="gl2">${gn}</p><dl class="pgd" style="grid-template-columns:repeat(${g==='load'?3:2},minmax(0,1fr))">${cs.map(c=>`<div class="pgi${c.id==='on_time'?' wide':''}"><dt>${c.label}</dt><dd>${cellHTML(c,p,{bar:c.id==='on_time'})}</dd></div>`).join('')}</dl></div>`).join('')||`<p class="hp">Todas las columnas están ocultas. Elige cuáles ver en «Columnas».</p>`}</article></li>`).join('')}</ul></div>`;
}
AB.render=f=>{
  const s=f.s,m=f.m;let body;
  if(s.screen==='board')body=boardHTML(f,{linkAct:'link'});
  else if(s.screen==='detail')body=detailHTML(f,{crumbs:[['Métricas','board'],['Desempeño por reclutador','back'],[(PEOPLE.find(x=>x.id===s.who)||{}).name]],backLabel:'Volver lleva a la tabla con el mismo orden y columnas.',backFk:'bk'});
  else{
    const rows=s.data==='none'?[]:sorted(dataFor(s),s.sort);
    const main=stateHTML(f,{skeleton:skel1(f)})||(m?cards1(f,rows):table1(f,rows));
    const n=s.data==='ok'?`<div class="rline" role="status" aria-live="polite"><span><b>${rows.length}</b> personas con tramos en el periodo</span><span class="mut dot">·</span><span class="mut" id="ord-l">${sortLabel(s.sort)}</span></div>`:'';
    body=`${pageHead(f)}${toolbar1(f)}${chipsHTML(f)}${procNote(s)}${n}${main}<p class="hp" style="max-width:900px">Ordenar acomoda las filas; no asigna posiciones. «${NOS}» significa que no hubo muestra en el periodo, no un cero, y esas filas van al final. Placements: dir. = crédito directo, part. = participación, comp. = compartido.</p>`;
  }
  return shell(f,{body,overlay:s.screen==='page'?layerOverlay(f):'',toast:toastHTML(s),dim:!!layerOverlay(f)&&s.screen==='page'});
};
AB.act=(f,a,t)=>{
  const s=f.s;
  if(a==='gotable'){s.screen='page';f.focus='crumb-board';return true}
  if(a==='board'){s.screen='board';f.focus='ver-tabla';return true}
  return false;
};
