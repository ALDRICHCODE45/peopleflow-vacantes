<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacantes guardadas · Postúlate primero · PeopleFlow</title>
<style>
/* base:start — tokens from design/system.md (frontend/src/app/globals.css); shell from candidate-dashboard-modern/04 */
:root{
  --background:#F7F5FB;--foreground:#1A1626;--card:#FFFFFF;--card-foreground:#1A1626;--popover:#FFFFFF;
  --primary:oklch(0.491 0.27 292.581);--primary-foreground:oklch(0.969 0.016 293.756);
  --secondary:#F1EEF7;--muted:#F1EEF7;--accent:#F1EEF7;--muted-foreground:#6B6480;
  --border:#E4DFF0;--input:#E4DFF0;--destructive:oklch(0.577 0.245 27.325);--ring:oklch(0.708 0 0);
  --brand-decorative-strong:oklch(0.54 0.15 292.581);
  --status-info:oklch(0.45 0.16 250);--status-review:oklch(0.47 0.12 70);
  --status-success:oklch(0.46 0.13 152);--status-danger:oklch(0.45 0.2 25);
  --sidebar:oklch(0.985 0 0);--sidebar-foreground:oklch(0.145 0 0);--sidebar-accent:oklch(0.97 0 0);
  --sidebar-accent-foreground:oklch(0.205 0 0);--sidebar-border:oklch(0.922 0 0);
  --pf-glow-alpha:0.12;
  --radius:0.625rem;
  --primary-text:var(--primary);
  --pf-tint-base:var(--card);
  --pf-tone-late:color-mix(in oklab,var(--primary) 45%,var(--pf-tint-base));
  --pf-tone-none:var(--border);
  --st-sent:var(--status-info);
  --st-proc:var(--primary);
  --st-closed:color-mix(in oklab,var(--muted-foreground) 35%,var(--card));
  --chart-accent:var(--primary);
  --font-sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
.dark{
  --background:#0C0912;--foreground:#F6F2FF;--card:#15121F;--card-foreground:#F6F2FF;--popover:#1A1626;
  --primary:oklch(0.432 0.232 292.759);--secondary:#171226;--muted:#171226;--accent:#171226;
  --muted-foreground:#A79FBF;--border:#262233;--input:#262233;--destructive:oklch(0.704 0.191 22.216);--ring:oklch(0.556 0 0);
  --brand-decorative-strong:oklch(0.70 0.14 292.759);
  --status-info:oklch(0.78 0.12 245);--status-review:oklch(0.82 0.12 78);
  --status-success:oklch(0.78 0.14 155);--status-danger:oklch(0.75 0.15 22);
  --sidebar:oklch(0.205 0 0);--sidebar-foreground:oklch(0.985 0 0);--sidebar-accent:oklch(0.269 0 0);
  --sidebar-accent-foreground:oklch(0.985 0 0);--sidebar-border:oklch(1 0 0 / 10%);
  --pf-glow-alpha:0.22;
  --primary-text:var(--brand-decorative-strong);
  --pf-tint-base:color-mix(in oklab,var(--foreground) 40%,var(--card));
  --pf-tone-late:color-mix(in oklab,var(--brand-decorative-strong) 70%,var(--card));
  --pf-tone-none:color-mix(in oklab,var(--muted-foreground) 28%,var(--card));
  --st-proc:var(--brand-decorative-strong);
  --st-closed:color-mix(in oklab,var(--muted-foreground) 45%,var(--card));
  --chart-accent:var(--brand-decorative-strong);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--foreground);background:var(--sidebar);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--brand-decorative-strong);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:16px;top:-48px;z-index:60;background:var(--card);padding:10px 14px;border-radius:8px}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted-foreground)}

/* artboard-only design controls */
.design-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px dashed color-mix(in srgb,var(--brand-decorative-strong) 50%,transparent);background:var(--background)}
.design-bar>small{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin-right:4px}
.design-ctl{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1.5px dashed var(--brand-decorative-strong);border-radius:var(--radius);
  background:var(--card);color:var(--brand-decorative-strong);font-size:12px;font-weight:600}
.design-ctl[aria-pressed="true"]{border-style:solid;background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.design-ctl[aria-pressed="true"]::before{content:"✓"}

/* candidate shell */
.frame{container:frame / inline-size;position:relative;background:var(--sidebar)}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - 57px)}
.app.collapsed{grid-template-columns:64px minmax(0,1fr)}
.side{position:sticky;top:0;align-self:start;height:calc(100vh - 57px);min-height:640px;display:flex;flex-direction:column;gap:8px;padding:8px;color:var(--sidebar-foreground);background:var(--sidebar)}
.brand-row{display:flex;align-items:center;gap:10px;height:48px;padding:6px;border-radius:12px}
.brand-mark{width:32px;height:32px;border-radius:999px;background:var(--primary);display:grid;place-items:center;flex:none}
.wordmark{font-size:18px;font-weight:700;letter-spacing:-.02em}
.wordmark span{color:var(--primary-text)}
.side-group{display:flex;flex-direction:column;gap:2px;padding:8px}
.side-label{height:32px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--sidebar-foreground) 70%,transparent)}
.side a.nav{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:12px;font-size:14px;white-space:nowrap;overflow:hidden}
.side a.nav:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.side a.nav[aria-current="page"]{background:var(--sidebar-accent);font-weight:500}
.side .count{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;min-height:48px}
.side-user:hover{background:var(--sidebar-accent)}
.avatar{width:32px;height:32px;border-radius:10px;background:var(--secondary);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--foreground);flex:none}
.side-user b{display:block;font-weight:500;font-size:14px;line-height:18px}
.side-user div span{display:block;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.app.collapsed .side .lbl,.app.collapsed .side-label,.app.collapsed .wordmark,.app.collapsed .side-user>div,.app.collapsed .side .count{display:none}
.app.collapsed .side a.nav{justify-content:center;padding:0;width:40px;margin:0 auto}
.app.collapsed .side-group{padding:4px 0}
.inset{min-width:0;margin:12px 12px 12px 0;background:var(--background);border-radius:calc(var(--radius)*2.2);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 15%,transparent),0 4px 6px -1px color-mix(in srgb,var(--foreground) 8%,transparent),0 2px 4px -2px color-mix(in srgb,var(--foreground) 6%,transparent);
  display:flex;flex-direction:column;overflow-x:clip}
.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-bottom:1px solid var(--border);flex:none}
.top h1{font-size:16px;line-height:24px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{width:1px;height:16px;background:var(--border);margin:0 8px}
.ghost-ic{width:40px;height:40px;margin:-4px;border:0;border-radius:var(--radius);background:transparent;display:grid;place-items:center;color:var(--foreground)}
.ghost-ic:hover{background:var(--muted)}
.top .end{margin-left:auto;display:flex;align-items:center;gap:8px}
main{padding:24px;min-width:0}
.page{max-width:1536px;margin:0 auto;display:flex;flex-direction:column;gap:32px;min-width:0}
.scrim{display:none}

/* shared parts */
.card{position:relative;background:var(--card);border-radius:calc(var(--radius)*1.4);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0;
  box-shadow:0 2px 3px color-mix(in srgb,var(--foreground) 4%,transparent),0 0 0 1px color-mix(in srgb,var(--border) 50%,transparent)}
.cap{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--radius);font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,var(--foreground))}
.btn-outline{background:var(--card);border-color:var(--border)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{color:var(--muted-foreground);padding:0 12px}
.btn-ghost:hover{background:var(--muted);color:var(--foreground)}
.link{color:var(--primary-text);font-weight:500;border-radius:4px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.help{width:40px;height:40px;border:0;background:transparent;border-radius:var(--radius);display:inline-grid;place-items:center;color:var(--muted-foreground)}
.help:hover,.help[aria-expanded="true"]{background:var(--muted);color:var(--foreground)}
/* badge (components/ui/badge.tsx) */
.badge{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:calc(var(--radius)*.8);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.nodot::before{display:none}
.b-sent{--t:var(--status-info);color:var(--t);border-color:color-mix(in oklch,var(--t) 40%,transparent);background:color-mix(in oklch,var(--t) 10%,transparent)}
.b-proc{color:var(--foreground);border-color:color-mix(in oklch,var(--primary) 40%,transparent);background:color-mix(in oklch,var(--primary) 12%,transparent)}
.b-proc::before{background:var(--st-proc)}
.b-closed{color:var(--muted-foreground);background:var(--muted);border-color:var(--border)}
/* company logo tile (PublicCompanyAvatar: initials fallback when there is no logo_url) */
.logo{--t:var(--primary);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:600;letter-spacing:.01em;
  color:var(--t);background:color-mix(in oklab,var(--t) 11%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--t) 22%,transparent)}
.logo.t0{--t:var(--primary-text)}.logo.t1{--t:var(--status-info)}.logo.t2{--t:var(--status-success)}.logo.t3{--t:var(--status-review)}.logo.t4{--t:var(--brand-decorative-strong)}
.logo.sm{width:36px;height:36px;border-radius:10px;font-size:12px}
.logo.lg{width:56px;height:56px;border-radius:16px;font-size:17px}
.logo.off{--t:var(--muted-foreground);filter:grayscale(1)}
/* chips: salary, location, modality */
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border-radius:999px;background:var(--muted);color:var(--foreground);font-size:12px;line-height:16px;font-weight:500;max-width:100%;min-width:0}
.chip>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg.i{width:14px;height:14px;color:var(--muted-foreground)}
.chip.money{background:color-mix(in oklab,var(--primary) 9%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--primary) 18%,transparent)}
.chip.money svg.i{color:var(--primary-text)}
.chip.money b{font-weight:600;font-variant-numeric:tabular-nums}
.chip.money small{font-size:11px;color:var(--muted-foreground);font-weight:500}
.chip.none{background:transparent;box-shadow:inset 0 0 0 1px var(--border);color:var(--muted-foreground)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--primary-text)}
.eyebrow .pip{width:6px;height:6px;border-radius:99px;background:var(--chart-accent)}
/* page header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.head h2{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em}
.head h2:focus{outline:none}
.sum{position:relative;margin-top:4px;color:var(--muted-foreground);min-height:20px}
.sum b{color:var(--foreground);font-weight:600;font-variant-numeric:tabular-nums}
/* segmented control */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,auto);gap:2px;padding:3px;border-radius:calc(var(--radius)*1.2);background:var(--muted);box-shadow:inset 0 0 0 1px var(--border);max-width:100%}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:var(--radius);background:transparent;font-weight:500;color:var(--muted-foreground);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.seg button:hover{color:var(--foreground)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px color-mix(in srgb,var(--foreground) 8%,transparent),0 0 0 1px var(--border)}
.seg .n{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
/* collapsible group */
.card.fold{padding:0;gap:0}
.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 20px;cursor:pointer;border-radius:inherit;font-weight:600}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .chev{margin-left:auto;color:var(--muted-foreground);transition:transform .15s ease-out}
.fold[open]>summary .chev{transform:rotate(90deg)}
.fold>summary:hover{background:color-mix(in srgb,var(--muted) 60%,transparent)}
.fold-body{padding:4px 20px 16px;display:flex;flex-direction:column}
.fold-body>li+li{border-top:1px solid var(--border)}
/* dark hero tile (.pf-kpi-hero) */
.hero{background:var(--foreground);color:var(--background);padding:28px;gap:20px;overflow:hidden;isolation:isolate;
  --hero-accent:oklch(0.70 0.14 292.759);--hero-muted:color-mix(in oklab,var(--background) 64%,var(--foreground));
  --st-sent:oklch(0.78 0.12 245);--st-proc:var(--hero-accent);--st-closed:color-mix(in oklab,var(--background) 32%,var(--foreground));--chart-accent:var(--hero-accent);
  box-shadow:0 12px 32px -12px color-mix(in srgb,var(--primary) 45%,transparent)}
.dark .hero{--foreground:color-mix(in oklab,var(--primary) 30%,var(--card));--background:var(--card-foreground);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 40%,transparent)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 70% at 100% 0%,color-mix(in oklab,var(--hero-accent) 34%,transparent),transparent 70%),radial-gradient(50% 60% at 0% 100%,color-mix(in oklab,var(--hero-accent) 14%,transparent),transparent 70%)}
.hero .hl{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--hero-muted);font-weight:500}
.hero .logo{--t:var(--hero-accent);background:color-mix(in oklab,var(--background) 10%,transparent);color:var(--background);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--background) 18%,transparent)}
.hero .btn-outline{background:transparent;color:var(--background);border-color:color-mix(in oklab,var(--background) 26%,transparent)}
.hero .btn-outline:hover{background:color-mix(in oklab,var(--background) 10%,transparent)}
.hero .btn-ghost{color:var(--hero-muted)}
.hero .btn-ghost:hover{background:color-mix(in oklab,var(--background) 10%,transparent);color:var(--background)}
.hero .btn-light{background:var(--background);color:var(--foreground)}
.hero .btn-light:hover{background:color-mix(in oklab,var(--background) 88%,var(--hero-accent))}
.hero :focus-visible{outline-color:var(--hero-accent)}
/* tiles (bento) */
.tile{gap:10px}
.tile .foot{margin-top:auto}
.tile .tl{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted-foreground)}
.tile .tl svg{color:var(--primary-text)}
.tile .val{font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.tile .val small{font-size:14px;line-height:20px;font-weight:500;letter-spacing:0;color:var(--muted-foreground)}
.tile .ctx{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.tile .ctx a,.tile .foot a{color:var(--primary-text);font-weight:500}
.tile .ctx a:hover,.tile .foot a:hover{text-decoration:underline;text-underline-offset:3px}
/* status keys (words + counts below 5 records, segmented bar from 5) */
.stbar{display:flex;gap:3px;height:8px;border-radius:999px;overflow:hidden}
.stbar i{display:block;height:100%;min-width:6px}
.stkeys{display:flex;flex-wrap:wrap;gap:8px 20px}
.stkeys li{display:inline-flex;align-items:center;gap:8px;color:var(--muted-foreground)}
.stkeys li i{width:8px;height:8px;border-radius:99px;flex:none}
.stkeys b{color:var(--foreground);font-weight:600;font-variant-numeric:tabular-nums}
.hero .stkeys li{color:var(--hero-muted)}
.hero .stkeys b{color:var(--background)}
.k-pend{background:var(--chart-accent)}.k-app{background:var(--st-sent)}.k-off{background:var(--st-closed)}
/* empty state: a light tinted card, the dashboard «Siguiente paso» glow, a fan of mini cards */
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);align-items:center;gap:32px;padding:40px 48px;overflow:hidden;isolation:isolate;
  background:color-mix(in oklab,var(--primary) 5%,var(--card));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 14%,var(--border)),0 10px 24px -18px color-mix(in srgb,var(--primary) 55%,transparent)}
.empty::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 120% at 100% 0%,color-mix(in oklab,var(--chart-accent) 16%,transparent),transparent 72%),radial-gradient(30% 100% at 0% 100%,color-mix(in oklab,var(--chart-accent) 6%,transparent),transparent 70%)}
.empty-copy{display:flex;flex-direction:column;gap:12px;max-width:520px}
.empty-copy h3{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.empty-copy p.d{color:var(--muted-foreground);font-size:15px;line-height:24px}
.empty-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.empty-art{position:relative;height:220px;min-width:0}
.mini{position:absolute;left:50%;top:50%;width:220px;padding:14px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:10px;
  box-shadow:0 10px 24px -10px color-mix(in srgb,var(--foreground) 22%,transparent),0 0 0 1px var(--border)}
.mini .r{display:flex;align-items:center;gap:10px}
.mini .l{width:32px;height:32px;border-radius:9px;background:color-mix(in oklab,var(--primary) 12%,var(--card));flex:none}
.mini .ln{height:8px;border-radius:99px;background:var(--muted)}
.mini .bm{margin-left:auto;color:var(--primary-text)}
.mini .pill{height:18px;width:88px;border-radius:99px;background:color-mix(in oklab,var(--primary) 12%,var(--card))}
.mini.m1{transform:translate(-90%,-62%) rotate(-8deg);opacity:.75}
.mini.m2{transform:translate(-12%,-38%) rotate(7deg);opacity:.85}
.mini.m3{transform:translate(-50%,-50%);z-index:2}
/* undo toast */
.toast{position:fixed;left:50%;bottom:24px;z-index:70;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);width:max-content;
  padding:6px 6px 6px 16px;border-radius:calc(var(--radius)*1.4);background:var(--foreground);color:var(--background);
  box-shadow:0 12px 32px -8px color-mix(in srgb,#000 40%,transparent)}
.toast p{min-width:0;font-weight:500}
.toast button{min-height:40px;padding:0 12px;border:0;border-radius:var(--radius);background:transparent;color:oklch(0.70 0.14 292.759);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.toast button:hover{background:color-mix(in oklab,var(--background) 12%,transparent)}
.toast .x{color:color-mix(in oklab,var(--background) 64%,var(--foreground));width:40px;padding:0;justify-content:center}
.toast :focus-visible{outline-color:oklch(0.70 0.14 292.759)}
/* popover */
.pop{position:absolute;z-index:40;width:320px;background:var(--popover);border-radius:calc(var(--radius)*1.4);padding:20px;
  box-shadow:0 12px 32px color-mix(in srgb,var(--foreground) 14%,transparent),0 0 0 1px var(--border)}
.pop h3{font-size:15px;line-height:22px;font-weight:600}
.pop p{margin-top:8px;color:var(--muted-foreground)}

/* skeleton */
.sk{display:block;border-radius:6px;background:var(--muted)}
.dark .sk{background:var(--border)}
.hero .sk{background:color-mix(in oklab,var(--background) 14%,transparent)}
.sk-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.sk-layer .sk{position:absolute}
.loading [data-load]>*:not(.sk-layer){visibility:hidden}
/* while loading: no real counts, a fixed 3-slot list */
.loading [data-hide-loading]{visibility:hidden}
.loading [data-cap-loading]>[data-item]:nth-child(n+4),.loading [data-cap-loading]>[data-explore]{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .sk{background:linear-gradient(90deg,var(--muted) 0%,color-mix(in srgb,var(--border) 70%,var(--muted)) 50%,var(--muted) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
  .dark .sk{background:linear-gradient(90deg,var(--border) 0%,color-mix(in srgb,var(--muted-foreground) 25%,var(--border)) 50%,var(--border) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
  .hero .sk{background:linear-gradient(90deg,color-mix(in oklab,var(--background) 10%,transparent) 0%,color-mix(in oklab,var(--background) 20%,transparent) 50%,color-mix(in oklab,var(--background) 10%,transparent) 100%);background-size:200% 100%}
  @keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
  .btn,.side a.nav,.ghost-ic,.help,.link,.design-ctl,.seg button,.chip,.toast button{transition:background-color .12s ease,color .12s ease}
  /* entrance: once per mount, ease-out 200–400 ms, transform + opacity only, ≤ 40 ms stagger over ≤ 4 cards */
  .enter .rv{animation:rv .32s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d,0) * 40ms)}
  .enter .grow-x{animation:grow .36s cubic-bezier(.22,1,.36,1) both;transform-origin:left center;animation-delay:.08s}
  .toast.in{animation:toast .24s cubic-bezier(.22,1,.36,1) both}
  @keyframes rv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}

/* 390 px preview */
.m390{background:color-mix(in srgb,var(--muted-foreground) 14%,var(--background))}
.m390 .frame{width:390px;margin:32px auto 40px;border-radius:28px;overflow:hidden;
  box-shadow:0 0 0 1px var(--border),0 12px 32px color-mix(in srgb,var(--foreground) 14%,transparent)}
.m390 .app{min-height:auto}
@container frame (max-width:1100px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{display:none;position:absolute;z-index:45;top:0;left:0;bottom:0;height:auto;width:288px;max-width:85%;box-shadow:0 12px 32px color-mix(in srgb,#000 24%,transparent)}
  .app.open .side{display:flex}
  .app.open .scrim{display:block;position:absolute;inset:0;z-index:44;background:color-mix(in srgb,#0C0912 40%,transparent)}
  .inset{margin:0;border-radius:0;box-shadow:none}
  .empty{grid-template-columns:minmax(0,1fr);padding:32px}
  .empty-art{order:-1;height:180px}
}
@container frame (max-width:560px){

  .empty{padding:24px 20px;gap:20px}

  .empty-art{height:150px}
  .mini{width:170px;padding:12px}

@media (max-width:600px){

}

/* ---- 02 · Postúlate primero: ranked queue + dark preview (rows expand inline when narrow) ---- */
.head .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px;align-items:start}
.narrow .split{grid-template-columns:minmax(0,1fr)}
.narrow .preview{display:none}
.qcol{display:flex;flex-direction:column;gap:24px;min-width:0}
.queue{padding:20px 12px 8px;gap:4px}
.q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 12px 8px}
.q-head h3{font-size:18px;line-height:28px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.q-head{flex-wrap:wrap}
.q-head .cap{margin-top:2px}
.qi{position:relative}
.qi+.qi::before{content:"";position:absolute;left:12px;right:12px;top:0;border-top:1px solid var(--border)}
.qi.sel::before,.qi.sel+.qi::before{opacity:0}
.qrow{width:100%;display:grid;grid-template-columns:28px 36px minmax(0,1fr) auto 16px;align-items:center;gap:14px;min-height:76px;padding:12px;border:0;border-radius:12px;background:transparent;text-align:left;position:relative}
.qrow.ap{grid-template-columns:36px minmax(0,1fr) auto 16px;min-height:64px}
.qrow:hover{background:color-mix(in oklab,var(--muted) 70%,transparent)}
.qi.sel .qrow{background:color-mix(in oklab,var(--primary) 7%,var(--card))}
.qi.sel .qrow::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:99px;background:var(--primary)}
.rank{font-size:20px;line-height:24px;font-weight:600;color:color-mix(in oklab,var(--muted-foreground) 60%,var(--card));font-variant-numeric:tabular-nums;text-align:center}
.qi.sel .rank{color:var(--primary-text)}
.qmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.qt{font-size:15px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs{font-size:12px;line-height:16px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-width:0}
.why>span{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.why .r{background:color-mix(in oklab,var(--primary) 9%,var(--card));color:var(--primary-text)}
.why .n{background:var(--muted);color:var(--muted-foreground)}
.why .s{display:none;background:transparent;box-shadow:inset 0 0 0 1px var(--border);color:var(--foreground);font-variant-numeric:tabular-nums}
.why .badge{padding:0 8px}
.qsal{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.qsal b{font-size:15px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.qsal small{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.qrow .chev{color:var(--muted-foreground)}
.qi.sel .qrow .chev{color:var(--primary-text)}
@media (prefers-reduced-motion:no-preference){.qrow .chev{transition:transform .15s ease-out}.qrow{transition:background-color .12s ease}}
.narrow .qi.sel .qrow .chev{transform:rotate(90deg)}
.qdetail{display:none}
.narrow .qi.sel .qdetail{display:flex;flex-direction:column;gap:14px;padding:4px 12px 16px 12px}
.loading .qdetail{display:none!important}
.qd-sal b{display:block;font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.qd-sal small{font-size:12px;color:var(--muted-foreground)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.facts dt{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.facts dt svg.i{width:14px;height:14px}
.facts dd{margin-top:2px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.qd-act{display:flex;flex-direction:column;gap:8px}
.qd-act .row{display:flex;gap:8px}
.qd-act .row>*{flex:1 1 0}
.qd-act .btn{min-height:44px}
/* dark preview: the selected vacancy in the dashboard hero language */
.preview{position:sticky;top:16px;gap:22px;padding:28px}
.pv-rank{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--hero-accent)}
.pv-rank::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
.pv-id{display:flex;gap:14px;align-items:center;min-width:0}
.pv-id h3{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.pv-id h3:focus{outline:none}
.pv-co{color:var(--hero-muted)}
.pv-status{display:flex;align-items:center;gap:10px;color:var(--hero-muted);font-size:12px}
.hero .b-sent{--t:oklch(0.78 0.12 245)}
.hero .b-proc{color:var(--background);border-color:color-mix(in oklab,var(--hero-accent) 50%,transparent);background:color-mix(in oklab,var(--hero-accent) 22%,transparent)}
.pv-sal{display:flex;flex-direction:column;gap:2px}
.pv-sal>span{font-size:12px;line-height:16px;color:var(--hero-muted)}
.pv-sal b{font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pv-sal small{font-size:13px;color:var(--hero-muted)}
.hero .facts dt{color:var(--hero-muted)}
.hero .facts dt svg.i{color:var(--hero-accent)}
.pv-why{display:flex;flex-wrap:wrap;gap:6px}
.pv-why li{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:color-mix(in oklab,var(--background) 10%,transparent);color:var(--background)}
.pv-why li.r{background:color-mix(in oklab,var(--hero-accent) 26%,transparent)}
.pv-act{display:flex;flex-direction:column;gap:8px}
.pv-act .btn{min-height:44px}
.pv-act .row{display:flex;gap:8px}
.pv-act .row>*{flex:1 1 0}
.sec-empty{align-items:center;text-align:center;padding:28px 16px;gap:8px;box-shadow:none}
.sec-empty .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in oklab,var(--primary) 10%,var(--card));color:var(--primary-text)}
.sec-empty h4{font-size:16px;line-height:24px;font-weight:600}
.sec-empty p{color:var(--muted-foreground);max-width:420px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0}
.crow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted-foreground)}
.crow small{display:block;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.pop .order{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pop .order li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;color:var(--muted-foreground)}
.pop .order b{color:var(--foreground);font-weight:600}
@container frame (max-width:560px){
  .head .tools{width:100%}
  .head .seg{flex:1;grid-auto-columns:minmax(0,1fr)}
  .seg button{padding:0 8px;font-size:13px}
  .queue{padding:16px 6px 6px}
  .q-head{padding:0 10px 6px}
  .narrow .qrow{grid-template-columns:20px 36px minmax(0,1fr) 16px;gap:10px;padding:12px 10px}
  .narrow .qrow.ap{grid-template-columns:36px minmax(0,1fr) 16px}
  .narrow .qsal{display:none}
  .narrow .qt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .narrow .qi.sel{background:color-mix(in oklab,var(--primary) 6%,var(--card));border-radius:12px}
  .narrow .qi.sel .qrow{background:transparent}
  .narrow .q-head .btn-ghost{display:none}
  .narrow .why .s{display:inline-flex}
  .narrow .qi.sel .qdetail{padding:4px 10px 14px}
  .qi+.qi::before{left:10px;right:10px}
}
/* @dir-css-end */

    <span class="sep" aria-hidden="true"></span>
    <h1>Vacantes guardadas</h1>
    <div class="end"><button class="ghost-ic" id="theme" type="button" aria-label="Cambiar a tema oscuro"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg></button></div>
  </header>
  <main id="contenido" tabindex="-1">
<div class="page"></div>
  </main>
</div>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><p id="toast-t"></p><button type="button" id="toast-undo"><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg>Deshacer</button><button type="button" class="x" id="toast-x" aria-label="Cerrar aviso"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
<div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="pop-t" tabindex="-1" hidden><h3 id="pop-t"></h3><div id="pop-b"></div></div>
<script>
/* ---------- demo data: Valeria Mendoza (demo tenant Grupo Altavista), «hoy» = miércoles 18 nov 2026 ---------- */
/* Only fields the saved-jobs API returns: job snapshot (title, company, location_label, work_mode, compensation,
   published_at), saved_at, availability + closed_at, application {id, applied_at}. Application status comes from
   the candidate applications list (joined by application id). */
const NOW=new Date(2026,10,18,13,0);
const D=(m,d,h=10,mi=0)=>new Date(2026,m-1,d,h,mi);
const CO={alt:{n:'Grupo Altavista',ini:'GA',tone:0},pac:{n:'Logística Pacífico',ini:'LP',tone:1},arr:{n:'Fintech Arrecife',ini:'FA',tone:2},
  baj:{n:'Laboratorios del Bajío',ini:'LB',tone:3},cum:{n:'Manufacturas Cumbre',ini:'MC',tone:4},pn:{n:'Inmobiliaria Puerta Norte',ini:'PN',tone:1},sm:{n:'Constructora Sierra Madre',ini:'SM',tone:3}};
const BASE3=[
 {id:'v1',t:'Supervisor(a) de Almacén',co:'alt',loc:'Apodaca, Nuevo León',mode:'onsite',sal:{min:22000,max:26000,basis:'gross'},pub:D(11,12,9),saved:D(11,18,10,12),av:'open',app:null},
 {id:'v2',t:'Analista de Nómina',co:'alt',loc:'Cuauhtémoc, Ciudad de México',mode:'hybrid',sal:{min:17000,max:20000,basis:'net'},pub:D(11,16,9),saved:D(11,18,10,20),av:'open',app:null},
 {id:'v3',t:'Residente de Obra Civil',co:'alt',loc:'Querétaro, Querétaro',mode:'onsite',sal:{min:32000,max:38000,basis:'gross'},pub:D(11,10,9),saved:D(11,18,8,50),av:'open',app:{at:D(11,18,9,5),st:'submitted'}}];
/* «Con más guardadas»: 6 more from several fictional companies, one no longer available */
const MORE6=[
 {id:'v4',t:'Coordinador(a) de Logística',co:'pac',loc:'Manzanillo, Colima',mode:'onsite',sal:{min:28000,max:33000,basis:'gross'},pub:D(11,9,9),saved:D(11,14,18,40),av:'open',app:null},
 {id:'v5',t:'Analista de Datos Jr.',co:'arr',loc:'Ciudad de México',mode:'remote',sal:{min:24000,max:30000,basis:'gross'},pub:D(11,11,9),saved:D(11,13,21,5),av:'open',app:null},
 {id:'v6',t:'Ingeniero(a) de Calidad',co:'baj',loc:'León, Guanajuato',mode:'onsite',sal:null,pub:D(11,7,9),saved:D(11,12,8,15),av:'open',app:null},
 {id:'v7',t:'Jefe(a) de Turno de Producción',co:'cum',loc:'Ramos Arizpe, Coahuila',mode:'onsite',sal:{min:26000,max:30000,basis:'gross'},pub:D(11,2,9),saved:D(11,6,19,30),av:'open',app:{at:D(11,7,11,20),st:'in_process'}},
 {id:'v8',t:'Asistente de Recursos Humanos',co:'pn',loc:'Zapopan, Jalisco',mode:'hybrid',sal:{min:14000,max:16000,basis:'net'},pub:D(11,4,9),saved:D(11,5,12,0),av:'open',app:null},
 {id:'v9',t:'Planeador(a) de Mantenimiento',co:'sm',loc:'Monterrey, Nuevo León',mode:'onsite',sal:{min:30000,max:35000,basis:'gross'},pub:D(10,24,9),saved:D(11,1,17,45),av:'closed',closed:D(11,15,9),app:null}];
const MODE={onsite:'Presencial',hybrid:'Híbrido',remote:'Remoto'};
const MODE_IC={onsite:'i-building',hybrid:'i-hybrid',remote:'i-remote'};
const APP_ST={submitted:'Enviada',in_process:'En proceso',closed:'Cerrada'};
const APP_B={submitted:'b-sent',in_process:'b-proc',closed:'b-closed'};
const APP_STEP={submitted:1,in_process:2,closed:3};

const S={rich:false,empty:false,loading:false,m390:false};
const removed=new Set();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl=(n,one,many)=>`${n} ${n===1?one:many}`;
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const ddiff=(a,b)=>Math.round((day0(a)-day0(b))/864e5);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const hhmm=d=>`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
const dm=d=>`${d.getDate()} ${MES[d.getMonth()]}`;
/* relative day: «hoy», «ayer», «hace 3 días», «12 nov» */
function rel(d){const n=ddiff(NOW,d);if(n===0)return 'hoy';if(n===1)return 'ayer';if(n<7)return `hace ${n} días`;return `el ${dm(d)}`}
function relT(d){const n=ddiff(NOW,d);return n===0?`hoy, ${hhmm(d)}`:rel(d)}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const money=n=>'$'+n.toLocaleString('es-MX');
const kmoney=n=>'$'+Math.round(n/1000)+'k';
const salTxt=v=>v.sal?`${money(v.sal.min)} – ${money(v.sal.max)}`:'Salario no publicado';
const salShort=v=>v.sal?`${kmoney(v.sal.min)}–${kmoney(v.sal.max).slice(1)}`:'Sin salario';
const basis=v=>v.sal?(v.sal.basis==='gross'?'bruto':'neto'):'';
const company=v=>CO[v.co];
const icon=(id,cls='')=>`<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const logo=(v,cls='')=>`<span class="logo t${company(v).tone} ${cls}" aria-hidden="true">${company(v).ini}</span>`;
const shortLoc=v=>v.loc.replace(', Ciudad de México',', CDMX').replace('Nuevo León','NL');

function model(){
  const all=S.empty?[]:(S.rich?BASE3.concat(MORE6):BASE3);
  const items=all.filter(v=>!removed.has(v.id));
  const pending=items.filter(v=>v.av==='open'&&!v.app).sort((a,b)=>b.saved-a.saved);
  const applied=items.filter(v=>v.av==='open'&&v.app).sort((a,b)=>b.app.at-a.app.at);
  const closed=items.filter(v=>v.av==='closed');
  return {items,pending,applied,closed,total:items.length};
}
function summaryHTML(m){
  if(!m.total)return 'Guarda vacantes para compararlas y postularte cuando quieras.';
  const parts=[`<b>${pl(m.total,'guardada','guardadas')}</b>`,`<b>${m.pending.length}</b> por postularte`];
  parts.push(m.closed.length?`${m.closed.length} ya no ${m.closed.length===1?'está disponible':'están disponibles'}`:(m.total===1?'sigue abierta':'todas siguen abiertas'));
  return parts.join(' · ');
}
/* empty state: what belongs here and a first action (system.md «Empty states»), upbeat, not an error */
function emptyHTML(){
  const mini=(c)=>`<div class="mini ${c}"><div class="r"><span class="l"></span><span style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="ln" style="width:80%"></span><span class="ln" style="width:50%"></span></span><span class="bm">${icon('i-bookmark','fill')}</span></div><span class="pill"></span></div>`;
  return `<section class="card empty rv" aria-labelledby="empty-t" data-load>
    <div class="empty-copy" data-sk="text">
      <p class="eyebrow"><span class="pip" aria-hidden="true"></span>Tu lista para decidir</p>
      <h3 id="empty-t">Todavía no guardas vacantes</h3>
      <p class="d">Cuando una te llame la atención, toca el marcador y aparecerá aquí con su salario, ubicación y modalidad a la vista. Así comparas con calma y te postulas cuando quieras.</p>
      <div class="empty-act"><a class="btn btn-primary" href="#">Explorar vacantes${icon('i-arrow')}</a><a class="btn btn-outline" href="#">Ver mis postulaciones</a></div>
    </div>
    <div class="empty-art" aria-hidden="true" data-sk>${mini('m1')}${mini('m2')}${mini('m3')}</div>
  </section>`;
}

/* ---------- shell behaviour ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const app=$('#app'),trigger=$('#nav-trigger');
const narrow=()=>app.getBoundingClientRect().width<=1100;
trigger.addEventListener('click',()=>{
  if(narrow()){const o=app.classList.toggle('open');trigger.setAttribute('aria-expanded',String(o));if(o)$('#side a.nav[aria-current]').focus()}
  else{const c=app.classList.toggle('collapsed');trigger.setAttribute('aria-label',c?'Expandir barra lateral':'Contraer barra lateral')}});
$('#scrim').addEventListener('click',()=>{app.classList.remove('open');trigger.focus()});
const themeBtn=$('#theme');
themeBtn.addEventListener('click',()=>{const dark=document.documentElement.classList.toggle('dark');
  themeBtn.setAttribute('aria-label',dark?'Cambiar a tema claro':'Cambiar a tema oscuro');themeBtn.querySelector('use').setAttribute('href',dark?'#i-sun':'#i-moon')});
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#"]');if(a)e.preventDefault()});

/* popover: one open at a time; Escape / outside click close; focus returns to the trigger */
const pop=$('#pop');let popTrig=null;
function closePop(ret=true){if(!popTrig)return;pop.hidden=true;popTrig.setAttribute('aria-expanded','false');if(ret)popTrig.focus();popTrig=null}
function openPop(b,title,html){if(popTrig===b){closePop();return}closePop(false);
  $('#pop-t').textContent=title;$('#pop-b').innerHTML=html;pop.hidden=false;
  const r=b.getBoundingClientRect(),vw=document.documentElement.clientWidth,w=Math.min(320,vw-16);pop.style.width=w+'px';
  const fr=$('.frame').getBoundingClientRect();let x=(r.left+w>fr.right-8?r.right-w:r.left)+scrollX;x=Math.max(scrollX+Math.max(8,fr.left+8),Math.min(x,scrollX+vw-w-8));pop.style.left=x+'px';pop.style.top=(r.bottom+scrollY+8)+'px';
  b.setAttribute('aria-expanded','true');popTrig=b;pop.focus()}
document.addEventListener('click',e=>{if(popTrig&&!pop.contains(e.target)&&!e.target.closest('[data-pop]'))closePop(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});

/* ---------- Quitar + Deshacer (removeSavedJobAction / saveJobAction) ---------- */
const toast=$('#toast');let toastT=null,lastRemoved=null;
function showToast(text,undo){$('#toast-t').textContent=text;$('#toast-undo').hidden=!undo;toast.hidden=false;
  toast.classList.remove('in');void toast.offsetWidth;toast.classList.add('in');clearTimeout(toastT);toastT=setTimeout(hideToast,8000)}
function hideToast(){if(toast.contains(document.activeElement)){toastT=setTimeout(hideToast,3000);return}toast.hidden=true;lastRemoved=null}
const findItem=id=>BASE3.concat(MORE6).find(v=>v.id===id);
function removeItem(id){
  const v=findItem(id),order=$$('[data-item]').map(e=>e.dataset.item),i=order.indexOf(id),next=order[i+1]||order[i-1];
  removed.add(id);lastRemoved=id;if(window.onRemoved)onRemoved(id,next);render(false);
  const n=next&&document.querySelector(`[data-item="${next}"] [data-focus]`);(n||$('#page-h')).focus();
  showToast(`Quitaste «${v.t}» de tus guardadas`,true)}
function undoRemove(){if(!lastRemoved)return;const id=lastRemoved;removed.delete(id);lastRemoved=null;if(window.onRestored)onRestored(id);render(false);
  const n=document.querySelector(`[data-item="${id}"] [data-focus]`);if(n)n.focus();showToast('Volvió a tus guardadas',false)}
$('#toast-undo').addEventListener('click',undoRemove);
$('#toast-x').addEventListener('click',()=>{toast.hidden=true;lastRemoved=null;$('#page-h')?.focus()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){e.preventDefault();removeItem(b.dataset.remove)}});

/* ---------- loading: skeleton measured from the real layout, card by card ---------- */
function blk(layer,x,y,w,h,r){const s=document.createElement('span');s.className='sk';Object.assign(s.style,{left:x+'px',top:y+'px',width:Math.max(0,w)+'px',height:Math.max(0,h)+'px',borderRadius:(r||6)+'px'});layer.append(s)}
function skeletonize(card){const cr=card.getBoundingClientRect(),layer=document.createElement('div');layer.className='sk-layer';layer.setAttribute('aria-hidden','true');
  const rel=e=>{const r=e.getBoundingClientRect();return {x:r.left-cr.left,y:r.top-cr.top,w:r.width,h:r.height}};
  card.querySelectorAll('[data-sk]').forEach(el=>{if(!el.getClientRects().length)return;const b=rel(el),k=el.dataset.sk;
    if(k==='round'||k==='pill')blk(layer,b.x,b.y,b.w,b.h,999);
    else if(k==='rows')[...el.children].forEach(li=>{const r=rel(li),mid=r.y+r.h/2,x=r.x+12;blk(layer,x,mid-18,36,36,10);blk(layer,x+52,mid-14,Math.min(r.w*.5,300),12);blk(layer,x+52,mid+4,Math.min(r.w*.3,160),10);if(r.w>300)blk(layer,r.x+r.w-108,mid-10,84,20,8)});
    else if(k==='text'){const lines=Math.max(1,Math.round(b.h/22));for(let i=0;i<lines;i++)blk(layer,b.x,b.y+i*(b.h/lines)+3,Math.min(b.w,i===lines-1&&lines>1?b.w*.55:b.w*.85),Math.min(14,b.h/lines-6))}
    else blk(layer,b.x,b.y,b.w,b.h,8)});
  card.append(layer)}
function setLoading(on){$$('.sk-layer').forEach(l=>l.remove());document.body.classList.toggle('loading',on);
  const st=$('#load-status');if(st)st.textContent=on?'Cargando vacantes guardadas':'';
  $$('[data-load]').forEach(c=>{if(on){c.setAttribute('aria-busy','true');skeletonize(c)}else c.removeAttribute('aria-busy')})}

/* ---------- design toggles ---------- */
function enter(){const m=$('#contenido');m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');clearTimeout(enter.t);enter.t=setTimeout(()=>m.classList.remove('enter'),900)}
function render(animate){closePop(false);const m=model();$('#side-count').textContent=m.total||'';renderPage(m);if(window.afterRender)afterRender(m);if(animate)enter();if(S.loading)requestAnimationFrame(()=>setLoading(true))}
$$('.design-ctl').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.t;S[k]=!S[k];b.setAttribute('aria-pressed',String(S[k]));
  if(k==='m390'){document.body.classList.toggle('m390',S.m390);app.classList.remove('open');render(false);return}
  if(k==='loading'){if(S.loading)setLoading(true);else{setLoading(false);render(true)}return}
  /* «Con más guardadas» and «Sin guardadas» are exclusive; both reset removals */
  const other=k==='rich'?'empty':'rich';if(S[k]&&S[other]){S[other]=false;$(`.design-ctl[data-t="${other}"]`).setAttribute('aria-pressed','false')}
  removed.clear();lastRemoved=null;toast.hidden=true;if(window.onDataset)onDataset();
  render(true)}));
new ResizeObserver(()=>{if(window.afterRender)afterRender(model());if(S.loading)setLoading(true)}).observe(app);

/* @dir-js-start */
/* ---------- 02 · Postúlate primero ---------- */
let sort='sug',sel,wasNarrow=null;
window.onDataset=()=>{sort='sug';sel=undefined};
window.onRemoved=(id,next)=>{if(sel===id)sel=next||undefined};
window.onRestored=id=>{sel=id};
const isNarrow=()=>$('.page').getBoundingClientRect().width<860;
const SORTS={sug:['Sugerido','Las que llevan más días publicadas, primero'],sal:['Salario','Salario máximo publicado, de mayor a menor'],saved:['Recientes','Las que guardaste al último, primero']};
function ordered(m){const p=m.pending.slice();
  if(sort==='sug')p.sort((a,b)=>a.pub-b.pub);
  else if(sort==='sal')p.sort((a,b)=>(b.sal?b.sal.max:-1)-(a.sal?a.sal.max:-1));
  else p.sort((a,b)=>b.saved-a.saved);
  return p}
function pubReason(v){const n=ddiff(NOW,v.pub);return n===0?'Publicada hoy':`Lleva ${pl(n,'día','días')} publicada`}
/* reasons are facts about the vacancy, never a judgement the data cannot support */
function reasons(v,p){const r=[];
  if(sort==='sug')r.push(['r',pubReason(v)]);
  else if(sort==='sal')r.push(v.sal?['r',`Hasta ${money(v.sal.max)} ${basis(v)}`]:['n','Salario no publicado']);
  else r.push(['r',`Guardada ${relT(v.saved)}`]);
  if(p.length>=2&&p.filter(x=>x.mode===v.mode).length===1)r.push(['n',{onsite:'La única presencial',hybrid:'La única híbrida',remote:'La única remota'}[v.mode]]);
  if(sort!=='sal'&&!v.sal)r.push(['n','Salario no publicado']);
  return r.slice(0,2)}
const facts=v=>`<dl class="facts">${[['i-pin','Ubicación',v.loc],[MODE_IC[v.mode],'Modalidad',MODE[v.mode]],['i-cal','Publicada',cap(rel(v.pub))],['i-bookmark','Guardada',cap(relT(v.saved))]]
  .map(f=>`<div><dt>${icon(f[0])}${f[1]}</dt><dd>${esc(f[2])}</dd></div>`).join('')}</dl>`;
function row(v,i,p){
  const a=v.app,s=sel===v.id,narrow=wasNarrow;
  const state=narrow?`aria-expanded="${s}"`:`aria-current="${s}"`;
  const why=a?`<span class="badge ${APP_B[a.st]} s">${APP_ST[a.st]}</span>`:reasons(v,p).map(r=>`<span class="${r[0]}">${esc(r[1])}</span>`).join('')+(v.sal?`<span class="s">${salShort(v)} ${basis(v)}</span>`:'');
  const right=a?`<span class="qsal"><span class="badge ${APP_B[a.st]}">${APP_ST[a.st]}</span></span>`
    :`<span class="qsal"><b>${v.sal?salShort(v):'—'}</b><small>${v.sal?basis(v):'sin salario'}</small></span>`;
  const detail=`<div class="qdetail" id="qd-${v.id}">
      ${a?`<p class="cap">Te postulaste ${relT(a.at)}</p>`:`<div class="qd-sal"><b>${salTxt(v)}</b><small>${v.sal?`MXN al mes · ${basis(v)}`:'La empresa no lo publicó'}</small></div>`}
      ${facts(v)}
      <div class="qd-act">${a?`<a class="btn btn-primary" href="#">Ver postulación</a>`:`<a class="btn btn-primary" href="#">Postularme${icon('i-arrow')}</a>`}
        <div class="row"><a class="btn btn-outline" href="#">Ver vacante</a><button class="btn btn-ghost" type="button" data-remove="${v.id}">${icon('i-bookmark','fill')}Quitar</button></div></div>
    </div>`;
  return `<li class="qi${s?' sel':''}" data-item="${v.id}">
    <button class="qrow${a?' ap':''}" type="button" data-select="${v.id}" data-focus aria-controls="${narrow?'qd-'+v.id:'preview'}" ${state}>
      ${a?'':`<span class="rank" aria-label="Número ${i+1}">${i+1}</span>`}${logo(v,'sm')}
      <span class="qmain"><span class="qt">${esc(v.t)}</span><span class="qs">${esc(company(v).n)} · ${esc(shortLoc(v))} · ${MODE[v.mode]}${a?` · Te postulaste ${relT(a.at)}`:''}</span><span class="why">${why}</span></span>
      ${right}${icon('i-chev','chev')}
    </button>${narrow?detail:''}
  </li>`}
function previewHTML(v,p){
  const a=v.app,rank=p.indexOf(v)+1;
  return `<aside class="card hero preview rv" style="--d:1" id="preview" aria-labelledby="pv-t" data-load>
    <p class="pv-rank" data-sk="text">${a?'Ya te postulaste':`Número ${rank} para postularte`}</p>
    <div class="pv-id" data-sk>${logo(v,'lg')}<div style="min-width:0"><p class="pv-co">${esc(company(v).n)}</p><h3 id="pv-t" tabindex="-1">${esc(v.t)}</h3></div></div>
    ${a?`<p class="pv-status" data-sk><span class="badge ${APP_B[a.st]}">${APP_ST[a.st]}</span>Te postulaste ${relT(a.at)}</p>`:''}
    <div class="pv-sal" data-sk><span>Salario mensual</span><b>${salTxt(v)}</b><small>${v.sal?`MXN · ${basis(v)}`:'La empresa no lo publicó'}</small></div>
    <div data-sk>${facts(v)}</div>
    ${a?'':`<ul class="pv-why" aria-label="Por qué está en este lugar" data-sk>${reasons(v,p).map(r=>`<li class="${r[0]}">${esc(r[1])}</li>`).join('')}</ul>`}
    <div class="pv-act" data-sk>${a?`<a class="btn btn-light" href="#">Ver postulación${icon('i-arrow')}</a>`:`<a class="btn btn-light" href="#">Postularme${icon('i-arrow')}</a>`}
      <div class="row"><a class="btn btn-outline" href="#">Ver vacante</a><button class="btn btn-ghost" type="button" data-remove="${v.id}">${icon('i-bookmark','fill')}Quitar</button></div></div>
  </aside>`}
function renderPage(m){
  wasNarrow=isNarrow();$('.page').classList.toggle('narrow',wasNarrow);
  const p=ordered(m),selectable=p.concat(m.applied);
  if(sel===undefined||(sel!==null&&!selectable.find(v=>v.id===sel))||(sel===null&&!wasNarrow))sel=selectable[0]?selectable[0].id:null;
  const segB=k=>`<button type="button" data-sort="${k}" aria-pressed="${sort===k}">${SORTS[k][0]}</button>`;
  const head=`<header class="head">
      <div><h2 id="page-h" tabindex="-1">Vacantes guardadas</h2><p class="sum" data-load><span data-sk="text">${summaryHTML(m)}</span></p></div>
      ${m.pending.length>1?`<div class="tools" data-hide-loading><div class="seg" role="group" aria-label="Ordenar por postularte">${segB('sug')}${segB('sal')}${segB('saved')}</div>
        <button class="help" type="button" data-pop="order" aria-expanded="false" aria-haspopup="dialog" aria-label="¿Cómo se ordena?">${icon('i-info')}</button></div>`:''}
    </header><span class="sr" role="status" id="load-status"></span>`;
  if(!m.total){$('.page').innerHTML=head+emptyHTML();return}
  const cur=selectable.find(v=>v.id===sel);
  $('.page').innerHTML=head+`
    <div class="split">
      <div class="qcol">
        <section class="card queue rv" style="--d:0" aria-labelledby="q-t" data-load>
          <div class="q-head"><div><h3 id="q-t" data-sk="text">Postúlate primero <span class="badge nodot b-closed">${p.length}</span></h3><p class="cap">${p.length>1?SORTS[sort][1]:'Sigue abierta y aún no te postulas'}</p></div></div>
          ${p.length?`<ol class="qlist" data-sk="rows" data-cap-loading aria-label="Por postularte, ${SORTS[sort][1].toLowerCase()}">${p.map((v,i)=>row(v,i,p)).join('')}</ol>`
            :`<div class="card sec-empty"><span class="ic">${icon('i-check')}</span><h4>Ya te postulaste a todas tus guardadas</h4><p>Sigue su avance en Postulaciones o guarda nuevas vacantes.</p><a class="btn btn-primary" href="#" style="margin-top:8px">Explorar vacantes</a></div>`}
        </section>
        ${m.applied.length?`<section class="card queue rv" style="--d:2" aria-labelledby="ap-t" data-load>
          <div class="q-head"><div><h3 id="ap-t" data-sk="text">Ya te postulaste <span class="badge nodot b-closed">${m.applied.length}</span></h3></div><a class="btn btn-ghost" href="#" style="margin:-6px -4px 0 0">Ver postulaciones</a></div>
          <ul class="qlist" data-sk="rows" aria-label="Ya te postulaste">${m.applied.map((v,i)=>row(v,i,p)).join('')}</ul>
        </section>`:''}
        ${m.closed.length?`<details class="card fold" id="cerradas" data-hide-loading><summary>Ya no disponibles <span class="badge nodot b-closed">${m.closed.length}</span>${icon('i-chev','chev')}</summary>
          <ul class="fold-body" aria-label="Ya no disponibles">${m.closed.map(v=>`<li class="crow" data-item="${v.id}">${logo(v,'sm off')}<div style="min-width:0"><b>${esc(v.t)}</b><small>${esc(company(v).n)} · Cerró ${rel(v.closed)}</small></div>
            <button class="btn btn-ghost" type="button" data-remove="${v.id}" data-focus aria-label="Quitar ${esc(v.t)} de guardadas">Quitar</button></li>`).join('')}</ul></details>`:''}
      </div>
      ${cur&&!wasNarrow?previewHTML(cur,p):''}
    </div>`;
  $$('[data-select]').forEach(b=>{
    b.addEventListener('click',()=>{const id=b.dataset.select;sel=wasNarrow&&sel===id?null:id;render(false);$(`[data-select="${id}"]`).focus()});
    b.addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;e.preventDefault();const all=$$('[data-select]'),i=all.indexOf(b),n=all[i+(e.key==='ArrowDown'?1:-1)];if(n)n.focus()})});
  $$('[data-sort]').forEach(b=>b.addEventListener('click',()=>{sort=b.dataset.sort;render(false);$(`[data-sort="${sort}"]`).focus()}));
  const hb=$('[data-pop="order"]');if(hb)hb.addEventListener('click',e=>openPop(e.currentTarget,'¿Cómo se ordena?',`<p>Arriba van las que siguen abiertas y aún no te postulas. Puedes ordenarlas así:</p>
    <ol class="order"><li><span>1</span><span><b>Sugerido:</b> primero las que llevan más días publicadas, para que no se te pasen.</span></li><li><span>2</span><span><b>Salario:</b> el máximo publicado, de mayor a menor. Revisa si es bruto o neto.</span></li><li><span>3</span><span><b>Recientes:</b> las que guardaste al último.</span></li></ol>`));
}
/* re-layout when the frame crosses the preview breakpoint (rows expand inline below 860 px) */
window.afterRender=()=>{if(isNarrow()!==wasNarrow)render(false)};
render(true);
/* @dir-js-end */
</script>
</body>
</html>
