  const first=items[0],last=items[items.length-1];
  if(!ov.contains(document.activeElement)){first.focus();e.preventDefault();return}
  if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}
  else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}
}
function renderFrame(f){
  const a=document.activeElement;
  const inF=a&&f.el.contains(a);
  const fk=inF?(a.closest('[data-fk]')||{}).dataset?.fk:null;
  const ss=inF&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  const sc=$('.page',f.el),top=sc?sc.scrollTop:0;
  const ovScroll=$$('[data-keep]',f.el).map(x=>[x.dataset.keep,x.scrollTop]);
  f.el.innerHTML=AB.render(f);uniq(f.el,f.m?'-m':'-d');fixIndeterminate(f.el);
  const sc2=$('.page',f.el);if(sc2)sc2.scrollTop=top;
  ovScroll.forEach(([k,v])=>{const x=$(`[data-keep="${k}"]`,f.el);if(x)x.scrollTop=v});
  const want=f.focus||fk;f.focus=null;const noAuto=f.noAuto;
  let tgt=null;
  if(want)tgt=$(`[data-fk="${CSS.escape(want)}"]`,f.el);
  if(!tgt&&!f.noAuto&&$('.ov',f.el)){tgt=$('.ov [data-autofocus]',f.el)||$('.ov .sh-b input:checked',f.el)||$('.ov .sh-b input, .ov .dlg-b input, .ov .sh-b button',f.el)||$('.ov button',f.el)}
  if(tgt){tgt.focus({preventScroll:true});if(ss&&tgt.setSelectionRange&&want===fk)try{tgt.setSelectionRange(ss[0],ss[1])}catch(_){}}
  f.noAuto=false;layout();

function uniq(root,suf){
  const ids=new Set($$('[id]',root).map(e=>e.id));
  $$('[id]',root).forEach(e=>e.id=e.id+suf);
  $$('[for],[aria-labelledby],[aria-describedby],[aria-controls]',root).forEach(e=>{
    ['for','aria-labelledby','aria-describedby','aria-controls'].forEach(a=>{const v=e.getAttribute(a);if(v)e.setAttribute(a,v.split(/\s+/).map(x=>ids.has(x)?x+suf:x).join(' '))})});
  $$('a[href^="#"]',root).forEach(a=>{const h=a.getAttribute('href').slice(1);if(ids.has(h))a.setAttribute('href','#'+h+suf)});
  $$('input[name]',root).forEach(i=>i.name+=suf);
}
function layout(){
  const ab=$('.ab');if(!ab)return;
  const avail=Math.max(320,ab.clientWidth-48);
  const fd=$('.fr.d'),fm=$('.fr.m');
  fd.hidden=AB.view==='mobile';fm.hidden=AB.view==='desktop';
  const side=AB.view==='side'&&avail>=1100;
  let sd=Math.min(1,avail/1440);
  if(AB.view==='side'&&side)sd=Math.min(1,(avail-32-390)/1440);
  $$('.frames',ab)[0].style.flexWrap=side?'nowrap':'wrap';
  [[fd,sd,1440],[fm,Math.min(1,avail/390),390]].forEach(([fr,s,w])=>{
    const vp=$('.vp',fr);vp.classList.toggle('auto',AB.full);
    vp.style.transform='scale('+s+')';
    const sc=$('.scaler',fr);sc.style.width=w*s+'px';sc.style.height=vp.offsetHeight*s+'px';
  });
}

   case 'leave-stay':s.ov=s.prev;s.prev=null;s.confirmTo=null;break;
   case 'leave-discard':s.tbd=clone(s.tb);s.notice=null;if(s.confirmTo==='close')close();else{close();if(s.confirmTo)s.sec=s.confirmTo}s.confirmTo=null;break;
   case 'nav':{const to=el.dataset.sec;if(s.sec==='talento'&&dirty(s)&&to!=='talento'){s.ov='leave';s.confirmTo=to;f.focus='lv-stay'}else{s.sec=to;s.saved=s.saved&&to==='talento'}break}
   case 'tb-open':s.ov='tb';s.tbd=clone(s.tb);s.saved=false;s.notice=null;f.focus='tb-first';break;
   case 'tb-mode':s.tbd.mode=el.dataset.v;s.saved=false;break;
   case 'tb-pick':{const v=el.dataset.v,i=s.tbd.sel.indexOf(v);i>=0?s.tbd.sel.splice(i,1):s.tbd.sel.push(v);s.saved=false;break}
   case 'tb-all':s.tbd.sel=s.tbd.sel.length===REC.length?[]:REC.map(r=>r.id);s.saved=false;break;
   case 'tb-discard':s.tbd=clone(s.tb);s.notice=null;s.saved=false;break;
   case 'tb-save':
     s.tb=clone(s.tbd);s.notice=null;
     if(s.host==='sheet'||s.ov==='tb'){close();s.toast=['Cambio guardado','Quién ve la Base de talento ya está actualizado. Queda registrado en la auditoría.'];f.focus='tb-open'}
     else s.saved=true;
     break;
   case 'loc-open':s.ov='loc';s.locD={...(s.loc||{country:'',cp:'',state:'',muni:''})};f.focus='loc-first';break;
   case 'loc-clear':s.locD={country:'',cp:'',state:'',muni:''};f.focus='loc-first';break;
   case 'loc-save':{const d=s.locD;s.loc=d&&d.muni?{...d}:null;close();s.toast=['Ubicación actualizada.','La ubicación de tu empresa quedó guardada.'];f.focus='loc-open';break}
   case 'theme-open':s.ov='theme';f.focus='theme-first';break;
   case 'theme-set':s.theme=el.dataset.v;break;
   case 'sheet-soon':s.ov='soon';s.soonKey=el.dataset.k;break;
   default:if(AB.extraAct&&AB.extraAct(f,act,el,e)===false)return;
  }
  if(act!=='tb-save'&&act!=='loc-save')s.toast=act==='ov-close'||act==='nav'?null:s.toast;
  f.render();
}
AB.onInput=(f,e)=>{const t=e.target;if(t.dataset&&t.dataset.loc&&f.s.locD)f.s.locD[t.dataset.loc]=t.value};
AB.onEscape=(f,e)=>{const s=f.s;if(s.ov){if(s.ov==='leave'){settingsAct(f,'leave-stay',null,e);return true}settingsAct(f,'ov-close',null,e);return true}return false};
AB.onAct=settingsAct;

/* shared CSS needs: .tbbar etc. live in settings.css */

function tbSheet(f){
  const s=f.s,dr=dirty(s);
  const foot=`<button class="btn outline" data-act="ov-close" data-fk="tb-cancel">Cancelar</button><button class="btn primary" data-act="tb-save" ${dr?'':'disabled'}>Guardar cambios</button>${dr?'<span class="bgw"><span class="badge b-review dot" role="status">Cambios sin guardar</span></span>':''}`;
  return sheetHTML({id:'tb',title:'Base de talento visible para',desc:TB_DESC,body:tbForm(s,f.m),foot,m:f.m});
}
function themeSheet(f){
  const s=f.s;
  return sheetHTML({id:'th',title:'Apariencia',desc:'Elige el tema de la interfaz para este dispositivo. Se aplica al instante en toda la aplicación.',m:f.m,
   body:choiceList({name:'th',legend:'Tema de la interfaz',options:THEMES.map(([v,t,d,i])=>({v,act:'theme-set',title:t,desc:d,lead:ic(i)})),value:s.theme})});
}
const themeName=v=>THEMES.find(x=>x[0]===v)[1];

/* ---------- D3 · lista de ajustes tipo iOS/macOS ---------- */
const chev=ic('right','ch-i');
function gRow({i,t,v,st=false,kind='static',act='',fk='',stack=false,soon=false,href=false}){
  const inner=`<span class="tile${soon?'':' pr'}" aria-hidden="true">${ic(i)}</span><span class="t">${t}</span>${v?`<span class="v${st?' st':''}">${v}</span>`:''}`;
  if(kind==='btn')return `<li><button class="grow${stack?' stack':''}" data-act="${act}" data-fk="${fk}" aria-haspopup="dialog">${inner}${chev}</button></li>`;
  if(kind==='link')return `<li><a class="grow" href="#" data-act="noop">${inner}${ic('upright','ch-i')}<span class="sr">(abre otra página)</span></a></li>`;
  if(kind==='soon')return `<li><div class="grow" aria-disabled="true">${inner}</div></li>`;
  return `<li><div class="grow${stack?' stack':''}">${inner}</div></li>`;
}
function group(id,h,rows,foot=''){return `<section class="gl" aria-labelledby="${id}"><h2 id="${id}">${h}</h2><ul class="gbox">${rows.join('')}</ul>${foot?`<p class="foot">${foot}</p>`:''}</section>`}
function listD3(s){
  const o=s.role==='owner';
  const emp=[
   gRow({i:'building',t:'Nombre',v:CO.name,st:true}),
   gRow({i:'shield',t:'Estado',v:`<span class="badge b-success dot">${CO.status}</span>`}),
   gRow({i:'hash',t:'RFC',v:CO.rfc,st:true}),
   gRow({i:'factory',t:'Industria',v:CO.industry,st:true,stack:true}),
   o?gRow({i:'pin',t:'Ubicación',v:s.loc?locLabel(s.loc):'Sin ubicación',kind:'btn',act:'loc-open',fk:'loc-open',stack:true})
    :gRow({i:'pin',t:'Ubicación',v:s.loc?locLabel(s.loc):'Sin ubicación',st:true,stack:true}),
   gRow({i:'usersround',t:'Tu rol',v:o?'Dueño':'Reclutador',st:true})];
  const acc=[];
  if(o)acc.push(gRow({i:'library',t:'Base de talento visible para',v:tbSummary(s.tb),kind:'btn',act:'tb-open',fk:'tb-open'}));
  acc.push(gRow({i:'usersround',t:'Equipo y permisos',kind:'link'}));
  acc.push(gRow({i:'globe',t:'Sitio de empleo',kind:'link'}));
  const pref=[gRow({i:'palette',t:'Apariencia',v:themeName(s.theme),kind:'btn',act:'theme-open',fk:'theme-open'}),
   ...SOON.map(([i,t])=>gRow({i,t,v:'<span class="soon">'+ic('clock')+'Próximamente</span>',kind:'soon',soon:true}))];
  return `<div class="d3">${group('g1','Tu empresa',emp,o?'':'Solo el dueño puede editar la ubicación de la empresa.')}${group('g2','Acceso y equipo',acc,o?'Define quién puede usar la Base de talento. El dueño siempre tiene acceso.':'')}${group('g3','Preferencias',pref,'Las opciones en «Próximamente» todavía no se pueden cambiar.')}</div>`;
}
function loadingD3(){
  const r=()=>`<li><div class="grow"><span class="sk" style="width:32px;height:32px;border-radius:10px"></span>${skel('120px',16)}<span style="margin-left:auto">${skel('130px',16)}</span></div></li>`;
  return `<div class="d3" aria-busy="true"><span role="status" class="sr">Cargando empresa</span><div class="gl" aria-hidden="true"><div style="padding:0 16px">${skel('80px',12)}</div><ul class="gbox">${r()}${r()}${r()}${r()}${r()}</ul></div><div class="gl" aria-hidden="true"><div style="padding:0 16px">${skel('110px',12)}</div><ul class="gbox">${r()}${r()}${r()}</ul></div></div>`;
}
function overlayD3(f){
  const s=f.s;
  if(s.ov==='loc')return locOverlay(f);
  if(s.ov==='tb')return tbSheet(f);
  if(s.ov==='theme')return themeSheet(f);
  if(s.ov==='leave')return leaveOverlay(f);
  return '';
}
AB.render=f=>{
  const s=f.s;
  return shell(f,{active:'Configuración',title:'Configuración',body:s.loading?loadingD3():listD3(s),overlay:overlayD3(f),toast:toastHTML(s),role:s.role});
};
AB.scenarios=settingsScenarios('sheet');
