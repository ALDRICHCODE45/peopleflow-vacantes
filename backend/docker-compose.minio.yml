# Local-only disposable site-image storage.
# Bucket bootstrap: run the tagged MinIO tests documented in docs/site-media.md.
name: peopleflow-site-media
services:
  minio:
    image: peopleflow/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./docker/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: site-local
      MINIO_ROOT_PASSWORD: site-local-disposable-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - site-media:/data
volumes:
  site-media:
